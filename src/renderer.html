    const stackCountEl = document.getElementById('stackCount');
    const stackTitleEl = document.getElementById('stackTitle');
    // ids currently drawn in the deck, so we only animate what actually changed
    let stackDrawn = [];
    // rasterized stack, handed to the OS as the drag cursor; rebuilt off the
    // critical path because dragstart can't wait on image decoding
    let stackIconUrl = null;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function timeAgo(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 10) return 'just now';
      if (s < 60) return s + 's ago';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm ago';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.floor(h / 24) + 'd ago';
    }

    // A colour is not a kind of clip the way a url or an image is -- it is a
    // text clip whose content happens to be nothing but colour values. Deriving
    // it from content rather than stamping a type at capture means the filter
    // works on everything already in the history, not only on what arrives
    // after this ships. Several values still count, so a palette copied out of
    // the colour panel is one colour clip rather than none.
    const COLOUR_VALUE = /#(?:[0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})\b|(?:rgb|hsl)a?\([^)]*\)/gi;
    function looksLikeColour(text) {
      const t = String(text || '').trim();
      if (!t || t.length > 400) return false;
      COLOUR_VALUE.lastIndex = 0;
      if (!COLOUR_VALUE.test(t)) return false;
      COLOUR_VALUE.lastIndex = 0;
      const leftover = t.replace(COLOUR_VALUE, '').replace(/[\s,;|]/g, '');
      return leftover.length === 0;
    }

    // Whether a clip reads as a colour at all. The row badge and the detail
    // panel both ask this, so they cannot disagree about what they are showing.
    function clipColours(c) {
      if (!c || c.type !== 'text' || c.isPrompt) return [];
      return colourValues(c.content);
    }

    // the individual values, for a row that wants to show a chip per colour
    function colourValues(text) {
      if (!looksLikeColour(text)) return [];
      COLOUR_VALUE.lastIndex = 0;
      return String(text).trim().match(COLOUR_VALUE) || [];
    }

    // A picture's text has been read in the background. Patch every copy the
    // drawer holds so a search can reach it, and only re-render if a search is
    // running — otherwise nothing on screen changes and a redraw would fight
    // whatever the user is doing.
    function applyIndexedText(id, text) {
      let touched = false;
      [history, pinned, sessionClips].forEach(store => {
        store.forEach(c => { if (c.id === id) { c.ocrText = text; touched = true; } });
      });
      if (touched && searchQuery) render();
    }

    // Which app a clip was copied out of, worked out a moment after it arrived.
    // Unlike text inside a picture this shows on the row, so it always redraws.
    function applySourceApp(id, app, icon) {
      // The icon is cached by app rather than by clip, so one answer dresses
      // every row that came from the same place, including old ones.
      if (app && icon) sourceIcons[app] = icon;
      let touched = false;
      [history, pinned, sessionClips].forEach(store => {
        store.forEach(c => { if (c.id === id) { c.sourceApp = app; touched = true; } });
      });
      if (touched) render();
    }

    // What a search looks at. A picture's content is its filename, which nobody
    // remembers; what they remember is what was *in* it, which is why the text
    // read out of it is searched too. A name the user gave it counts as well —
    // they chose those words to find it by.
    function matchesSearch(c) {
      if (!searchQuery) return true;
      if (String(c.content || '').toLowerCase().includes(searchQuery)) return true;
      if (String(c.name || '').toLowerCase().includes(searchQuery)) return true;
      // "figma" should find what you copied out of Figma, which is how people
      // actually go looking for something they half-remember.
      if (String(c.sourceApp || '').toLowerCase().includes(searchQuery)) return true;
      return String(c.ocrText || '').toLowerCase().includes(searchQuery);
    }

    // True when the only reason this clip is on screen is the text inside it.
    // A screenshot turning up in the results for a word that is nowhere in the
    // row reads as a bug unless the row says why it is there.
    function matchedOnImageText(c) {
      if (!searchQuery || c.type !== 'img') return false;
      if (String(c.content || '').toLowerCase().includes(searchQuery)) return false;
      if (String(c.name || '').toLowerCase().includes(searchQuery)) return false;
      if (String(c.sourceApp || '').toLowerCase().includes(searchQuery)) return false;
      return String(c.ocrText || '').toLowerCase().includes(searchQuery);
    }

    // The line of the extracted text the search actually hit, trimmed to
    // something that fits on a row, so the match is legible rather than merely
    // asserted.
    function imageTextExcerpt(c) {
      const text = String(c.ocrText || '');
      const at = text.toLowerCase().indexOf(searchQuery);
      if (at === -1) return '';
      const from = Math.max(0, at - 24);
      const slice = text.slice(from, at + searchQuery.length + 40).replace(/\s+/g, ' ').trim();
      return (from > 0 ? '…' : '') + slice + (at + searchQuery.length + 40 < text.length ? '…' : '');
    }

    function itemMatchesFilter(c, isPinned) {
      // The rail decides which place you're in; these only narrow by type.
      // prompt and pinned used to live here as pseudo-types, which is why the
      // row wrapped onto two lines.
      if (searchQuery && !matchesSearch(c)) return false;
      if (activeFilter === 'color') return looksLikeColour(c.content);
      if (activeFilter !== 'all' && c.type !== activeFilter) return false;
      return true;
    }

    // URL helpers
    function domainOf(url) {
      try {
        const u = new URL(url);
        return u.hostname.replace(/^www\./, '');
      } catch { return null; }
    }
    function urlHeadline(url) {
      try {
        const u = new URL(url);
        const path = (u.pathname + u.search).replace(/^\//, '');
        if (path.length > 0) return path.slice(0, 80);
        return u.hostname.replace(/^www\./, '');
      } catch { return url.slice(0, 80); }
    }

    // crude language detection — used for the small lang-tag on code clips
    function detectLang(text) {
      const t = text.trim();
      if (/^\s*<[a-z]/i.test(t)) return 'html';
      if (/^\s*(import|from|def |class )/.test(t)) return 'py';
      if (/(^|\s)(function|const|let|var|=>|import .* from)/.test(t)) return 'js';
      if (/^\s*SELECT |^\s*INSERT |^\s*UPDATE |^\s*WHERE /i.test(t)) return 'sql';
      if (/(^|\s)#include|::\s*\w+/.test(t)) return 'c';
      if (/^\s*\{[\s\S]*\}\s*$/.test(t) && t.includes('"')) return 'json';
      return null;
    }

    // ---------- multi-select ----------
    // Resolve selected ids back to clips, in the order they appear on screen,
    // so a batch drop lands in the same order the user sees.
    function selectedClips() {
      // Collection clips live in their own store, so leaving them out of this
      // lookup made selection inside a collection resolve to nothing: the ids were
      // held, the tray saw an empty list and hid itself, and a drag carried
      // nothing. Collections come last so their copy wins for a clip held in both —
      // it's the one with the permanent image file.
      const byId = new Map([...pinned, ...history, ...sessionClips].map(c => [c.id, c]));
      return renderedOrder.filter(id => selected.has(id)).map(id => byId.get(id)).filter(Boolean);
    }

    function selectRange(fromId, toId) {
      const a = renderedOrder.indexOf(fromId);
      const b = renderedOrder.indexOf(toId);
      if (a === -1 || b === -1) { selected.add(toId); return; }
      const [lo, hi] = a < b ? [a, b] : [b, a];
      for (let i = lo; i <= hi; i++) selected.add(renderedOrder[i]);
    }

    function clearSelection() {
      selected.clear();
      anchorId = null;
      syncSelection();
    }

    // Paint selection state without a full re-render — re-rendering on every
    // click would rebuild every row and kill the drag the user is about to
    // start. `originRect` is the row a clip was just taken from, so its card
    // can fly out of that row instead of blinking into existence.
    function syncSelection(originRect) {
      document.querySelectorAll('.item').forEach(n => {
        n.classList.toggle('selected', selected.has(n.dataset.id));
      });
      updateStack(originRect);
    }

    // ---------- the rail ----------
    // Every top-level place is a rail item: everything, prompts, pinned, one
    // per collection, and new. Choosing one swaps what the list shows, which is
    // why there are no section headers any more.
    const railEl = document.getElementById('rail');
    const railSessionsEl = document.getElementById('railSessions');
    const scopeNameEl = document.getElementById('scopeName');
    const scopeCountEl = document.getElementById('scopeCount');
    const scopeActionsEl = document.getElementById('scopeActions');

    const RAIL_ICONS = {
      all: '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
      // a four-point sparkle, so prompts never reads as a second star
      prompts: '<svg viewBox="0 0 24 24"><path d="M12 3.5c.6 4.2 1.8 5.4 6 6-4.2.6-5.4 1.8-6 6-.6-4.2-1.8-5.4-6-6 4.2-.6 5.4-1.8 6-6z"/><path d="M18.5 15.5c.25 1.6.75 2.1 2.3 2.3-1.55.25-2.05.75-2.3 2.3-.25-1.55-.75-2.05-2.3-2.3 1.55-.2 2.05-.7 2.3-2.3z"/></svg>',
      pinned: '<svg viewBox="0 0 24 24"><path d="M12 4l2.3 5.1 5.7.6-4.2 3.8 1.2 5.5L12 16.3 7 19l1.2-5.5L4 9.7l5.7-.6z"/></svg>',
      folder: '<svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 012-2h3.2l1.6 2H18a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2z"/></svg>',
      add: '<svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>',
    };

    function activeSession() {
      return sessions.find(s => s.id === activeSessionId) || null;
    }

    function updateCollectionBanner() {
      const active = activeSession();
      if (!active) {
        collectionBannerEl.classList.remove('show');
        collectionBannerNameEl.textContent = '';
        collectionBannerCountEl.textContent = '0';
        collectionBannerCountEl.title = '';
        return;
      }
      const collectionCount = sessionClips.filter(c => c.sessionId === active.id).length;
      const suffix = collectionCount === 1 ? 'clip' : 'clips';
      collectionBannerNameEl.textContent = active.name;
      collectionBannerCountEl.textContent = String(collectionCount);
      collectionBannerCountEl.title = `${collectionCount} ${suffix} in this collection`;
      collectionBannerEl.classList.add('show');
    }

    function scopeIsSession(id) {
      return sessions.some(s => s.id === id);
    }

    function scopeLabel(id) {
      if (id === 'prompts') return 'prompts';
      if (id === 'pinned') return 'pinned';
      const s = sessions.find(x => x.id === id);
      return s ? s.name : 'everything';
    }

    // What belongs in each place. Prompts and pinned share one store, told
    // apart by the flag; collections keep their own copies.
    function clipsForScope(id) {
      if (id === 'prompts') return pinned.filter(c => c.isPrompt);
      if (id === 'pinned') return pinned.filter(c => !c.isPrompt);
      if (scopeIsSession(id)) return clipsInSession(id);
      // everything: kept things first, then the running history
      return [...pinned.filter(c => c.isPrompt), ...pinned.filter(c => !c.isPrompt), ...history];
    }

    // Which run of rows a clip belongs to. Everything shows three lists stacked
    // — prompts, then pinned, then the running history — and each is its own
    // array, so a row can only be reordered among its own kind.
    function blockOf(clip, isPinned, sessionId) {
      if (sessionId) return 'session';
      if (clip.isPrompt) return 'prompt';
      // which array it actually lives in decides this, not the pinnedAt stamp
      // the row was drawn from — the two must not be able to disagree
      if (isPinned || pinned.some(p => p.id === clip.id)) return 'pinned';
      return 'history';
    }

    // Everything else keeps an order; history cannot. It is memory-only and
    // capped, every new copy lands at the top, and it is gone at the next
    // restart — an order arranged there would quietly undo itself.
    const canOrderBlock = (block) => block !== 'history';

    function railItem(id, label, icon, cls) {
      const b = document.createElement('button');
      b.className = 'rail-item ' + (cls || '') + (activeScope === id ? ' on' : '');
      b.dataset.scope = id;
      b.title = label;
      b.innerHTML = icon + '<span class="lbl"></span>';
      b.querySelector('.lbl').textContent = label;
      b.addEventListener('click', () => {
        activeScope = id;
        // a tag filter belongs to prompts; leaving prompts clears it
        if (id !== 'prompts') activeTag = null;
        render();
      });
      return b;
    }

    function buildRail() {
      // Build into fragments and swap each card in one shot. Clearing and then
      // appending across a dozen statements leaves a window where a render
      // re-entered from a state update interleaves its own appends with ours,
      // and every place ends up in the rail twice.
      const places = document.createDocumentFragment();
      places.appendChild(railItem('all', 'all', RAIL_ICONS.all, ''));
      places.appendChild(railItem('prompts', 'prompts', RAIL_ICONS.prompts, 'prompts'));
      places.appendChild(railItem('pinned', 'pinned', RAIL_ICONS.pinned, 'pinned'));

      // The collections card: "new" holds the top, whatever exists stacks under it.
      const sess = document.createDocumentFragment();

      const add = document.createElement('button');
      add.className = 'rail-item';
      add.id = 'railAdd';
      add.title = 'new collection';
      add.innerHTML = RAIL_ICONS.add + '<span class="lbl">new</span>';
      add.addEventListener('click', (e) => {
        // this handler removes its own button, so the click must not reach any
        // dismiss-on-outside-click listener
        e.stopPropagation();
        const input = document.createElement('input');
        input.className = 'rail-name';
        input.placeholder = 'name';
        input.maxLength = 40;
        input.addEventListener('keydown', async (ev) => {
          ev.stopPropagation();
          if (ev.key === 'Enter') {
            ev.preventDefault();
            const name = input.value.trim();
            if (!name) return;
            const id = await window.api.createSession(name);
            if (id) activeScope = id;
            toast('collecting into “' + name + '”');
          }
          if (ev.key === 'Escape') { ev.preventDefault(); render(); }
        });
        input.addEventListener('blur', () => render());
        add.replaceWith(input);
        input.focus();
      });
      sess.appendChild(add);

      // nothing to divide "new" from until a collection exists
      if (sessions.length) {
        const sep = document.createElement('div');
        sep.className = 'rail-sep';
        sess.appendChild(sep);
      }

      sessions.forEach(s => {
        const el = railItem(s.id, s.name, RAIL_ICONS.folder, 'session');
        if (s.id === activeSessionId) {
          const dot = document.createElement('span');
          dot.className = 'rec';
          dot.title = 'collecting into this collection';
          el.appendChild(dot);
        }
        sess.appendChild(el);
      });

      railEl.replaceChildren(places);
      railSessionsEl.replaceChildren(sess);
    }

    // The scope header carries whatever the place itself needs: collecting and
    // rename and delete for a collection, the tag filter for prompts.
    function buildScopeHead(count) {
      scopeNameEl.textContent = scopeLabel(activeScope);
      scopeCountEl.textContent = count + (count === 1 ? ' clip' : ' clips');
      scopeActionsEl.innerHTML = '';

      if (activeScope === 'prompts') {
        const tagFilter = buildTagFilter();
        if (tagFilter) scopeActionsEl.appendChild(tagFilter);
        return;
      }
      if (!scopeIsSession(activeScope)) return;

      const session = sessions.find(s => s.id === activeScope);
      const collecting = session.id === activeSessionId;

      const collect = document.createElement('button');
      collect.className = 'scope-btn' + (collecting ? ' on' : '');
      collect.dataset.act = 'collect';
      collect.textContent = collecting ? 'collecting' : 'collect here';
      collect.title = collecting ? 'stop collecting into this collection' : 'send new copies here';
      collect.addEventListener('click', () => {
        window.api.setActiveSession(collecting ? null : session.id);
      });

      const rename = document.createElement('button');
      rename.className = 'scope-btn';
      rename.dataset.act = 'rename';
      rename.textContent = 'rename';
      rename.addEventListener('click', (e) => {
        e.stopPropagation();
        const input = document.createElement('input');
        input.className = 'rail-name';
        input.style.width = '110px';
        input.value = session.name;
        input.maxLength = 40;
        input.addEventListener('keydown', async (ev) => {
          ev.stopPropagation();
          if (ev.key === 'Enter') {
            ev.preventDefault();
            const name = input.value.trim();
            if (name) await window.api.renameSession(session.id, name);
            else render();
          }
          if (ev.key === 'Escape') { ev.preventDefault(); render(); }
        });
        input.addEventListener('blur', () => render());
        rename.replaceWith(input);
        input.focus();
        input.select();
      });

      const del = document.createElement('button');
      del.className = 'scope-btn danger';
      del.dataset.act = 'delete';
      del.textContent = 'delete';
      del.title = 'delete this collection and the clips kept in it';
      del.addEventListener('click', async () => {
        // deleting throws away clips that may exist nowhere else, so the second
        // click is the confirmation rather than a dialog
        if (del.dataset.armed !== '1') {
          del.dataset.armed = '1';
          del.textContent = 'sure?';
          setTimeout(() => { del.dataset.armed = '0'; del.textContent = 'delete'; }, 2500);
          return;
        }
        await window.api.deleteSession(session.id);
        activeScope = 'all';
        toast('collection deleted');
      });

      scopeActionsEl.appendChild(collect);
      scopeActionsEl.appendChild(rename);
      scopeActionsEl.appendChild(del);
    }

    function clipsInSession(id) {
      return sessionClips.filter(c => c.sessionId === id);
    }

    function isInSession(clipId, sessionId) {
      return sessionClips.some(c => c.id === clipId && c.sessionId === sessionId);
    }

    // ---------- prompt editor ----------
    // Every store, not just the two the drawer usually shows. A clip collected
    // into a collection and since aged out of history lives only in sessionClips,
    // and leaving it out here made every panel that opens by id -- naming, the
    // editor -- do nothing at all when you clicked it inside a collection.
    function findClip(id) {
      return pinned.find(p => p.id === id)
          || history.find(h => h.id === id)
          || sessionClips.find(c => c.id === id)
          || null;
    }

    function openEditor(id) {
      // both sheets dock to the same edge, so only one can be up at a time
      closeOcr();
      editingId = id;
      const c = findClip(id);
      if (!c) return closeEditor();
      editorBodyEl.value = c.content || '';
      renderEditorTags();
      editorEl.classList.add('show');
      markEditingRow();
      editorBodyEl.focus();
    }

    function closeEditor() {
      flushEditorContent();
      closeTagPicker();
      editingId = null;
      editorEl.classList.remove('show');
      markEditingRow();
    }

    const inspNameEl = document.getElementById('inspName');
    const inspDetailTextEl = document.getElementById('inspDetailText');

    // The panel can be opened three ways — view, or either extractor straight
    // from the row. However you got here it is the same clip, so the name field
    // and the mode switch have to be bound to it either way.
    function bindDetail(id) {
      const c = findClip(id);
      if (!c) return null;
      detailId = id;
      inspNameEl.value = c.name || '';
      buildDetailMeta(c);
      return c;
    }

    async function openDetail(id) {
      const c = bindDetail(id);
      if (!c) return;
      closeEditor();
      ocrSheetEl.classList.remove('show');
      inspMode = 'detail';
      inspectorEl.dataset.mode = 'detail';
      inspTitleEl.textContent = 'preview';
      inspHintEl.textContent = c.meta || typeLabel(c);

      inspDetailTextEl.classList.remove('show');
      inspStageEl.innerHTML = '';

      // Only images have anything to pull out; there is nothing to read out of
      // text that you cannot already see in front of you.
      setModes(c.type === 'img', null);

      if (c.type === 'img') {
        // the full picture where we still have it, the row's thumbnail where we
        // don't — an empty panel reads as the button having done nothing
        const full = c.filepath ? toFileUrl(c.filepath) : null;
        await showInspectorImage(full || c.dataUrl, 0, 0);
        const img = inspStageEl.querySelector('img');
        if (img) {
          img.addEventListener('error', () => {
            if (c.dataUrl && img.src !== c.dataUrl) { img.src = c.dataUrl; return; }
            inspStageEl.innerHTML = '';
            inspDetailTextEl.textContent = 'that picture is no longer on disk — you can still name the clip';
            inspDetailTextEl.classList.add('show');
          });
        }
      } else {
        await window.api.expandWindow(true);
        inspectorEl.classList.add('show');
        inspDetailTextEl.textContent = c.content || '';
        inspDetailTextEl.classList.add('show');
      }
      inspNameEl.focus();
      inspNameEl.select();
    }

    const inspMetaEl = document.getElementById('inspMeta');

    // "20 Aug 2025, 11:34 AM"
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                    'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function formatAdded(ts) {
      if (!ts) return '-';
      const d = new Date(ts);
      const ampm = d.getHours() >= 12 ? 'PM' : 'AM';
      const h = d.getHours() % 12 || 12;
      const mm = String(d.getMinutes()).padStart(2, '0');
      return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear()
           + ', ' + h + ':' + mm + ' ' + ampm;
    }

    // The browser is the one parser guaranteed to agree with what it renders,
    // so any CSS colour -- hex, rgb(), hsl() -- goes through canvas to come
    // back normalised. A detached context is enough; no layout is involved.
    const COLOUR_PARSER = document.createElement('canvas').getContext('2d');
    function toRgb(value) {
      COLOUR_PARSER.fillStyle = '#000000';
      COLOUR_PARSER.fillStyle = value;
      const out = COLOUR_PARSER.fillStyle;
      if (out[0] === '#') {
        return [parseInt(out.slice(1, 3), 16),
                parseInt(out.slice(3, 5), 16),
                parseInt(out.slice(5, 7), 16)];
      }
      const n = out.match(/[0-9.]+/g) || [];
      return [Number(n[0]) || 0, Number(n[1]) || 0, Number(n[2]) || 0];
    }

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const l = (max + min) / 2;
      const d = max - min;
      let h = 0, sat = 0;
      if (d) {
        sat = d / (1 - Math.abs(2 * l - 1));
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h = (h * 60 + 360) % 360;
      }
      return [h, sat * 100, l * 100];
    }

    // sRGB -> linear -> XYZ (D65) -> CIELAB -> LCh. Worth the arithmetic:
    // LCh is the space where "same lightness, different hue" actually holds,
    // which is the one a person building a palette cares about.
    function rgbToLch(r, g, b) {
      const lin = (v) => {
        v /= 255;
        return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      };
      const R = lin(r), G = lin(g), B = lin(b);
      const X = R * 0.4124564 + G * 0.3575761 + B * 0.1804375;
      const Y = R * 0.2126729 + G * 0.7151522 + B * 0.0721750;
      const Z = R * 0.0193339 + G * 0.1191920 + B * 0.9503041;
      const f = (t) => t > 216 / 24389 ? Math.cbrt(t) : (24389 / 27 * t + 16) / 116;
      const fx = f(X / 0.95047), fy = f(Y), fz = f(Z / 1.08883);
      const L = 116 * fy - 16;
      const a = 500 * (fx - fy);
      const bb = 200 * (fy - fz);
      const C = Math.sqrt(a * a + bb * bb);
      // A grey has no hue. Reporting whatever atan2 makes of the rounding
      // noise would have white claiming a hue of 158 degrees.
      if (C < 0.05) return [L, C, 0];
      let H = Math.atan2(bb, a) * 180 / Math.PI;
      if (H < 0) H += 360;
      return [L, C, H];
    }

    const r1 = (n) => Math.round(n * 10) / 10;
    function colourSpaceRows(value) {
      const [r, g, b] = toRgb(value);
      const [h, sPct, lPct] = rgbToHsl(r, g, b);
      const [L, C, H] = rgbToLch(r, g, b);
      const hex = (n) => n.toString(16).padStart(2, "0");
      return [
        ['Hex', ('#' + hex(r) + hex(g) + hex(b)).toUpperCase()],
        ['RGB', 'rgb(' + r + ', ' + g + ', ' + b + ')'],
        ['HSL', 'hsl(' + Math.round(h) + ', ' + Math.round(sPct) + '%, ' + Math.round(lPct) + '%)'],
        ['LCH', 'lch(' + r1(L) + '% ' + r1(C) + ' ' + r1(H) + ')'],
      ];
    }

    function typeBadgeFor(c) {
      const kind = clipColours(c).length ? "color"
                 : c.type === 'img' ? 'img'
                 : c.type === 'code' ? 'code'
                 : c.type === 'url' ? 'url' : 'text';
      const b = document.createElement('span');
      b.className = 'type-badge ' + kind;
      b.textContent = kind;
      return b;
    }

    // The facts about a clip, beneath the picture of it: what it is, how big,
    // when it arrived, and which collections are holding on to it.
    function buildDetailMeta(c) {
      const rows = [['File Type', typeBadgeFor(c)]];

      // A colour is worth reading in more than one space: hex to paste, RGB
      // to reason about, HSL to nudge, LCH to compare against its neighbours.
      const colours = clipColours(c);
      if (colours.length === 1) {
        colourSpaceRows(colours[0]).forEach(row => rows.push(row));
      } else if (colours.length > 1) {
        rows.push(['Colours', colours.length + ' values']);
      }

      if (c.meta) rows.push(['Dimensions', c.meta]);
      rows.push(['Added', formatAdded(c.ts)]);
      const held = sessionsHolding(c.id).map(x => x.name);
      rows.push(['Collections', held.length ? held.join(', ') : '-']);

      const frag = document.createDocumentFragment();
      rows.forEach(([k, v]) => {
        const row = document.createElement('div');
        row.className = 'meta-row';
        const key = document.createElement('span');
        key.className = 'meta-key';
        key.textContent = k;
        const val = document.createElement('span');
        val.className = 'meta-val';
        if (v instanceof Node) val.appendChild(v); else val.textContent = v;
        row.appendChild(key);
        row.appendChild(val);
        frag.appendChild(row);
      });
      inspMetaEl.replaceChildren(frag);
    }

    function typeLabel(c) {
      return c.type === 'img' ? 'image' : c.type === 'url' ? 'link' : c.type === 'code' ? 'code' : 'text';
    }

    // filepath is an OS path; the panel needs a URL it can load
    function toFileUrl(p) {
      return 'file:///' + String(p).split('\\').join('/').replace(/^\/+/, '');
    }

    async function commitDetailName() {
      if (!detailId) return;
      const c = findClip(detailId);
      const next = inspNameEl.value.trim();
      if (!c || (c.name || '') === next) return;
      await window.api.renameClip(detailId, next);
    }

    inspNameEl.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); commitDetailName(); inspNameEl.blur(); }
      else if (e.key === 'Escape') {
        e.preventDefault();
        const c = detailId ? findClip(detailId) : null;
        inspNameEl.value = (c && c.name) || '';
        inspNameEl.blur();
      }
    });
    inspNameEl.addEventListener('blur', () => commitDetailName());

    // Which of the two you are in, and whether either is on offer at all.
    // Called on open and again whenever a mode finishes loading.
    function setModes(available, active) {
      document.getElementById('inspModes').classList.toggle('show', !!available);
      document.getElementById('detailText').classList.toggle('is-on', active === 'text');
      document.getElementById('detailColor').classList.toggle('is-on', active === 'color');
    }

    document.getElementById('detailText').addEventListener('click', () => {
      if (detailId) runOcr(detailId);
    });
    document.getElementById('detailColor').addEventListener('click', () => {
      if (detailId) runPalette(detailId);
    });

    // Which collections currently hold this clip.
    function sessionsHolding(clipId) {
      return sessions.filter(s => sessionClips.some(c => c.id === clipId && c.sessionId === s.id));
    }

    const sesMenuEl = document.getElementById('sesMenu');
    const sesMenuListEl = document.getElementById('sesMenuList');
    const sesMenuHeadEl = document.getElementById('sesMenuHead');
    let sesMenuClipId = null;

    function closeSessionMenu() {
      sesMenuClipId = null;
      sesMenuEl.classList.remove('show');
    }

    function openSessionMenu(clipId, anchorEl) {
      // pressing the same button again puts it away
      if (sesMenuClipId === clipId && sesMenuEl.classList.contains('show')) return closeSessionMenu();
      sesMenuClipId = clipId;
      renderSessionMenu();
      sesMenuEl.classList.add('show');

      // Anchored to the button, then nudged back inside the window: a row near
      // the bottom would otherwise open a menu that runs off the screen.
      const r = anchorEl.getBoundingClientRect();
      const box = sesMenuEl.getBoundingClientRect();
      const left = Math.min(r.left, window.innerWidth - box.width - 8);
      const below = r.bottom + 6;
      const top = below + box.height > window.innerHeight - 8 ? r.top - box.height - 6 : below;
      sesMenuEl.style.left = Math.max(8, left) + 'px';
      sesMenuEl.style.top = Math.max(8, top) + 'px';
    }

    function renderSessionMenu() {
      const clipId = sesMenuClipId;
      const holding = sessionsHolding(clipId).map(s => s.id);
      sesMenuHeadEl.textContent = holding.length ? 'collections holding this' : 'add to a collection';
      sesMenuListEl.innerHTML = '';

      if (!sessions.length) {
        const none = document.createElement('div');
        none.className = 'none';
        none.textContent = 'no collections yet';
        sesMenuListEl.appendChild(none);
        return;
      }

      sessions.forEach(s => {
        const inIt = holding.includes(s.id);
        const b = document.createElement('button');
        b.type = 'button';
        b.className = inIt ? 'on' : '';
        b.dataset.session = s.id;
        b.title = inIt ? 'take it out of this collection' : 'add it to this collection';
        b.innerHTML = '<span class="tick">' + (inIt ? '✓' : '') + '</span><span>' + esc(s.name) + '</span>';
        b.addEventListener('click', async (ev) => {
          ev.stopPropagation();
          if (inIt) {
            await window.api.removeFromSession(clipId, s.id);
            toast('removed from ' + s.name);
          } else {
            await window.api.addToSession(clipId, s.id);
            toast('added to ' + s.name);
          }
          closeSessionMenu();
        });
        sesMenuListEl.appendChild(b);
      });
    }

    document.addEventListener('mousedown', (e) => {
      if (!sesMenuEl.classList.contains('show')) return;
      if (sesMenuEl.contains(e.target)) return;
      closeSessionMenu();
    });

    function markEditingRow() {
      document.querySelectorAll('.item').forEach(n => {
        n.classList.toggle('editing', !!editingId && n.dataset.id === editingId);
      });
    }

    function flashSaved() {
      editorSavedEl.classList.add('show');
      clearTimeout(flashSaved._t);
      flashSaved._t = setTimeout(() => editorSavedEl.classList.remove('show'), 900);
    }

    // content autosaves as you type; tags save the moment they change
    function flushEditorContent() {
      clearTimeout(editorSaveTimer);
      if (!editingId) return;
      const c = findClip(editingId);
      const next = editorBodyEl.value;
      if (!c || !next.trim() || next === c.content) return;
      window.api.updatePrompt(editingId, { content: next }).then(ok => { if (ok) flashSaved(); });
    }

    function renderEditorTags() {
      const c = editingId ? findClip(editingId) : null;
      const tags = (c && c.tags) || [];
      editorTagsEl.innerHTML = '';
      tags.forEach(t => {
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        chip.innerHTML = `<span></span><span class="tag-x" title="remove">×</span>`;
        chip.firstChild.textContent = t;
        chip.querySelector('.tag-x').addEventListener('click', () => setTags(tags.filter(x => x !== t)));
        editorTagsEl.appendChild(chip);
      });

      const add = document.createElement('button');
      add.className = 'tag-add';
      add.textContent = '+ tag';
      add.addEventListener('click', (e) => { e.stopPropagation(); openTagPicker(); });
      editorTagsEl.appendChild(add);
    }

    async function setTags(tags) {
      if (!editingId) return;
      const ok = await window.api.updatePrompt(editingId, { tags });
      if (ok) flashSaved();
    }

    // ---------- extracted text ----------
    // OCR runs in main; this just shows what came back. Each block is its own
    // row so a screenshot becomes a set of separate copies, not one dump.
    const ocrSheetEl = document.getElementById('ocrSheet');
    const ocrListEl = document.getElementById('ocrList');
    const ocrCountEl = document.getElementById('ocrCount');
    let ocrBusyId = null;

    // the inspector — the picture with its text regions drawn over it
    const inspectorEl = document.getElementById('inspector');
    const inspStageEl = document.getElementById('inspStage');
    const inspOutEl = document.getElementById('inspOut');
    const inspEmptyEl = document.getElementById('inspEmpty');

    // Nothing picked yet: say where to pick it from and what happens next,
    // rather than labelling the empty box.
    function setInspOut(text, isColor) {
      // In colour mode the palette grid is the content, so the card is never
      // empty -- leaving the class on would centre and shrink-wrap the grid.
      if (isColor) {
        inspOutEl.classList.remove('empty');
        inspEmptyEl.replaceChildren();
        return;
      }
      inspOutEl.classList.toggle('empty', !text);
      if (text) { inspEmptyEl.textContent = text; return; }
      const what = isColor ? "colours" : "text";
      const wrap = document.createElement('div');
      wrap.className = 'out-empty';
      const mark = document.createElement('div');
      mark.className = 'out-empty-mark';
      const title = document.createElement('div');
      title.className = 'out-empty-title';
      title.textContent = 'Select ' + what + ' from above';
      const hint = document.createElement('div');
      hint.className = 'out-empty-hint';
      hint.textContent = 'Selected ' + what + ' will be added here, which can then be copied';
      wrap.appendChild(mark);
      wrap.appendChild(title);
      wrap.appendChild(hint);
      inspEmptyEl.replaceChildren(wrap);
    }
    const inspHintEl = document.getElementById('inspHint');
    const inspBlocksEl = document.getElementById('inspBlocks');
    const inspTitleEl = document.getElementById('inspTitle');
    const inspSwatchesEl = document.getElementById('inspSwatches');
    // 'text' draws boxes over the picture; 'color' lists what it's made of.
    // Both are the same panel — one image, one set of things to pick from it.
    let inspMode = 'text';
    let inspColors = [];
    let inspBlocks = [];
    // pixel dimensions of the image OCR read — the space block boxes live in
    let inspSrcW = 0;
    let inspSrcH = 0;
    const inspPicked = new Set();

    function closeOcr() {
      ocrSheetEl.classList.remove('show');
      closeInspector();
    }

    function closeInspector() {
      if (!inspectorEl.classList.contains('show')) return;
      inspectorEl.classList.remove('show');
      inspStageEl.innerHTML = '';
      inspSwatchesEl.innerHTML = '';
      inspBlocks = [];
      inspColors = [];
      inspPicked.clear();
      // a name typed but not yet committed is saved on the way out, rather
      // than silently dropped because the panel was closed instead of blurred
      if (detailId) commitDetailName();
      detailId = null;
      setModes(false, null);
      inspDetailTextEl.classList.remove('show');
      inspMode = 'text';
      inspectorEl.dataset.mode = 'text';
      syncInspOut();
      window.api.expandWindow(false);
    }

    // Both modes show the same picture at the same size, so opening it is
    // shared; only what gets drawn on top differs.
    async function showInspectorImage(src, w, h, onLoad) {
      inspSrcW = w || 0;
      inspSrcH = h || 0;
      inspStageEl.innerHTML = '';
      await window.api.expandWindow(true);
      inspectorEl.classList.add('show');

      const img = new Image();
      img.alt = '';
      inspStageEl.appendChild(img);
      if (onLoad) img.onload = () => onLoad(img);
      img.src = src;
    }

    async function openPalette(src, colors, w, h) {
      inspMode = 'color';
      inspectorEl.dataset.mode = 'color';
      inspColors = colors || [];
      inspTitleEl.textContent = 'colours in this image';
      setModes(true, 'color');
      await showInspectorImage(src, w, h);
      drawSwatches();
      syncInspOut();
    }

    // Open-Color style: a hue family and a step from 0 (lightest) to 9.
    // Two extracted colours can land on the same name; that is honest -- they
    // really are the same family and weight -- and the hex below settles it.
    const HUES = [[15, 'RED'], [45, 'ORANGE'], [70, 'YELLOW'], [160, 'GREEN'],
                  [195, 'TEAL'], [240, 'BLUE'], [270, 'INDIGO'], [310, 'VIOLET'],
                  [345, 'PINK'], [360, 'RED']];
    function colourName(c) {
      const rgb = c.rgb || [0, 0, 0];
      const r = rgb[0] / 255, g = rgb[1] / 255, b = rgb[2] / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const l = (max + min) / 2;
      const d = max - min;
      const step = Math.min(9, Math.max(0, Math.round((1 - l) * 9)));
      const sat = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
      if (sat < 0.12) return 'GRAY ' + step;
      let h;
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h = (h * 60 + 360) % 360;
      const fam = (HUES.find(([edge]) => h < edge) || HUES[0])[1];
      return fam + ' ' + step;
    }

    function drawSwatches() {
      const frag = document.createDocumentFragment();
      inspColors.forEach((c) => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'swatch';
        el.title = 'copy ' + c.hex;

        const chip = document.createElement('span');
        chip.className = 'swatch-chip';
        // the one literal colour that belongs here: it is the extracted value
        chip.style.backgroundColor = c.hex;
        const cue = document.createElement('span');
        cue.className = 'swatch-cue';
        cue.innerHTML = ICON.copy;
        chip.appendChild(cue);

        const name = document.createElement('span');
        name.className = 'swatch-name';
        name.textContent = colourName(c);
        const hex = document.createElement('span');
        hex.className = 'swatch-hex';
        hex.textContent = c.hex;

        el.appendChild(chip);
        el.appendChild(name);
        el.appendChild(hex);

        // One colour, one copy. Colours never accumulate a selection the way
        // text blocks do -- tapping one puts exactly it on the clipboard.
        el.addEventListener('click', async () => {
          await window.api.write({ type: 'text', content: c.hex });
          toast('copied ' + c.hex);
        });
        frag.appendChild(el);
      });
      inspSwatchesEl.replaceChildren(frag);
    }

    // `src` is the full-size image OCR actually read, and w/h are the pixel
    // dimensions the block coordinates belong to — never the on-screen size.
    async function openInspector(src, blocks, w, h) {
      inspMode = 'text';
      inspectorEl.dataset.mode = 'text';
      inspBlocks = blocks;
      inspPicked.clear();
      inspTitleEl.textContent = 'select text from image';
      // the switch stays put between the two, showing where you are
      setModes(true, 'text');
      // widen the OS window first so the picture is measured at its real size
      await showInspectorImage(src, w, h, drawRegions);

      inspHintEl.textContent = blocks.length
        ? `${blocks.length} area${blocks.length === 1 ? '' : 's'} found`
        : 'no text found';
      syncInspOut();
    }

    // Boxes come back in image pixels; the picture is displayed scaled to fit,
    // so every box is scaled by the same factor to land on top of its text.
    function drawRegions(img) {
      inspStageEl.querySelectorAll('.region').forEach(r => r.remove());
      // Position boxes as percentages of the image's natural size rather than
      // measuring the rendered element. naturalWidth is known the moment the
      // image decodes, so this needs no layout to have happened, and the boxes
      // track the picture for free when the window resizes.
      // Scale against the size OCR worked in. Falling back to the element's
      // natural size is only for safety — if the two ever disagree (a preview
      // thumbnail, say) every box would be misplaced by that ratio.
      const nw = inspSrcW || img.naturalWidth || 1;
      const nh = inspSrcH || img.naturalHeight || 1;
      const pct = (v, total) => (v / total * 100) + '%';
      inspBlocks.forEach((b, i) => {
        if (!b.bbox) return;
        const el = document.createElement('div');
        el.className = 'region' + (inspPicked.has(i) ? ' picked' : '');
        el.dataset.index = String(i);
        el.title = b.text;
        el.style.left = pct(b.bbox.x0, nw);
        el.style.top = pct(b.bbox.y0, nh);
        el.style.width = pct(b.bbox.x1 - b.bbox.x0, nw);
        el.style.height = pct(b.bbox.y1 - b.bbox.y0, nh);
        el.addEventListener('click', () => {
          if (inspPicked.has(i)) inspPicked.delete(i);
          else inspPicked.add(i);
          el.classList.toggle('picked', inspPicked.has(i));
          syncInspOut();
        });
        inspStageEl.appendChild(el);
      });
    }

    function pickedText() {
      // Colours do not accumulate: a swatch copies itself on the spot, so
      // there is never a colour selection to read back.
      if (inspMode === 'color') return '';
      return [...inspPicked].sort((a, b) => a - b).map(i => inspBlocks[i].text).join('\n\n');
    }

    function syncInspOut() {
      const isColor = inspMode === 'color';
      const text = pickedText();
      setInspOut(text, isColor);
      if (!isColor) drawPickedBlocks();

      if (isColor) {
        if (!inspColors.length) return;
        inspHintEl.textContent = `${inspColors.length} colour${inspColors.length === 1 ? '' : 's'} found`;
        return;
      }
      if (inspBlocks.length) {
        inspHintEl.textContent = inspPicked.size
          ? `${inspPicked.size} of ${inspBlocks.length} selected`
          : `${inspBlocks.length} area${inspBlocks.length === 1 ? '' : 's'} found`;
      }
    }

    // Every block you pick becomes a row of its own, with its own copy and
    // prompt. There is no combined selection to act on any more: you asked for
    // this one line, so you get this one line.
    function outAction(icon, title, run) {
      const b = document.createElement('button');
      b.className = 'out-act';
      b.title = title;
      b.innerHTML = icon;
      b.addEventListener('click', run);
      return b;
    }

    function drawPickedBlocks() {
      const frag = document.createDocumentFragment();
      [...inspPicked].sort((a, b) => a - b).forEach(i => {
        const block = inspBlocks[i];
        if (!block) return;
        const row = document.createElement('div');
        row.className = 'out-block';

        const body = document.createElement('div');
        body.className = 'out-block-text';
        body.textContent = block.text;

        const acts = document.createElement('div');
        acts.className = 'out-block-acts';
        acts.appendChild(outAction(ICON.copy, 'copy this text', async () => {
          await window.api.write({ type: 'text', content: block.text });
          toast('copied — paste with ⌘V');
        }));
        acts.appendChild(outAction(ICON.prompt, 'add to prompts', async () => {
          const ok = await window.api.createPrompt(block.text);
          toast(ok ? 'saved as a prompt — kept forever' : 'could not save that');
        }));

        row.appendChild(body);
        row.appendChild(acts);
        frag.appendChild(row);
      });
      inspBlocksEl.replaceChildren(frag);
    }

    document.getElementById('inspClose').addEventListener('click', closeInspector);
    // hiding the drawer must also shrink the window back, or it reopens wide
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) closeInspector();
    });

    function showOcrStatus(label, pct) {
      ocrListEl.innerHTML = `<div class="ocr-status">${esc(label)}<div class="ocr-bar"><span style="width:${Math.round(pct * 100)}%"></span></div></div>`;
    }

    async function runOcr(id) {
      if (ocrBusyId) return;
      ocrBusyId = id;
      bindDetail(id);
      closeEditor();
      ocrSheetEl.classList.add('show');
      ocrCountEl.classList.add('show');
      ocrCountEl.textContent = 'reading…';
      // the first run also unpacks the language data, so it's the slow one
      showOcrStatus('reading the image…', 0.05);
      try {
        const res = await window.api.ocr(id);
        if (!res || !res.ok) {
          ocrListEl.innerHTML = `<div class="ocr-empty">${esc((res && res.error) || 'could not read that image')}</div>`;
          ocrCountEl.textContent = '';
          return;
        }
        // hand off to the inspector: the picture with its regions, not a list
        ocrSheetEl.classList.remove('show');
        await openInspector(res.imageUrl || res.dataUrl, res.blocks || [], res.width, res.height);
      } catch (err) {
        // without this a fault here leaves nothing on screen at all: the
        // progress sheet has already stepped aside and the panel never opened
        console.error('inspector failed:', err);
        closeInspector();
        ocrSheetEl.classList.add('show');
        ocrListEl.innerHTML = `<div class="ocr-empty">something went wrong reading that image</div>`;
        ocrCountEl.textContent = '';
      } finally {
        ocrBusyId = null;
      }
    }

    // Colours take the same route as text: the progress sheet while main works,
    // then the inspector takes over. Reading pixels is fast enough that the
    // sheet is usually a flash, but it's the same shape either way.
    async function runPalette(id) {
      if (ocrBusyId) return;
      ocrBusyId = id;
      bindDetail(id);
      closeEditor();
      ocrSheetEl.classList.add('show');
      ocrCountEl.classList.add('show');
      ocrCountEl.textContent = 'reading…';
      showOcrStatus('picking out the colours…', 0.3);
      try {
        const res = await window.api.palette(id);
        if (!res || !res.ok) {
          ocrListEl.innerHTML = `<div class="ocr-empty">${esc((res && res.error) || 'could not read that image')}</div>`;
          ocrCountEl.textContent = '';
          return;
        }
        ocrSheetEl.classList.remove('show');
        await openPalette(res.imageUrl || res.dataUrl, res.colors || [], res.width, res.height);
      } catch (err) {
        console.error('palette failed:', err);
        closeInspector();
        ocrSheetEl.classList.add('show');
        ocrListEl.innerHTML = `<div class="ocr-empty">something went wrong reading that image</div>`;
        ocrCountEl.textContent = '';
      } finally {
        ocrBusyId = null;
      }
    }

    function onOcrProgress(m) {
      if (!ocrBusyId || !m) return;
      const label = m.status === 'recognizing text' ? 'reading the image…'
        : m.status === 'loading language traineddata' || m.status === 'loading tesseract core'
          ? 'warming up the reader…'
          : (m.status || 'working…');
      showOcrStatus(label, typeof m.progress === 'number' ? Math.max(0.05, m.progress) : 0.05);
    }

    document.getElementById('ocrClose').addEventListener('click', closeOcr);

    // ---------- tag picker ----------
    // Reusing an existing tag has to be as easy as inventing one, otherwise a
    // library drifts into "img gen", "image gen", "image-gen" within a week.
    function openTagPicker() {
      tagPickerEl.classList.add('show');
      tagPickerInputEl.value = '';
      renderTagSuggestions();
      tagPickerInputEl.focus();
    }

    function closeTagPicker() {
      tagPickerEl.classList.remove('show');
    }

    function renderTagSuggestions() {
      const c = editingId ? findClip(editingId) : null;
      const mine = new Set(((c && c.tags) || []).map(t => t.toLowerCase()));
      const typed = tagPickerInputEl.value.trim().toLowerCase();
      const options = allTags()
        .filter(t => !mine.has(t.toLowerCase()))
        .filter(t => !typed || t.toLowerCase().includes(typed));

      tagSuggestionsEl.innerHTML = '';
      options.forEach(t => {
        const b = document.createElement('button');
        b.textContent = t;
        b.addEventListener('mousedown', (e) => { e.preventDefault(); addTag(t); });
        tagSuggestionsEl.appendChild(b);
      });

      if (!options.length) {
        const none = document.createElement('div');
        none.className = 'none';
        none.textContent = typed ? 'press enter to create' : 'no other tags yet';
        tagSuggestionsEl.appendChild(none);
      }
    }

    function addTag(tag) {
      const c = editingId ? findClip(editingId) : null;
      if (!c) return;
      const next = [...(c.tags || []), tag];
      tagPickerInputEl.value = '';
      setTags(next).then(() => {
        // stay open so several tags can be added in one visit
        renderTagSuggestions();
        tagPickerInputEl.focus();
      });
    }

    tagPickerInputEl.addEventListener('input', renderTagSuggestions);
    tagPickerInputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const typed = tagPickerInputEl.value.trim();
        // enter takes the sole remaining suggestion, else creates what was typed
        const only = tagSuggestionsEl.querySelectorAll('button');
        if (!typed && only.length === 1) addTag(only[0].textContent);
        else if (typed) addTag(typed);
      }
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeTagPicker(); }
    });
    tagPickerInputEl.addEventListener('blur', () => setTimeout(closeTagPicker, 120));

    editorBodyEl.addEventListener('input', () => {
      clearTimeout(editorSaveTimer);
      editorSaveTimer = setTimeout(flushEditorContent, 400);
    });
    editorBodyEl.addEventListener('blur', flushEditorContent);
    document.getElementById('editorClose').addEventListener('click', closeEditor);

    // clicking anywhere else dismisses the tag dropdown
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.tag-filter')) {
        document.querySelectorAll('.tag-menu.show').forEach(m => m.classList.remove('show'));
      }
    });

    // every distinct tag across the library, for the filter row
    function allTags() {
      const seen = new Map();
      pinned.forEach(c => (c.tags || []).forEach(t => {
        const k = t.toLowerCase();
        if (!seen.has(k)) seen.set(k, t);
      }));
      return [...seen.values()].sort((a, b) => a.localeCompare(b));
    }

    // The tag dropdown that hangs off the prompts section header. It narrows
    // the prompts section only — it is not a top-level filter, because a tag
    // is something a prompt has, not a kind of clip.
    function buildTagFilter() {
      const tags = allTags();
      if (!tags.length) return null;

      const wrap = document.createElement('div');
      wrap.className = 'tag-filter';
      wrap.addEventListener('click', (e) => e.stopPropagation()); // don't collapse the section

      const btn = document.createElement('button');
      btn.className = 'tag-filter-btn' + (activeTag ? ' on' : '');
      btn.id = 'tagFilterBtn';
      btn.innerHTML = `<span></span><span class="caret">▼</span>`;
      btn.firstChild.textContent = activeTag || 'all tags';

      const menu = document.createElement('div');
      menu.className = 'tag-menu';
      menu.id = 'tagMenu';

      const addOption = (label, value) => {
        const b = document.createElement('button');
        b.textContent = label;
        b.dataset.tag = value === null ? '' : value;
        if ((value === null && !activeTag) || (value !== null && activeTag === value)) b.classList.add('on');
        b.addEventListener('click', () => {
          activeTag = value;
          menu.classList.remove('show');
          render();
        });
        menu.appendChild(b);
      };

      addOption('all tags', null);
      const sep = document.createElement('div');
      sep.className = 'menu-sep';
      menu.appendChild(sep);
      tags.forEach(t => addOption(t, t));

      btn.addEventListener('click', () => menu.classList.toggle('show'));
      wrap.appendChild(btn);
      wrap.appendChild(menu);
      return wrap;
    }

    // ---------- the stack ----------
    const MAX_CARDS = 5;
    const GLYPH = { text: 'T', code: '{}', url: '@', img: '●¨' };

    // Deterministic tilt — a card must not re-shuffle its angle every redraw,
    // or the deck twitches every time you add one.
    function tiltFor(id) {
      let h = 0;
      for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
      return ((h % 13) - 6) * 0.9;
    }

    function updateStack(originRect) {
      const clips = selectedClips();
      const n = clips.length;
      const wasShown = stackTrayEl.classList.contains('show');
      stackTrayEl.classList.toggle('show', n > 0);

      if (n === 0) {
        stackDeckEl.querySelectorAll('.stack-card').forEach(el => el.remove());
        stackDrawn = [];
        stackIconUrl = null;
        return;
      }

      const padded = n < 10 ? '0' + n : String(n);
      stackTitleEl.textContent = padded + (n === 1 ? ' clip stacked' : ' clips stacked');
      if (stackCountEl.textContent !== padded) {
        stackCountEl.textContent = padded;
        if (!reduceMotion && wasShown) {
          stackCountEl.classList.remove('bump');
          void stackCountEl.offsetWidth; // reflow, so the animation restarts
          stackCountEl.classList.add('bump');
        }
      }

      // the deck shows the most recent few; the badge carries the real count
      const shown = clips.slice(-MAX_CARDS);
      const shownIds = shown.map(c => c.id);

      stackDeckEl.querySelectorAll('.stack-card').forEach(el => {
        if (!shownIds.includes(el.dataset.id)) {
          el.classList.add('leaving');
          el.dataset.leaveTimer = String(setTimeout(() => el.remove(), 200));
        }
      });

      shown.forEach((c, i) => {
        let card = stackDeckEl.querySelector(`.stack-card[data-id="${CSS.escape(c.id)}"]`);
        // Re-picking a clip while its card is still fading out would otherwise
        // resurrect a card mid-exit — invisible and shrunk. Catch it and cancel.
        if (card && card.classList.contains('leaving')) {
          clearTimeout(Number(card.dataset.leaveTimer));
          delete card.dataset.leaveTimer;
          card.classList.remove('leaving');
        }
        const isNew = !card;
        if (isNew) {
          card = document.createElement('div');
          card.className = 'stack-card';
          card.dataset.id = c.id;
          card.title = 'click to take this one out';
          card.innerHTML = (c.type === 'img' && c.dataUrl)
            ? `<img src="${c.dataUrl}" alt=""/>`
            : `<span>${GLYPH[c.type] || '·'}</span>`;
          card.addEventListener('click', (e) => {
            e.stopPropagation();
            selected.delete(c.id);
            syncSelection();
          });
          stackDeckEl.appendChild(card);
        }
        const x = i * 8;
        const r = tiltFor(c.id);
        card.style.setProperty('--x', x + 'px');
        card.style.setProperty('--r', r + 'deg');
        card.style.zIndex = String(i + 1);
        if (isNew && originRect && !reduceMotion) flyIn(card, originRect, x, r);
      });

      stackDrawn = shownIds;
      buildStackIcon(clips);
    }

    // card leaves the row it was picked from and lands in the deck
    function flyIn(card, originRect, x, r) {
      const to = card.getBoundingClientRect();
      const dx = originRect.left + originRect.width / 2 - (to.left + to.width / 2);
      const dy = originRect.top + originRect.height / 2 - (to.top + to.height / 2);
      card.animate([
        { transform: `translate(${x + dx}px, ${dy}px) scale(1.5) rotate(0deg)`, opacity: 0.25 },
        { transform: `translateX(${x}px) rotate(${r}deg)`, opacity: 1 },
      ], { duration: 400, easing: 'cubic-bezier(0.22, 1.2, 0.36, 1)' });
    }

    function loadImage(src) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = src;
      });
    }

    // draw an image cover-style inside a square, preserving aspect ratio
    function drawCover(ctx, img, x, y, size) {
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, x + (size - w) / 2, y + (size - h) / 2, w, h);
    }

    // Rasterize the deck so the OS drag cursor is the stack itself rather than
    // one generic file icon. Async because images must decode first, so it runs
    // on selection change and the result is waiting by the time a drag starts.
    let stackIconToken = 0;
    async function buildStackIcon(clips) {
      const token = ++stackIconToken;
      const shown = clips.slice(-4);
      const W = 140, H = 112, s = 74;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      for (let i = 0; i < shown.length; i++) {
        const c = shown[i];
        const img = (c.type === 'img' && c.dataUrl) ? await loadImage(c.dataUrl).catch(() => null) : null;
        if (token !== stackIconToken) return; // a newer selection superseded us
        ctx.save();
        ctx.translate(W / 2 + (i - (shown.length - 1) / 2) * 12, H / 2 + i * 2);
        ctx.rotate((tiltFor(c.id) * Math.PI) / 180);
        ctx.beginPath();
        ctx.roundRect(-s / 2, -s / 2, s, s, 10);
        ctx.fillStyle = '#1c1c1c';
        ctx.fill();
        if (img) {
          ctx.save();
          ctx.clip();
          drawCover(ctx, img, -s / 2, -s / 2, s);
          ctx.restore();
        } else {
          ctx.fillStyle = '#9aa4c0';
          ctx.font = '600 26px ui-monospace, monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(GLYPH[c.type] || '·', 0, 2);
        }
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.stroke();
        ctx.restore();
      }

      if (token !== stackIconToken) return;
      stackIconUrl = canvas.toDataURL('image/png');
    }

    // ---------- manual order ----------
    // The row itself is draggable, and that drag is handed to the OS so a clip
    // can be dropped into another app — which means the browser's own drop
    // events never arrive and cannot be used to reorder. So reordering is its
    // own pointer gesture, and the grip is what starts it.
    let lift = null;
    let arming = null;       // a press waiting to become a lift
    let suppressClick = false;
    const HOLD_MS = 170;     // long enough not to fire on a click, short enough to feel instant

    // A press anywhere on the row arms a lift. If the pointer moves first the
    // browser starts its own drag instead and the press is abandoned — that is
    // what keeps "drag this clip into another app" working on the same row.
    function armLift(e, el, clip, sessionId) {
      if (e.button !== 0 || lift || e.target.closest('button')) return;
      cancelArm();
      el.classList.add('arming');
      arming = {
        el, clip, sessionId,
        x: e.clientX, y: e.clientY,
        timer: setTimeout(() => {
          arming = null;
          el.classList.remove('arming');
          beginLift({ clientX: e.clientX, clientY: e.clientY }, el, clip, sessionId);
        }, HOLD_MS),
      };
      window.addEventListener('mousemove', onArmMove);
      window.addEventListener('mouseup', cancelArm);
    }

    // moving during the hold means this was a drag, not a press
    function onArmMove(e) {
      if (!arming) return;
      if (Math.abs(e.clientX - arming.x) > 4 || Math.abs(e.clientY - arming.y) > 4) cancelArm();
    }

    function cancelArm() {
      if (!arming) return;
      clearTimeout(arming.timer);
      arming.el.classList.remove('arming');
      arming = null;
      window.removeEventListener('mousemove', onArmMove);
      window.removeEventListener('mouseup', cancelArm);
    }

    function beginLift(e, el, clip, sessionId) {
      if (lift) return;
      cancelArm();
      const rect = el.getBoundingClientRect();

      // the row travels with the pointer as a copy
      const ghost = el.cloneNode(true);
      ghost.classList.add('lifting');
      ghost.classList.remove('selected', 'arming');
      ghost.style.width = rect.width + 'px';
      ghost.style.left = rect.left + 'px';
      ghost.style.top = rect.top + 'px';
      document.body.appendChild(ghost);

      // and the row itself stays in the list as the hole it will drop into
      el.classList.add('slot');
      el.draggable = false; // no native drag-out while carrying it

      lift = {
        el, ghost, clip, sessionId,
        block: el.dataset.block,
        grabDy: e.clientY - rect.top,
        from: rowsIn().indexOf(el),
        moved: false,
      };
      document.body.style.cursor = 'grabbing';
      window.addEventListener('mousemove', onLiftMove);
      window.addEventListener('mouseup', endLift);
    }

    const rowsIn = () => [...listEl.querySelectorAll('.item')];

    // Move the slot to a new place and let every row that had to shift animate
    // from where it was to where it now is, rather than jumping. Measure, move,
    // then play the difference backwards — the rows only ever move once.
    function slideTo(mutate) {
      const others = rowsIn().filter(r => r !== lift.el);
      const before = new Map(others.map(r => [r, r.getBoundingClientRect().top]));
      mutate();
      for (const r of others) {
        const dy = before.get(r) - r.getBoundingClientRect().top;
        if (!dy) continue;
        r.classList.remove('shifting');
        r.style.transform = `translateY(${dy}px)`;
        requestAnimationFrame(() => {
          r.classList.add('shifting');
          r.style.transform = '';
        });

    function onLiftMove(e) {
      if (!lift) return;
      lift.moved = true;
      lift.ghost.style.top = (e.clientY - lift.grabDy) + 'px';

      // Only rows of the same block are candidates, so a prompt cannot be
      // dropped among the pinned and a pinned clip cannot land in history —
      // those are different arrays, and the drop would spring back.
      const others = rowsIn().filter(r => r !== lift.el && r.dataset.block === lift.block);
      if (!others.length) return;
      const target = others.find(r => {
        const b = r.getBoundingClientRect();

      // than the list's, which is what keeps the drag penned in
      const next = target || others[others.length - 1].nextElementSibling;
      if (lift.el.nextElementSibling !== next) {

      // screenful without letting go

      else if (e.clientY > lb.bottom - 40) listEl.scrollTop += 8;
    }

    async function endLift() {

      lift = null;
      window.removeEventListener('mousemove', onLiftMove);
      window.removeEventListener('mouseup', endLift);

      if (moved) suppressClick = true;

      // the carried copy drops into the hole instead of vanishing mid-air
      const home = el.getBoundingClientRect();
      ghost.classList.add('landing');
      ghost.style.top = home.top + 'px';
      ghost.style.left = home.left + 'px';

        el.classList.remove('slot');
        rowsIn().forEach(r => { r.classList.remove('shifting'); r.style.transform = ''; });

      // list — just the block that moved, since the store reassigns ids to the
      // slots they already hold and everything else must keep its place.
      const ids = rowsIn()
        .filter(n => n.dataset.block === block)
        .map(n => n.dataset.id);

        ? await window.api.reorderSession?.(sessionId, ids)
        : await window.api.reorderPinned?.(ids);

    }

    // the drawer's copy of the same reassignment the main process does, so the
    // optimistic render matches what comes back
    function applyOrder(list, ids) {

      const slots = [];
      list.forEach((c, i) => { if (held.has(c.id)) slots.push(i); });
      const byId = new Map(list.map(c => [c.id, c]));
      ids.filter(id => held.has(id)).forEach((id, k) => { list[slots[k]] = byId.get(id); });
    }

    // Labels put the toolbar in competition with the clip for the same few
    // words of width. Icons don't, and every button keeps its title for hover.
    const ICON = {
      name: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11.2v5"/><path d="M12 7.8v.4"/></svg>',
      edit: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
      prompt: '<svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>',
      pin: '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L3.5 9.7l5.9-.9z"/></svg>',
      pinned: '<svg viewBox="0 0 24 24" class="filled"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L3.5 9.7l5.9-.9z"/></svg>',
      session: '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg>',
      text: '<svg viewBox="0 0 24 24"><path d="M5 6h14M12 6.5V18"/></svg>',
      colour: '<svg viewBox="0 0 24 24"><path d="M12 3.2s6.2 6.6 6.2 10.2a6.2 6.2 0 11-12.4 0C5.8 9.8 12 3.2 12 3.2z"/></svg>',
      copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>',
      del: '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 7V5a1 1 0 011-1h2a1 1 0 011 1v2"/><path d="M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13"/></svg>',

    document.getElementById('modeKeyText').innerHTML = ICON.text;

    function buildItemEl(c, isPinned, sessionId) {
      const el = document.createElement('div');
      let cls = 'item';
      if (c._new) cls += ' new';
      if (c._promoted) cls += ' promoted';
      if (selected.has(c.id)) cls += ' selected';
      el.className = cls;
      el.draggable = true;
      el.dataset.id = c.id;
      // a row can only be reordered among the rows of its own block
      const block = blockOf(c, isPinned, sessionId);
      el.dataset.block = block;
      // a clip shows in Recent and again in its collection; the selection model is
      // keyed by id, so the order must list each id once
      if (!renderedOrder.includes(c.id)) renderedOrder.push(c.id);

      // prompts are permanent by definition, so they say so instead of aging
      const stamp = c.isPrompt ? 'prompt' : (isPinned ? 'pinned' : timeAgo(c.ts));
      // a clip that kept its formatting says so, since pasting it will carry that
      const styled = !!(c.html || c.rtf);

      // Build per-type content. The hierarchy is consistent:
      //   [drag] [type badge] [headline + meta + (optional thumb)]
      let headlineHtml = '';
      let extraHtml = '';
      let metaParts = [];

      // A clip whose content is nothing but colour values shows as a colour,
      // though it is still a text clip underneath. A prompt stays a prompt.
      const colours = (c.type === 'text' && !c.isPrompt) ? colourValues(c.content) : [];
      const isColour = colours.length > 0;

      if (c.type === 'url') {
        const dom = domainOf(c.content);
        headlineHtml = `<div class="item-headline">${esc(urlHeadline(c.content))}</div>`;
        if (dom) metaParts.push(`<span class="domain">${esc(dom)}</span>`);
        metaParts.push(`<span class="dot">·</span>`);
        metaParts.push(`<span class="time">${stamp}</span>`);
      } else if (c.type === 'code') {
        // code preview — first ~3 lines, monospace, in a tinted box
        const lines = c.content.split('\n');
        const previewText = lines.slice(0, 3).join('\n').slice(0, 240);
        headlineHtml = `<div class="item-headline code-preview">${esc(previewText)}</div>`;
        const lang = detectLang(c.content);
        if (lang) metaParts.push(`<span class="lang-tag">${lang}</span>`);
        metaParts.push(`<span class="time">${stamp}</span>`);
        if (lines.length > 3) metaParts.push(`<span class="dot">·</span><span>+${lines.length - 3} more lines</span>`);
      } else if (c.type === 'img') {
        headlineHtml = `<div class="item-headline">${esc(c.meta || 'image')}</div>`;
        metaParts.push(`<span class="time">${stamp}</span>`);
        if (c.dataUrl) {
          extraHtml = `<img class="item-image" src="${c.dataUrl}" alt=""/>`;
        }
        if (matchedOnImageText(c)) {
          metaParts.push('<span class="dot">·</span><span class="in-image">text in image</span>');
          extraHtml += `<div class="ocr-hit">${esc(imageTextExcerpt(c))}</div>`;
        }
      } else if (isColour) {
        // The colour itself is never written into the markup -- see below.
        const chips = colours.slice(0, 4)
          .map((_, i) => `<span class="colour-chip" data-swatch="${i}"></span>`).join('');
        headlineHtml = `<div class="item-headline colour-line">${chips}<span class="colour-value">${esc(colours.join("  "))}</span></div>`;
        metaParts.push(`<span class="time">${stamp}</span>`);
        if (colours.length > 4) {
          metaParts.push(`<span class="dot">·</span><span>+${colours.length - 4} more</span>`);
        }
      } else {
        // text — first line big, fade if there's more
        const lines = c.content.split('\n');
        const firstLine = lines[0].slice(0, 200);
        const hasMore = lines.length > 1 || c.content.length > firstLine.length;
        const headlineClass = hasMore ? 'item-headline clamp-2' : 'item-headline';
        // For multiline, show first 2 lines clamped; otherwise just first line
        const showText = hasMore ? c.content.slice(0, 240) : firstLine;
        headlineHtml = `<div class="${headlineClass}">${esc(showText)}</div>`;
        metaParts.push(`<span class="time">${stamp}</span>`);
        if (hasMore && lines.length > 2) {
          metaParts.push(`<span class="dot">·</span><span>+${lines.length - 2} more lines</span>`);
        }
      }

      // Where it came from, on every kind of row. People remember the app long
      // after they have forgotten the words, so this is the strongest handle on
      // a history thousands of clips deep.
      if (c.sourceApp) {
        const icon = sourceIcons[c.sourceApp];
        // The logo where there is one, the name where there is not. The name
        // rides along either way as the title and the alt text: an icon on its
        // own is unreadable to a screen reader, and unrecognisable for an app
        // you have not seen the icon of before.
        metaParts.push('<span class="dot">·</span>' + (icon
          ? `<img class="from-icon" src="${icon}" alt="${esc(c.sourceApp)}" title="${esc(c.sourceApp)}"/>`
          : `<span class="from-app" title="${esc(c.sourceApp)}">${esc(c.sourceApp)}</span>`));
      }

      // A name the user set outranks the derived headline. What it displaces
      // isn't dropped: an image's dimensions move to the meta line, and any
      // other type keeps its preview underneath. Nothing visible is lost by
      // naming something.
      const givenName = (c.name || '').trim();
      if (givenName) {
        if (c.type === 'img') {
          if (c.meta) metaParts.unshift(`<span>${esc(c.meta)}</span><span class="dot">·</span>`);
        } else {
          extraHtml = `<div class="item-derived">${headlineHtml}</div>` + extraHtml;
        }

      }

      if (styled) {
        metaParts.push(`<span class="dot">·</span><span class="styled-mark" title="keeps its formatting — hold ⌥ to copy as plain text">styled</span>`);
      }
      // A design asset says what it is rather than what it is made of: "svg"
      // and "figma" are more use on a row than "code" and "text", which is all
      // either of them would otherwise read as.
      const badgeKind = c.isPrompt ? 'prompt'
        : (c.asset ? c.asset : (isColour ? 'color' : c.type));
      const metaHtml = `<div class="item-meta">${metaParts.join('')}</div>`;
      // tags ride under the meta line so the library can be skimmed
      const tagsHtml = (c.tags && c.tags.length)
        ? `<div class="item-tags">${c.tags.map(t => `<span class="tag-chip">${esc(t)}</span>`).join('')}</div>`
        : '';

      el.innerHTML = `
        <div class="drag-handle">
          <div class="dot-row"><span></span><span></span></div>
          <div class="dot-row"><span></span><span></span></div>
          <div class="dot-row"><span></span><span></span></div>
        </div>
        <div class="item-icon-col">
          <span class="type-badge ${badgeKind}">${badgeKind}</span>
        </div>
        <div class="item-content">
          ${headlineHtml}
          ${metaHtml}
          ${tagsHtml}
          ${extraHtml}
          <div class="actions">
            <button class="act-btn" data-act="name" title="preview">${ICON.name}</button>
            ${c.isPrompt ? `<button class="act-btn" data-act="edit" title="edit text and tags">${ICON.edit}</button>` : ''}
            <button class="act-btn ${c.isPrompt ? 'on' : ''}" data-act="prompt" title="${c.isPrompt ? 'stop keeping this as a prompt' : 'save as a prompt — kept forever'}">${ICON.prompt}</button>
            ${c.isPrompt ? '' : `<button class="act-btn ${isPinned ? 'pinned' : ''}" data-act="pin" title="${isPinned ? 'unpin' : 'pin'}">${isPinned ? ICON.pinned : ICON.pin}</button>`}
            ${c.type === 'img' ? `<button class="act-btn" data-act="ocr" title="pull the text out of this image">${ICON.text}</button>` : ''}
            ${c.type === 'img' ? `<button class="act-btn" data-act="palette" title="pull the colours out of this image">${ICON.colour}</button>` : ''}
            ${sessionId
              ? `<button class="act-btn in-session" data-act="unses" title="remove from this collection">${ICON.session}</button>`
              : `<button class="act-btn ${sessionsHolding(c.id).length ? 'in-session' : ''}" data-act="ses"
              title="${sessionsHolding(c.id).length ? 'in ' + sessionsHolding(c.id).length + ' collection' + (sessionsHolding(c.id).length === 1 ? '' : 's') + ' — click to change' : 'add to a collection'}">${ICON.session}</button>`}
            <button class="act-btn" data-act="copy" title="copy">${ICON.copy}</button>
            <button class="act-btn danger" data-act="del" title="delete from Stash">${ICON.del}</button>
          </div>
        </div>
      `;

      // The colour never goes through markup. esc() does not escape quotes, so a
      // clipboard string such as rgb(" onerror=...) would break straight out of a
      // style attribute. Assigning through CSSOM cannot escape, and the browser
      // simply drops anything it does not recognise as a colour.

        el.querySelectorAll('.colour-chip').forEach(chip => {
          chip.style.backgroundColor = colours[Number(chip.dataset.swatch)] || '';
        });
      }

      // drag-out instead. The grip skips the wait for anyone who reaches for it.
      if (canOrderBlock(block)) {
        el.classList.add('orderable');
        el.title = 'hold to reorder · drag to drop into another app';
        el.addEventListener('mousedown', (e) => armLift(e, el, c, sessionId));

        e.stopPropagation();

        await window.api.write(c, plain);
        toast(plain ? 'copied as plain text' : 'copied — paste with ⌘V');
      });

      el.querySelector('[data-act="del"]').addEventListener('click', async (e) => {
        e.stopPropagation();

        // out of one collection without destroying it is what the collection button
        // is for.
        await window.api.delete(c.id);

        if (isPinned) pinned = pinned.filter(p => p.id !== c.id);
        else history = history.filter(h => h.id !== c.id);

      el.querySelector('[data-act="ses"]')?.addEventListener('click', (e) => {
        e.stopPropagation();
        openSessionMenu(c.id, e.currentTarget);
      });

      el.querySelector('[data-act="unses"]')?.addEventListener('click', async (e) => {
        e.stopPropagation();

        sessionClips = sessionClips.filter(s => !(s.id === c.id && s.sessionId === sessionId));
        toast('removed from this collection');
