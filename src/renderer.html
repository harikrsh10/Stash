<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Stash</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --surface2: #1a1a1a;
      --border: #222;
      --border2: #2f2f2f;
      --text: #e8e8e8;
      --muted: #666;
      --muted2: #444;
      --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    html, body {
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    /* The window is a fixed-width drawer that widens to the left when an image
       is being inspected. The shell holds both columns. */
    .shell { display: flex; height: 100vh; }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 340px;
      flex-shrink: 0;
      order: 2;
      /* the prompt editor docks against this */
      position: relative;
    }

    /* ---------- image inspector ---------- */
    .inspector {
      display: none;
      order: 1;
      flex: 1;
      min-width: 0;
      flex-direction: column;
      height: 100vh;
      background: #0c0c0e;
      border-right: 1px solid var(--border);
    }
    .inspector.show { display: flex; }

    .insp-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px 10px;
      flex-shrink: 0;
    }
    .insp-title {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8fd0a8;
    }
    .insp-hint { font-size: 10px; color: var(--muted); }

    /* the picture, with a clickable box over every block of text found */
    /* The regions are positioned as percentages, so their containing block has
       to be exactly the rendered image and nothing more. The stage is therefore
       a plain block the full width of the panel, with the image filling it —
       height follows the image, so the stage box and the picture coincide.
       (As a flex item the stage refused to shrink below the image's natural
       width, so the box was far wider than the picture and every region landed
       off to the side.) */
    .insp-canvas {
      flex: 1;
      min-height: 0;
      margin: 0 14px;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .insp-stage { position: relative; width: 100%; line-height: 0; }
    .insp-stage img { display: block; width: 100%; height: auto; border-radius: 4px; }

    .region {
      position: absolute;
      border: 1px solid rgba(143, 208, 168, 0.55);
      background: rgba(143, 208, 168, 0.10);
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
    }
    .region:hover { background: rgba(143, 208, 168, 0.22); border-color: #8fd0a8; }
    .region.picked {
      background: rgba(109, 140, 255, 0.28);
      border-color: #8aa4ff;
      box-shadow: 0 0 0 1px rgba(138, 164, 255, 0.5);
    }

    .insp-out {
      flex-shrink: 0;
      margin: 12px 14px 0;
      padding: 10px;
      min-height: 62px;
      max-height: 150px;
      overflow-y: auto;
      background: var(--surface2, #1a1a1a);
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .insp-out.empty { color: var(--muted); font-family: var(--font-mono); font-size: 10px; }
    .insp-out::-webkit-scrollbar { width: 3px; }
    .insp-out::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .insp-actions {
      display: flex;
      gap: 8px;
      padding: 10px 14px 14px;
      flex-shrink: 0;
    }
    .insp-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 4px;
      background: var(--surface2, #1a1a1a);
      border: 1px solid var(--border2);
      color: var(--text-2, #b8b8b8);
      font-family: var(--font-mono);
      font-size: 10.5px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }
    .insp-btn:hover:not(:disabled) { color: #8fd0a8; border-color: #3f7d5c; background: #16201a; }
    .insp-btn.prompt:hover:not(:disabled) { color: #c9a4ff; border-color: #4d3a75; background: #191324; }
    .insp-btn:disabled { opacity: 0.4; cursor: default; }

    /* drag region lets the user move the window by the title bar */
    .titlebar {
      -webkit-app-region: drag;
      height: 38px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .title {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .close-btn {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
      transition: color 0.15s, background 0.15s;
    }
    .close-btn:hover { color: var(--text); background: var(--surface2); }

    .controls {
      padding: 14px 18px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .search-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input::placeholder { color: var(--muted2); }
    .search-input:focus { border-color: var(--border2); }

    .filters {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .pill {
      font-size: 10px;
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .pill:hover { color: var(--text); }
    .pill.active { background: var(--surface2); border-color: var(--border2); color: var(--text); }

    .list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    .list::-webkit-scrollbar { width: 3px; }
    .list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
    .list::-webkit-scrollbar-track { background: transparent; }

    .empty {
      padding: 80px 24px;
      text-align: center;
      color: var(--text-2, #b8b8b8);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.6;
      font-weight: 300;
    }
    .empty .empty-sub {
      display: block;
      margin-top: 14px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted2);
      letter-spacing: 0.06em;
      line-height: 2;
    }
    .empty .hotkey {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 3px;
      padding: 1px 6px;
      font-size: 10px;
      margin: 0 2px;
      color: var(--text-2, #b8b8b8);
    }

    .item {
      padding: 12px 18px 12px 14px;
      border-bottom: 1px solid var(--border);
      cursor: grab;
      transition: background 0.14s, transform 0.14s, border-color 0.14s;
      position: relative;
      display: flex;
      gap: 11px;
      align-items: stretch;
    }
    .item:hover {
      background: var(--surface2);
      transform: translateX(-1px);
    }
    .item.dragging { opacity: 0.4; cursor: grabbing; }
    .item.new { animation: pop 0.4s ease; }

    /* multi-select — accent rail on the left edge so a selected row reads as
       picked up without competing with the pinned section's warm tint */
    .item.selected { background: rgba(109, 140, 255, 0.08); box-shadow: inset 2px 0 0 #6d8cff; }
    .item.selected:hover { background: rgba(109, 140, 255, 0.13); }
    /* shift-clicking a range otherwise smears a text selection across rows */
    .item { user-select: none; }

    @keyframes pop {
      0% { background: #1e2a1e; }
      100% { background: transparent; }
    }

    /* drag handle — 6 dots, only visible on hover */
    .item .drag-handle {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      opacity: 0;
      transition: opacity 0.14s;
      flex-shrink: 0;
      align-self: center;
      width: 4px;
      margin-left: -8px;
    }
    .item:hover .drag-handle { opacity: 0.32; }
    .item .drag-handle .dot-row {
      display: flex;
      gap: 2px;
    }
    .item .drag-handle .dot-row span {
      width: 2px;
      height: 2px;
      background: currentColor;
      border-radius: 50%;
    }

    .item-icon-col {
      flex-shrink: 0;
      align-self: flex-start;
      padding-top: 2px;
    }
    .type-badge {
      font-size: 9px;
      font-family: var(--font-mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 3px;
      display: inline-block;
      line-height: 1;
    }
    .type-badge.text { color: #999; background: #1e1e1e; border: 1px solid #2a2a2a; }
    .type-badge.code { color: #a0a0ff; background: #161625; border: 1px solid #2a2a44; }
    .type-badge.url  { color: #6dbf8c; background: #0f1f14; border: 1px solid #1a3322; }
    .type-badge.img  { color: #d4a06a; background: #1f160a; border: 1px solid #3a2510; }

    /* main content column */
    .item-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* primary headline — first line of the clip, strongly weighted */
    .item-headline {
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--text);
      letter-spacing: -0.005em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-headline.clamp-2 {
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      /* fade overflow at the bottom */
      mask-image: linear-gradient(to bottom, black 70%, rgba(0,0,0,0.6) 100%);
    }

    /* code preview — monospace, tinted background, compact */
    .item-headline.code-preview {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 400;
      color: #c8c8d8;
      background: rgba(160, 160, 255, 0.04);
      padding: 6px 9px;
      border-radius: 4px;
      border: 1px solid rgba(160, 160, 255, 0.08);
      white-space: pre;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 56px;
      mask-image: linear-gradient(to bottom, black 70%, rgba(0,0,0,0.4) 100%);
    }

    /* meta row — type, time, source, etc. small monospace */
    .item-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .item-meta .domain {
      color: #6dbf8c;
      letter-spacing: 0;
    }
    .item-meta .lang-tag {
      background: var(--surface2);
      color: #a0a0d0;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .item-meta .dot { color: var(--muted2); }
    .item-meta .time { color: var(--muted2); }

    /* image preview — bigger, more prominent */
    .item-image {
      margin-top: 6px;
      /* .item-content is a column flex container, so the default stretch would
         force width to 100% while max-height clamps height independently —
         that distorts the image. flex-start keeps width intrinsic so the
         max-* pair scales it proportionally. */
      align-self: flex-start;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 140px;
      object-fit: contain;
      border-radius: 5px;
      display: block;
      border: 1px solid var(--border);
      transition: max-height 0.2s;
    }
    .item:hover .item-image { max-height: 180px; }

    .actions {
      position: absolute;
      right: 12px;
      top: 12px;
      display: none;
      gap: 4px;
      align-items: center;
      background: var(--surface2);
      padding: 3px;
      border-radius: 5px;
      border: 1px solid var(--border2);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .item:hover .actions { display: flex; }
    .act-btn {
      background: transparent;
      border: none;
      border-radius: 3px;
      color: var(--muted);
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 4px 8px;
      cursor: pointer;
      transition: color 0.12s, background 0.12s;
      letter-spacing: 0.04em;
    }
    .act-btn:hover { color: var(--text); background: var(--surface3, #2a2a2a); }
    .act-btn.danger:hover { color: #c46a6a; }

    /* ---------- selection stack ----------
       Selecting clips gathers them into a physical little deck above the
       footer. The deck is the drag target, so "collect, then throw" is one
       continuous gesture rather than an abstract selection state. */
    .stack-tray {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 11px 14px 12px;
      border-top: 1px solid var(--border);
      background: linear-gradient(to top, rgba(109, 140, 255, 0.13), rgba(109, 140, 255, 0.03));
      flex-shrink: 0;
    }
    .stack-tray.show { display: flex; animation: trayIn 0.34s cubic-bezier(0.22, 1.2, 0.36, 1); }
    @keyframes trayIn {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .stack-deck {
      position: relative;
      /* wide enough that a 5-card deck stays inside its own footprint when
         the hover fan spreads it, instead of sliding under the label */
      width: 88px;
      height: 46px;
      flex-shrink: 0;
      cursor: grab;
    }
    .stack-deck:active { cursor: grabbing; }
    .stack-deck.delivered { animation: settle 0.5s cubic-bezier(0.22, 1.4, 0.36, 1); }
    @keyframes settle {
      0%   { transform: scale(0.86) rotate(-3deg); }
      55%  { transform: scale(1.06) rotate(1.5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .stack-card {
      position: absolute;
      top: 50%;
      left: 4px;
      width: 38px;
      height: 38px;
      margin-top: -19px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: var(--surface2, #1a1a1a);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      color: #9aa4c0;
      transform: translateX(var(--x, 0px)) rotate(var(--r, 0deg));
      transition: transform 0.28s cubic-bezier(0.22, 1.2, 0.36, 1), opacity 0.18s;
      cursor: pointer;
    }
    .stack-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* hover fans the deck out so you can see what you've gathered */
    .stack-deck:hover .stack-card {
      transform: translateX(calc(var(--x, 0px) * 1.4)) rotate(calc(var(--r, 0deg) * 1.5));
    }
    .stack-card.leaving { opacity: 0; transform: translateX(var(--x, 0px)) scale(0.5) rotate(12deg); }

    .stack-count {
      position: absolute;
      right: -5px;
      top: -7px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 9px;
      background: #6d8cff;
      color: #0b0b0b;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
      z-index: 5;
    }
    .stack-count.bump { animation: bump 0.34s cubic-bezier(0.22, 1.4, 0.36, 1); }
    @keyframes bump {
      0% { transform: scale(1); } 45% { transform: scale(1.38); } 100% { transform: scale(1); }
    }

    .stack-info { flex: 1; min-width: 0; line-height: 1.35; }
    .stack-title {
      font-size: 11px;
      font-family: var(--font-mono);
      color: #c3cbe6;
      display: block;
    }
    .stack-hint {
      font-size: 10px;
      color: var(--muted);
      display: block;
    }

    @media (prefers-reduced-motion: reduce) {
      .stack-tray.show, .stack-deck.delivered, .stack-count.bump { animation: none; }
      .stack-card { transition: none; }
    }

    .footer {
      padding: 10px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .footer-info {
      font-size: 10px;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .clear-btn {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: color 0.12s;
    }
    .clear-btn:hover { color: #c46a6a; }

    .toast {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1e1e;
      border: 1px solid #333;
      color: #aaa;
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 6px 14px;
      border-radius: 3px;
      letter-spacing: 0.06em;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    .skip-pulse {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #5a8a5a;
      margin-right: 6px;
      vertical-align: middle;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .skip-pulse.on { opacity: 1; }

    /* pause toggle in titlebar */
    .pause-btn {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      cursor: pointer;
      padding: 3px 8px;
      border-radius: 3px;
      margin-right: 4px;
      transition: color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pause-btn:hover { color: var(--text); background: var(--surface2); }
    .pause-btn .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: #5a8a5a;
      transition: background 0.2s;
    }
    .pause-btn.paused .dot { background: #c49a3a; }

    /* update-available badge — sits left of pause btn, only shown when a
       newer release exists on github. clicking opens the release page. */
    .update-badge {
      -webkit-app-region: no-drag;
      background: none;
      border: 1px solid #4a7a4a;
      color: #8fbf8f;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      cursor: pointer;
      padding: 3px 7px;
      border-radius: 3px;
      margin-right: 6px;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .update-badge:hover {
      color: #b8d9b8;
      background: rgba(90, 138, 90, 0.12);
      border-color: #6a9a6a;
    }
    .update-badge .update-arrow {
      font-size: 11px;
      line-height: 1;
    }

    .titlebar-right {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
    }

    /* dim the list when paused */
    body.paused .list { opacity: 0.4; pointer-events: none; }
    body.paused .controls { opacity: 0.5; }
    .paused-banner {
      display: none;
      padding: 8px 18px;
      background: #1a1508;
      border-bottom: 1px solid #2a2210;
      color: #c49a3a;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-align: center;
    }
    body.paused .paused-banner { display: block; }

    /* promote-on-recopy: flash the item when bumped to top */
    .item.promoted { animation: promote 0.7s ease; }
    @keyframes promote {
      0%   { background: #2a1f08; }
      50%  { background: #1e1a0a; }
      100% { background: transparent; }
    }

    /* pinned section */
    .section-label {
      padding: 10px 18px 6px;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--muted2);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: color 0.12s;
    }
    .section-label:hover { color: var(--muted); }
    .section-label-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-label .chevron {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-right: 1px solid currentColor;
      border-bottom: 1px solid currentColor;
      transform: rotate(45deg);
      transition: transform 0.18s ease;
      margin-right: 2px;
      margin-top: -2px;
    }
    .section-label.collapsed .chevron {
      transform: rotate(-45deg);
      margin-top: 0;
    }
    .section-label .count {
      color: var(--muted2);
      font-weight: 400;
    }
    .section-label .pin-icon {
      width: 8px; height: 8px;
      display: inline-block;
    }
    .pinned-section {
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .pinned-section .item {
      background: rgba(255, 215, 140, 0.02);
    }
    /* prompts read as a library, not history — cooler tint than pinned's warm one */
    .prompts-section .item {
      background: rgba(186, 148, 255, 0.035);
    }
    /* the row being edited stays visibly tied to the sheet below it */
    .item.editing {
      background: rgba(186, 148, 255, 0.1);
      box-shadow: inset 0 0 0 1px #7c5cbf;
    }

    /* tag chips shown inline on a prompt row, so the library is scannable */
    .item-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
    .tag-chip {
      font-family: var(--font-mono);
      font-size: 9px;
      line-height: 1;
      padding: 3px 6px;
      border-radius: 3px;
      color: #b9a2e8;
      background: #1a1226;
      border: 1px solid #33234d;
      white-space: nowrap;
    }

    /* ---------- prompt editor sheet ---------- */
    .editor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      max-height: 62%;
      display: flex;
      flex-direction: column;
      background: #131017;
      border-top: 1px solid #33234d;
      box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.55);
      transform: translateY(100%);
      transition: transform 0.26s cubic-bezier(0.22, 1.1, 0.36, 1);
    }
    .editor.show { transform: translateY(0); }

    .editor-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px 8px;
      flex-shrink: 0;
    }
    .editor-title {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #b9a2e8;
    }
    .editor-saved {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--muted2);
      opacity: 0;
      transition: opacity 0.18s;
    }
    .editor-saved.show { opacity: 1; }

    .editor-body {
      margin: 0 14px;
      padding: 10px;
      min-height: 78px;
      max-height: 190px;
      resize: none;
      overflow-y: auto;
      background: var(--surface2, #1a1a1a);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11.5px;
      line-height: 1.5;
      outline: none;
    }
    .editor-body:focus { border-color: #4d3a75; }

    .editor-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      padding: 10px 14px 12px;
      flex-shrink: 0;
    }
    .editor-tags .tag-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; padding: 4px 7px; }
    .editor-tags .tag-x { cursor: pointer; color: var(--muted); }
    .editor-tags .tag-x:hover { color: #d98a8a; }

    .tag-add {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 3px;
      background: var(--surface2, #1a1a1a);
      border: 1px dashed var(--border2);
      color: var(--muted);
      cursor: pointer;
    }
    .tag-add:hover { color: #b9a2e8; border-color: #4d3a75; }
    .tag-input {
      width: 104px;
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 4px 7px;
      border-radius: 3px;
      background: var(--surface2, #1a1a1a);
      border: 1px solid #4d3a75;
      color: var(--text);
      outline: none;
    }
    /* Tag filtering lives inside the prompts section — tags belong to prompts,
       so they must not sit at the same level as the type filters above. */
    .tag-filter { position: relative; margin-left: auto; margin-right: 10px; }
    .tag-filter-btn {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: none;
      padding: 3px 7px;
      border-radius: 3px;
      background: var(--surface2, #1a1a1a);
      border: 1px solid var(--border2);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tag-filter-btn:hover { color: #b9a2e8; border-color: #4d3a75; }
    .tag-filter-btn.on { color: #0b0b0b; background: #b9a2e8; border-color: #b9a2e8; }
    .tag-filter-btn .caret { font-size: 7px; opacity: 0.7; }

    .tag-menu {
      position: absolute;
      right: 0;
      top: 130%;
      z-index: 30;
      min-width: 128px;
      max-height: 190px;
      overflow-y: auto;
      padding: 4px;
      background: #141018;
      border: 1px solid #33234d;
      border-radius: 5px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.55);
      display: none;
    }
    .tag-menu.show { display: block; }
    .tag-menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-radius: 3px;
      padding: 5px 7px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-2, #b8b8b8);
      cursor: pointer;
      text-transform: none;
      letter-spacing: 0;
    }
    .tag-menu button:hover { background: #1e1728; color: #c9a4ff; }
    .tag-menu button.on { color: #c9a4ff; }
    .tag-menu .menu-sep { height: 1px; background: var(--border); margin: 4px 2px; }

    /* ---------- extracted text sheet ---------- */
    .ocr-sheet { border-top-color: #2a4a3a; }
    .ocr-sheet .editor-title { color: #8fd0a8; }
    .ocr-list {
      margin: 0 14px 12px;
      overflow-y: auto;
      max-height: 260px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ocr-list::-webkit-scrollbar { width: 3px; }
    .ocr-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
    .ocr-list::-webkit-scrollbar-track { background: transparent; }
    .ocr-empty { padding: 18px 4px; font-size: 11px; color: var(--muted); text-align: center; }
    .ocr-status {
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
    }
    .ocr-bar {
      height: 2px;
      margin-top: 8px;
      background: var(--border);
      border-radius: 1px;
      overflow: hidden;
    }
    .ocr-bar span { display: block; height: 100%; width: 0; background: #4e9e73; transition: width 0.2s; }

    /* picker that opens from "+ tag" — existing tags to choose, or type a new one */
    .tag-picker {
      position: absolute;
      left: 14px;
      bottom: 44px;
      z-index: 30;
      width: 176px;
      padding: 6px;
      background: #141018;
      border: 1px solid #33234d;
      border-radius: 5px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.55);
      display: none;
    }
    .tag-picker.show { display: block; }
    .tag-picker .tag-input { width: 100%; box-sizing: border-box; margin-bottom: 5px; }
    .tag-suggestions { max-height: 132px; overflow-y: auto; }
    .tag-suggestions button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-radius: 3px;
      padding: 5px 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-2, #b8b8b8);
      cursor: pointer;
    }
    .tag-suggestions button:hover, .tag-suggestions button.active { background: #1e1728; color: #c9a4ff; }
    .tag-suggestions .none { padding: 5px 6px; font-family: var(--font-mono); font-size: 9px; color: var(--muted2); }
    .type-badge.prompt {
      color: #c9a4ff;
      background: #1a1226;
      border: 1px solid #33234d;
    }
    .prompt-btn.on { color: #c9a4ff; }
    .prompt-btn:hover { color: #c9a4ff; }
    .section-content.collapsed {
      display: none;
    }

    /* pin button — little star/dot on each item */
    .pin-btn {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 3px;
      color: var(--muted);
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 3px 7px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
      line-height: 1;
    }
    .pin-btn:hover { color: #d4a06a; border-color: #3a2510; }
    .pin-btn.pinned {
      color: #d4a06a;
      border-color: #3a2510;
      background: #1f160a;
    }
    .pin-btn.pinned:hover { color: #ecb57d; }
  </style>
</head>
<body>
  <div class="shell">
  <div class="inspector" id="inspector">
    <div class="insp-head">
      <span class="insp-title">select text from image</span>
      <span class="insp-hint" id="inspHint">tap the highlighted areas</span>
      <button class="close-btn" id="inspClose" title="close (Esc)">×</button>
    </div>
    <div class="insp-canvas">
      <div class="insp-stage" id="inspStage"></div>
    </div>
    <div class="insp-out empty" id="inspOut">selected text appears here</div>
    <div class="insp-actions">
      <button class="insp-btn" id="inspCopy" disabled>copy text</button>
      <button class="insp-btn prompt" id="inspPrompt" disabled>add to prompts</button>
    </div>
  </div>

  <div class="app">
    <div class="titlebar">
      <span class="title">stash</span>
      <div class="titlebar-right">
        <button class="update-badge" id="updateBadge" title="" style="display:none">
          <span class="update-arrow">↑</span>
          <span id="updateLabel"></span>
        </button>
        <button class="pause-btn" id="pauseBtn" title="pause clipboard capture">
          <span class="dot"></span>
          <span id="pauseLabel">live</span>
        </button>
        <button class="close-btn" id="closeBtn" title="hide (⌘⇧V)">×</button>
      </div>
    </div>

    <div class="paused-banner">clipboard capture paused</div>

    <div class="controls">
      <input class="search-input" id="search" placeholder="search clipboard..." />
      <div class="filters">
        <button class="pill active" data-type="all">all</button>
        <button class="pill" data-type="prompt">prompt</button>
        <button class="pill" data-type="pinned">pinned</button>
        <button class="pill" data-type="text">text</button>
        <button class="pill" data-type="code">code</button>
        <button class="pill" data-type="url">url</button>
        <button class="pill" data-type="img">image</button>
      </div>
    </div>

    <div class="list" id="list">
      <div class="empty">
        Stash quietly remembers while you work.
        <span class="empty-sub">copy anything to begin · <span class="hotkey">⌘</span><span class="hotkey">⇧</span><span class="hotkey">V</span> to toggle</span>
      </div>
    </div>

    <div class="editor" id="editor">
      <div class="editor-head">
        <span class="editor-title">edit prompt</span>
        <span class="editor-saved" id="editorSaved">saved</span>
        <button class="close-btn" id="editorClose" title="close (Esc)">×</button>
      </div>
      <textarea class="editor-body" id="editorBody" spellcheck="false"></textarea>
      <div class="editor-tags" id="editorTags"></div>
      <div class="tag-picker" id="tagPicker">
        <input class="tag-input" id="tagPickerInput" placeholder="type a new tag" maxlength="24" />
        <div class="tag-suggestions" id="tagSuggestions"></div>
      </div>
    </div>

    <div class="editor ocr-sheet" id="ocrSheet">
      <div class="editor-head">
        <span class="editor-title">extracted text</span>
        <span class="editor-saved" id="ocrCount"></span>
        <button class="close-btn" id="ocrClose" title="close (Esc)">×</button>
      </div>
      <div class="ocr-list" id="ocrList"></div>
    </div>

    <div class="stack-tray" id="stackTray">
      <div class="stack-deck" id="stackDeck" draggable="true" title="drag the stack anywhere">
        <span class="stack-count" id="stackCount">0</span>
      </div>
      <span class="stack-info">
        <span class="stack-title" id="stackTitle">0 stacked</span>
        <span class="stack-hint">drag it anywhere</span>
      </span>
      <button class="clear-btn" id="selClearBtn">deselect</button>
    </div>

    <div class="footer">
      <span class="footer-info"><span class="skip-pulse" id="skipPulse" title="a secret-looking item was skipped"></span><span id="footerInfo">0 items</span></span>
      <button class="clear-btn" id="clearBtn">clear all</button>
    </div>
  </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let history = [];
    let pinned = [];
    let activeFilter = 'all';
    let searchQuery = '';
    // Section collapse state — in-memory only, resets on app restart
    let collapsed = { prompts: false, pinned: false, recent: false };

    // Multi-select state. `selected` holds clip ids; `renderedOrder` is the
    // flat top-to-bottom order of what's currently on screen, which is what
    // shift-click ranges are measured against (pinned rows come first, and a
    // filter or search can hide anything in between).
    const selected = new Set();
    let renderedOrder = [];
    let anchorId = null;

    const listEl = document.getElementById('list');
    const footerEl = document.getElementById('footerInfo');
    const searchEl = document.getElementById('search');
    const toastEl = document.getElementById('toast');
    // tag chosen in the prompts-section dropdown; narrows prompts only
    let activeTag = null;
    // prompt editor state — the id of the prompt whose sheet is open
    let editingId = null;
    let editorSaveTimer = null;
    const editorEl = document.getElementById('editor');
    const editorBodyEl = document.getElementById('editorBody');
    const editorTagsEl = document.getElementById('editorTags');
    const editorSavedEl = document.getElementById('editorSaved');
    const tagPickerEl = document.getElementById('tagPicker');
    const tagPickerInputEl = document.getElementById('tagPickerInput');
    const tagSuggestionsEl = document.getElementById('tagSuggestions');

    const stackTrayEl = document.getElementById('stackTray');
    const stackDeckEl = document.getElementById('stackDeck');
    const stackCountEl = document.getElementById('stackCount');
    const stackTitleEl = document.getElementById('stackTitle');
    // ids currently drawn in the deck, so we only animate what actually changed
    let stackDrawn = [];
    // rasterized stack, handed to the OS as the drag cursor; rebuilt off the
    // critical path because dragstart can't wait on image decoding
    let stackIconUrl = null;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function timeAgo(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 10) return 'just now';
      if (s < 60) return s + 's ago';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm ago';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.floor(h / 24) + 'd ago';
    }

    function itemMatchesFilter(c, isPinned) {
      // search applies to every filter, including the pseudo-types
      if (searchQuery && !c.content.toLowerCase().includes(searchQuery)) return false;
      if (activeFilter === 'prompt') return !!c.isPrompt;
      if (activeFilter === 'pinned') return isPinned && !c.isPrompt;
      if (activeFilter !== 'all' && c.type !== activeFilter) return false;
      return true;
    }

    // URL helpers
    function domainOf(url) {
      try {
        const u = new URL(url);
        return u.hostname.replace(/^www\./, '');
      } catch { return null; }
    }
    function urlHeadline(url) {
      try {
        const u = new URL(url);
        const path = (u.pathname + u.search).replace(/^\//, '');
        if (path.length > 0) return path.slice(0, 80);
        return u.hostname.replace(/^www\./, '');
      } catch { return url.slice(0, 80); }
    }

    // crude language detection — used for the small lang-tag on code clips
    function detectLang(text) {
      const t = text.trim();
      if (/^\s*<[a-z]/i.test(t)) return 'html';
      if (/^\s*(import|from|def |class )/.test(t)) return 'py';
      if (/(^|\s)(function|const|let|var|=>|import .* from)/.test(t)) return 'js';
      if (/^\s*SELECT |^\s*INSERT |^\s*UPDATE |^\s*WHERE /i.test(t)) return 'sql';
      if (/(^|\s)#include|::\s*\w+/.test(t)) return 'c';
      if (/^\s*\{[\s\S]*\}\s*$/.test(t) && t.includes('"')) return 'json';
      return null;
    }

    // ---------- multi-select ----------
    // Resolve selected ids back to clips, in the order they appear on screen,
    // so a batch drop lands in the same order the user sees.
    function selectedClips() {
      const byId = new Map([...pinned, ...history].map(c => [c.id, c]));
      return renderedOrder.filter(id => selected.has(id)).map(id => byId.get(id)).filter(Boolean);
    }

    function selectRange(fromId, toId) {
      const a = renderedOrder.indexOf(fromId);
      const b = renderedOrder.indexOf(toId);
      if (a === -1 || b === -1) { selected.add(toId); return; }
      const [lo, hi] = a < b ? [a, b] : [b, a];
      for (let i = lo; i <= hi; i++) selected.add(renderedOrder[i]);
    }

    function clearSelection() {
      selected.clear();
      anchorId = null;
      syncSelection();
    }

    // Paint selection state without a full re-render — re-rendering on every
    // click would rebuild every row and kill the drag the user is about to
    // start. `originRect` is the row a clip was just taken from, so its card
    // can fly out of that row instead of blinking into existence.
    function syncSelection(originRect) {
      document.querySelectorAll('.item').forEach(n => {
        n.classList.toggle('selected', selected.has(n.dataset.id));
      });
      updateStack(originRect);
    }

    // ---------- prompt editor ----------
    function findClip(id) {
      return pinned.find(p => p.id === id) || history.find(h => h.id === id) || null;
    }

    function openEditor(id) {
      // both sheets dock to the same edge, so only one can be up at a time
      closeOcr();
      editingId = id;
      const c = findClip(id);
      if (!c) return closeEditor();
      editorBodyEl.value = c.content || '';
      renderEditorTags();
      editorEl.classList.add('show');
      markEditingRow();
      editorBodyEl.focus();
    }

    function closeEditor() {
      flushEditorContent();
      closeTagPicker();
      editingId = null;
      editorEl.classList.remove('show');
      markEditingRow();
    }

    function markEditingRow() {
      document.querySelectorAll('.item').forEach(n => {
        n.classList.toggle('editing', !!editingId && n.dataset.id === editingId);
      });
    }

    function flashSaved() {
      editorSavedEl.classList.add('show');
      clearTimeout(flashSaved._t);
      flashSaved._t = setTimeout(() => editorSavedEl.classList.remove('show'), 900);
    }

    // content autosaves as you type; tags save the moment they change
    function flushEditorContent() {
      clearTimeout(editorSaveTimer);
      if (!editingId) return;
      const c = findClip(editingId);
      const next = editorBodyEl.value;
      if (!c || !next.trim() || next === c.content) return;
      window.api.updatePrompt(editingId, { content: next }).then(ok => { if (ok) flashSaved(); });
    }

    function renderEditorTags() {
      const c = editingId ? findClip(editingId) : null;
      const tags = (c && c.tags) || [];
      editorTagsEl.innerHTML = '';
      tags.forEach(t => {
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        chip.innerHTML = `<span></span><span class="tag-x" title="remove">×</span>`;
        chip.firstChild.textContent = t;
        chip.querySelector('.tag-x').addEventListener('click', () => setTags(tags.filter(x => x !== t)));
        editorTagsEl.appendChild(chip);
      });

      const add = document.createElement('button');
      add.className = 'tag-add';
      add.textContent = '+ tag';
      add.addEventListener('click', (e) => { e.stopPropagation(); openTagPicker(); });
      editorTagsEl.appendChild(add);
    }

    async function setTags(tags) {
      if (!editingId) return;
      const ok = await window.api.updatePrompt(editingId, { tags });
      if (ok) flashSaved();
    }

    // ---------- extracted text ----------
    // OCR runs in main; this just shows what came back. Each block is its own
    // row so a screenshot becomes a set of separate copies, not one dump.
    const ocrSheetEl = document.getElementById('ocrSheet');
    const ocrListEl = document.getElementById('ocrList');
    const ocrCountEl = document.getElementById('ocrCount');
    let ocrBusyId = null;

    // the inspector — the picture with its text regions drawn over it
    const inspectorEl = document.getElementById('inspector');
    const inspStageEl = document.getElementById('inspStage');
    const inspOutEl = document.getElementById('inspOut');
    const inspHintEl = document.getElementById('inspHint');
    const inspCopyEl = document.getElementById('inspCopy');
    const inspPromptEl = document.getElementById('inspPrompt');
    let inspBlocks = [];
    const inspPicked = new Set();

    function closeOcr() {
      ocrSheetEl.classList.remove('show');
      closeInspector();
    }

    function closeInspector() {
      if (!inspectorEl.classList.contains('show')) return;
      inspectorEl.classList.remove('show');
      inspStageEl.innerHTML = '';
      inspBlocks = [];
      inspPicked.clear();
      syncInspOut();
      window.api.expandWindow(false);
    }

    async function openInspector(dataUrl, blocks) {
      inspBlocks = blocks;
      inspPicked.clear();
      inspStageEl.innerHTML = '';
      // widen the OS window first so the picture is measured at its real size
      await window.api.expandWindow(true);
      inspectorEl.classList.add('show');

      const img = new Image();
      img.alt = '';
      inspStageEl.appendChild(img);
      img.onload = () => drawRegions(img);
      img.src = dataUrl;

      inspHintEl.textContent = blocks.length
        ? `${blocks.length} area${blocks.length === 1 ? '' : 's'} found`
        : 'no text found';
      syncInspOut();
    }

    // Boxes come back in image pixels; the picture is displayed scaled to fit,
    // so every box is scaled by the same factor to land on top of its text.
    function drawRegions(img) {
      inspStageEl.querySelectorAll('.region').forEach(r => r.remove());
      // Position boxes as percentages of the image's natural size rather than
      // measuring the rendered element. naturalWidth is known the moment the
      // image decodes, so this needs no layout to have happened, and the boxes
      // track the picture for free when the window resizes.
      const nw = img.naturalWidth || 1;
      const nh = img.naturalHeight || 1;
      const pct = (v, total) => (v / total * 100) + '%';
      inspBlocks.forEach((b, i) => {
        if (!b.bbox) return;
        const el = document.createElement('div');
        el.className = 'region' + (inspPicked.has(i) ? ' picked' : '');
        el.dataset.index = String(i);
        el.title = b.text;
        el.style.left = pct(b.bbox.x0, nw);
        el.style.top = pct(b.bbox.y0, nh);
        el.style.width = pct(b.bbox.x1 - b.bbox.x0, nw);
        el.style.height = pct(b.bbox.y1 - b.bbox.y0, nh);
        el.addEventListener('click', () => {
          if (inspPicked.has(i)) inspPicked.delete(i);
          else inspPicked.add(i);
          el.classList.toggle('picked', inspPicked.has(i));
          syncInspOut();
        });
        inspStageEl.appendChild(el);
      });
    }

    function pickedText() {
      return [...inspPicked].sort((a, b) => a - b).map(i => inspBlocks[i].text).join('\n\n');
    }

    function syncInspOut() {
      const text = pickedText();
      inspOutEl.textContent = text || 'selected text appears here';
      inspOutEl.classList.toggle('empty', !text);
      inspCopyEl.disabled = !text;
      inspPromptEl.disabled = !text;
      if (inspBlocks.length) {
        inspHintEl.textContent = inspPicked.size
          ? `${inspPicked.size} of ${inspBlocks.length} selected`
          : `${inspBlocks.length} area${inspBlocks.length === 1 ? '' : 's'} found`;
      }
    }

    inspCopyEl.addEventListener('click', async () => {
      const text = pickedText();
      if (!text) return;
      await window.api.write({ type: 'text', content: text });
      toast('copied — paste with ⌘V');
    });

    inspPromptEl.addEventListener('click', async () => {
      const text = pickedText();
      if (!text) return;
      const ok = await window.api.createPrompt(text);
      toast(ok ? 'saved as a prompt — kept forever' : 'could not save that');
    });

    document.getElementById('inspClose').addEventListener('click', closeInspector);
    // hiding the drawer must also shrink the window back, or it reopens wide
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) closeInspector();
    });

    function showOcrStatus(label, pct) {
      ocrListEl.innerHTML = `<div class="ocr-status">${esc(label)}<div class="ocr-bar"><span style="width:${Math.round(pct * 100)}%"></span></div></div>`;
    }

    async function runOcr(id) {
      if (ocrBusyId) return;
      ocrBusyId = id;
      closeEditor();
      ocrSheetEl.classList.add('show');
      ocrCountEl.classList.add('show');
      ocrCountEl.textContent = 'reading…';
      // the first run also unpacks the language data, so it's the slow one
      showOcrStatus('reading the image…', 0.05);
      try {
        const res = await window.api.ocr(id);
        if (!res || !res.ok) {
          ocrListEl.innerHTML = `<div class="ocr-empty">${esc((res && res.error) || 'could not read that image')}</div>`;
          ocrCountEl.textContent = '';
          return;
        }
        // hand off to the inspector: the picture with its regions, not a list
        ocrSheetEl.classList.remove('show');
        await openInspector(res.dataUrl, res.blocks || []);
      } finally {
        ocrBusyId = null;
      }
    }

    function onOcrProgress(m) {
      if (!ocrBusyId || !m) return;
      const label = m.status === 'recognizing text' ? 'reading the image…'
        : m.status === 'loading language traineddata' || m.status === 'loading tesseract core'
          ? 'warming up the reader…'
          : (m.status || 'working…');
      showOcrStatus(label, typeof m.progress === 'number' ? Math.max(0.05, m.progress) : 0.05);
    }

    document.getElementById('ocrClose').addEventListener('click', closeOcr);

    // ---------- tag picker ----------
    // Reusing an existing tag has to be as easy as inventing one, otherwise a
    // library drifts into "img gen", "image gen", "image-gen" within a week.
    function openTagPicker() {
      tagPickerEl.classList.add('show');
      tagPickerInputEl.value = '';
      renderTagSuggestions();
      tagPickerInputEl.focus();
    }

    function closeTagPicker() {
      tagPickerEl.classList.remove('show');
    }

    function renderTagSuggestions() {
      const c = editingId ? findClip(editingId) : null;
      const mine = new Set(((c && c.tags) || []).map(t => t.toLowerCase()));
      const typed = tagPickerInputEl.value.trim().toLowerCase();
      const options = allTags()
        .filter(t => !mine.has(t.toLowerCase()))
        .filter(t => !typed || t.toLowerCase().includes(typed));

      tagSuggestionsEl.innerHTML = '';
      options.forEach(t => {
        const b = document.createElement('button');
        b.textContent = t;
        b.addEventListener('mousedown', (e) => { e.preventDefault(); addTag(t); });
        tagSuggestionsEl.appendChild(b);
      });

      if (!options.length) {
        const none = document.createElement('div');
        none.className = 'none';
        none.textContent = typed ? 'press enter to create' : 'no other tags yet';
        tagSuggestionsEl.appendChild(none);
      }
    }

    function addTag(tag) {
      const c = editingId ? findClip(editingId) : null;
      if (!c) return;
      const next = [...(c.tags || []), tag];
      tagPickerInputEl.value = '';
      setTags(next).then(() => {
        // stay open so several tags can be added in one visit
        renderTagSuggestions();
        tagPickerInputEl.focus();
      });
    }

    tagPickerInputEl.addEventListener('input', renderTagSuggestions);
    tagPickerInputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const typed = tagPickerInputEl.value.trim();
        // enter takes the sole remaining suggestion, else creates what was typed
        const only = tagSuggestionsEl.querySelectorAll('button');
        if (!typed && only.length === 1) addTag(only[0].textContent);
        else if (typed) addTag(typed);
      }
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeTagPicker(); }
    });
    tagPickerInputEl.addEventListener('blur', () => setTimeout(closeTagPicker, 120));

    editorBodyEl.addEventListener('input', () => {
      clearTimeout(editorSaveTimer);
      editorSaveTimer = setTimeout(flushEditorContent, 400);
    });
    editorBodyEl.addEventListener('blur', flushEditorContent);
    document.getElementById('editorClose').addEventListener('click', closeEditor);

    // clicking anywhere else dismisses the tag dropdown
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.tag-filter')) {
        document.querySelectorAll('.tag-menu.show').forEach(m => m.classList.remove('show'));
      }
    });

    // every distinct tag across the library, for the filter row
    function allTags() {
      const seen = new Map();
      pinned.forEach(c => (c.tags || []).forEach(t => {
        const k = t.toLowerCase();
        if (!seen.has(k)) seen.set(k, t);
      }));
      return [...seen.values()].sort((a, b) => a.localeCompare(b));
    }

    // The tag dropdown that hangs off the prompts section header. It narrows
    // the prompts section only — it is not a top-level filter, because a tag
    // is something a prompt has, not a kind of clip.
    function buildTagFilter() {
      const tags = allTags();
      if (!tags.length) return null;

      const wrap = document.createElement('div');
      wrap.className = 'tag-filter';
      wrap.addEventListener('click', (e) => e.stopPropagation()); // don't collapse the section

      const btn = document.createElement('button');
      btn.className = 'tag-filter-btn' + (activeTag ? ' on' : '');
      btn.id = 'tagFilterBtn';
      btn.innerHTML = `<span></span><span class="caret">▼</span>`;
      btn.firstChild.textContent = activeTag || 'all tags';

      const menu = document.createElement('div');
      menu.className = 'tag-menu';
      menu.id = 'tagMenu';

      const addOption = (label, value) => {
        const b = document.createElement('button');
        b.textContent = label;
        b.dataset.tag = value === null ? '' : value;
        if ((value === null && !activeTag) || (value !== null && activeTag === value)) b.classList.add('on');
        b.addEventListener('click', () => {
          activeTag = value;
          menu.classList.remove('show');
          render();
        });
        menu.appendChild(b);
      };

      addOption('all tags', null);
      const sep = document.createElement('div');
      sep.className = 'menu-sep';
      menu.appendChild(sep);
      tags.forEach(t => addOption(t, t));

      btn.addEventListener('click', () => menu.classList.toggle('show'));
      wrap.appendChild(btn);
      wrap.appendChild(menu);
      return wrap;
    }

    // ---------- the stack ----------
    const MAX_CARDS = 5;
    const GLYPH = { text: 'T', code: '{}', url: '@', img: '◨' };

    // Deterministic tilt — a card must not re-shuffle its angle every redraw,
    // or the deck twitches every time you add one.
    function tiltFor(id) {
      let h = 0;
      for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
      return ((h % 13) - 6) * 0.9;
    }

    function updateStack(originRect) {
      const clips = selectedClips();
      const n = clips.length;
      const wasShown = stackTrayEl.classList.contains('show');
      stackTrayEl.classList.toggle('show', n > 0);

      if (n === 0) {
        stackDeckEl.querySelectorAll('.stack-card').forEach(el => el.remove());
        stackDrawn = [];
        stackIconUrl = null;
        return;
      }

      stackTitleEl.textContent = n === 1 ? '1 clip stacked' : `${n} clips stacked`;
      if (stackCountEl.textContent !== String(n)) {
        stackCountEl.textContent = String(n);
        if (!reduceMotion && wasShown) {
          stackCountEl.classList.remove('bump');
          void stackCountEl.offsetWidth; // reflow, so the animation restarts
          stackCountEl.classList.add('bump');
        }
      }

      // the deck shows the most recent few; the badge carries the real count
      const shown = clips.slice(-MAX_CARDS);
      const shownIds = shown.map(c => c.id);

      stackDeckEl.querySelectorAll('.stack-card').forEach(el => {
        if (!shownIds.includes(el.dataset.id)) {
          el.classList.add('leaving');
          el.dataset.leaveTimer = String(setTimeout(() => el.remove(), 200));
        }
      });

      shown.forEach((c, i) => {
        let card = stackDeckEl.querySelector(`.stack-card[data-id="${CSS.escape(c.id)}"]`);
        // Re-picking a clip while its card is still fading out would otherwise
        // resurrect a card mid-exit — invisible and shrunk. Catch it and cancel.
        if (card && card.classList.contains('leaving')) {
          clearTimeout(Number(card.dataset.leaveTimer));
          delete card.dataset.leaveTimer;
          card.classList.remove('leaving');
        }
        const isNew = !card;
        if (isNew) {
          card = document.createElement('div');
          card.className = 'stack-card';
          card.dataset.id = c.id;
          card.title = 'click to take this one out';
          card.innerHTML = (c.type === 'img' && c.dataUrl)
            ? `<img src="${c.dataUrl}" alt=""/>`
            : `<span>${GLYPH[c.type] || '·'}</span>`;
          card.addEventListener('click', (e) => {
            e.stopPropagation();
            selected.delete(c.id);
            syncSelection();
          });
          stackDeckEl.appendChild(card);
        }
        const x = i * 8;
        const r = tiltFor(c.id);
        card.style.setProperty('--x', x + 'px');
        card.style.setProperty('--r', r + 'deg');
        card.style.zIndex = String(i + 1);
        if (isNew && originRect && !reduceMotion) flyIn(card, originRect, x, r);
      });

      stackDrawn = shownIds;
      buildStackIcon(clips);
    }

    // card leaves the row it was picked from and lands in the deck
    function flyIn(card, originRect, x, r) {
      const to = card.getBoundingClientRect();
      const dx = originRect.left + originRect.width / 2 - (to.left + to.width / 2);
      const dy = originRect.top + originRect.height / 2 - (to.top + to.height / 2);
      card.animate([
        { transform: `translate(${x + dx}px, ${dy}px) scale(1.5) rotate(0deg)`, opacity: 0.25 },
        { transform: `translateX(${x}px) rotate(${r}deg)`, opacity: 1 },
      ], { duration: 400, easing: 'cubic-bezier(0.22, 1.2, 0.36, 1)' });
    }

    function loadImage(src) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = src;
      });
    }

    // draw an image cover-style inside a square, preserving aspect ratio
    function drawCover(ctx, img, x, y, size) {
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, x + (size - w) / 2, y + (size - h) / 2, w, h);
    }

    // Rasterize the deck so the OS drag cursor is the stack itself rather than
    // one generic file icon. Async because images must decode first, so it runs
    // on selection change and the result is waiting by the time a drag starts.
    let stackIconToken = 0;
    async function buildStackIcon(clips) {
      const token = ++stackIconToken;
      const shown = clips.slice(-4);
      const W = 140, H = 112, s = 74;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      for (let i = 0; i < shown.length; i++) {
        const c = shown[i];
        const img = (c.type === 'img' && c.dataUrl) ? await loadImage(c.dataUrl).catch(() => null) : null;
        if (token !== stackIconToken) return; // a newer selection superseded us
        ctx.save();
        ctx.translate(W / 2 + (i - (shown.length - 1) / 2) * 12, H / 2 + i * 2);
        ctx.rotate((tiltFor(c.id) * Math.PI) / 180);
        ctx.beginPath();
        ctx.roundRect(-s / 2, -s / 2, s, s, 10);
        ctx.fillStyle = '#1c1c1c';
        ctx.fill();
        if (img) {
          ctx.save();
          ctx.clip();
          drawCover(ctx, img, -s / 2, -s / 2, s);
          ctx.restore();
        } else {
          ctx.fillStyle = '#9aa4c0';
          ctx.font = '600 26px ui-monospace, monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(GLYPH[c.type] || '·', 0, 2);
        }
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.stroke();
        ctx.restore();
      }

      if (token !== stackIconToken) return;
      stackIconUrl = canvas.toDataURL('image/png');
    }

    function buildItemEl(c, isPinned) {
      const el = document.createElement('div');
      let cls = 'item';
      if (c._new) cls += ' new';
      if (c._promoted) cls += ' promoted';
      if (selected.has(c.id)) cls += ' selected';
      el.className = cls;
      el.draggable = true;
      el.dataset.id = c.id;
      renderedOrder.push(c.id);

      // prompts are permanent by definition, so they say so instead of aging
      const stamp = c.isPrompt ? 'prompt' : (isPinned ? 'pinned' : timeAgo(c.ts));

      // Build per-type content. The hierarchy is consistent:
      //   [drag] [type badge] [headline + meta + (optional thumb)]
      let headlineHtml = '';
      let extraHtml = '';
      let metaParts = [];

      if (c.type === 'url') {
        const dom = domainOf(c.content);
        headlineHtml = `<div class="item-headline">${esc(urlHeadline(c.content))}</div>`;
        if (dom) metaParts.push(`<span class="domain">${esc(dom)}</span>`);
        metaParts.push(`<span class="dot">·</span>`);
        metaParts.push(`<span class="time">${stamp}</span>`);
      } else if (c.type === 'code') {
        // code preview — first ~3 lines, monospace, in a tinted box
        const lines = c.content.split('\n');
        const previewText = lines.slice(0, 3).join('\n').slice(0, 240);
        headlineHtml = `<div class="item-headline code-preview">${esc(previewText)}</div>`;
        const lang = detectLang(c.content);
        if (lang) metaParts.push(`<span class="lang-tag">${lang}</span>`);
        metaParts.push(`<span class="time">${stamp}</span>`);
        if (lines.length > 3) metaParts.push(`<span class="dot">·</span><span>+${lines.length - 3} more lines</span>`);
      } else if (c.type === 'img') {
        headlineHtml = `<div class="item-headline">${esc(c.meta || 'image')}</div>`;
        metaParts.push(`<span class="time">${stamp}</span>`);
        if (c.dataUrl) {
          extraHtml = `<img class="item-image" src="${c.dataUrl}" alt=""/>`;
        }
      } else {
        // text — first line big, fade if there's more
        const lines = c.content.split('\n');
        const firstLine = lines[0].slice(0, 200);
        const hasMore = lines.length > 1 || c.content.length > firstLine.length;
        const headlineClass = hasMore ? 'item-headline clamp-2' : 'item-headline';
        // For multiline, show first 2 lines clamped; otherwise just first line
        const showText = hasMore ? c.content.slice(0, 240) : firstLine;
        headlineHtml = `<div class="${headlineClass}">${esc(showText)}</div>`;
        metaParts.push(`<span class="time">${stamp}</span>`);
        if (hasMore && lines.length > 2) {
          metaParts.push(`<span class="dot">·</span><span>+${lines.length - 2} more lines</span>`);
        }
      }

      const metaHtml = `<div class="item-meta">${metaParts.join('')}</div>`;
      // tags ride under the meta line so the library can be skimmed
      const tagsHtml = (c.tags && c.tags.length)
        ? `<div class="item-tags">${c.tags.map(t => `<span class="tag-chip">${esc(t)}</span>`).join('')}</div>`
        : '';

      el.innerHTML = `
        <div class="drag-handle">
          <div class="dot-row"><span></span><span></span></div>
          <div class="dot-row"><span></span><span></span></div>
          <div class="dot-row"><span></span><span></span></div>
        </div>
        <div class="item-icon-col">
          <span class="type-badge ${c.isPrompt ? 'prompt' : c.type}">${c.isPrompt ? 'prompt' : c.type}</span>
        </div>
        <div class="item-content">
          ${headlineHtml}
          ${metaHtml}
          ${tagsHtml}
          ${extraHtml}
        </div>
        <div class="actions">
          <button class="pin-btn prompt-btn ${c.isPrompt ? 'on' : ''}" data-act="prompt" title="${c.isPrompt ? 'stop keeping this as a prompt' : 'save as a prompt — kept forever'}">✦</button>
          ${c.isPrompt ? `<button class="act-btn" data-act="edit" title="edit text and tags">edit</button>` : `<button class="pin-btn ${isPinned ? 'pinned' : ''}" data-act="pin" title="${isPinned ? 'unpin' : 'pin'}">${isPinned ? '★' : '☆'}</button>`}
          ${c.type === 'img' ? `<button class="act-btn" data-act="ocr" title="pull the text out of this image">text</button>` : ''}
          <button class="act-btn" data-act="copy" title="copy">copy</button>
          <button class="act-btn danger" data-act="del" title="delete">del</button>
        </div>
      `;

      // native drag-out — dragging a row that's part of a multi-selection
      // carries the whole selection; dragging anything else carries just it,
      // matching how Finder and Explorer behave.
      el.addEventListener('dragstart', (e) => {
        e.preventDefault();
        window.api.drawerDragStart();
        if (selected.has(c.id) && selected.size > 1) {
          const entries = selectedClips();
          document.querySelectorAll('.item.selected').forEach(n => n.classList.add('dragging'));
          window.api.startDragMulti(entries, stackIconUrl);
        } else {
          el.classList.add('dragging');
          window.api.startDrag(c);
        }
      });
      el.addEventListener('dragend', () => {
        document.querySelectorAll('.item.dragging').forEach(n => n.classList.remove('dragging'));
        window.api.drawerDragEnd();
      });

      el.querySelector('[data-act="copy"]').addEventListener('click', async (e) => {
        e.stopPropagation();
        await window.api.write(c);
        toast('copied — paste with ⌘V');
      });

      el.querySelector('[data-act="del"]').addEventListener('click', async (e) => {
        e.stopPropagation();
        await window.api.delete(c.id);
        if (isPinned) pinned = pinned.filter(p => p.id !== c.id);
        else history = history.filter(h => h.id !== c.id);
        render();
      });

      // prompts have no pin button — marking as a prompt already keeps them
      el.querySelector('[data-act="pin"]')?.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (isPinned) {
          await window.api.unpin(c.id);
          toast('unpinned');
        } else {
          await window.api.pin(c.id);
          toast('pinned — kept across restarts');
        }
      });

      el.querySelector('[data-act="ocr"]')?.addEventListener('click', (e) => {
        e.stopPropagation();
        runOcr(c.id);
      });

      el.querySelector('[data-act="edit"]')?.addEventListener('click', (e) => {
        e.stopPropagation();
        if (editingId === c.id) closeEditor();
        else openEditor(c.id);
      });

      el.querySelector('[data-act="prompt"]').addEventListener('click', async (e) => {
        e.stopPropagation();
        if (c.isPrompt) {
          await window.api.unmarkPrompt(c.id);
          toast('no longer a prompt — back in history');
        } else {
          await window.api.markPrompt(c.id);
          toast('saved as a prompt — kept forever');
        }
      });

      // click anywhere else re-copies — unless a selection modifier is held,
      // in which case the click is about building a selection, not copying
      el.addEventListener('click', async (e) => {
        if (e.metaKey || e.ctrlKey) {
          if (selected.has(c.id)) selected.delete(c.id);
          else selected.add(c.id);
          anchorId = c.id;
          syncSelection(el.getBoundingClientRect());
          return;
        }
        if (e.shiftKey) {
          // shift without a prior anchor behaves like a plain toggle
          selectRange(anchorId || c.id, c.id);
          anchorId = anchorId || c.id;
          window.getSelection().removeAllRanges();
          syncSelection(el.getBoundingClientRect());
          return;
        }
        if (selected.size > 0) clearSelection();
        await window.api.write(c);
        toast('copied — paste with ⌘V');
      });

      if (c._new) setTimeout(() => { c._new = false; }, 400);
      if (c._promoted) setTimeout(() => { c._promoted = false; }, 800);

      return el;
    }

    function buildSectionLabel(key, iconHtml, labelText, count) {
      const label = document.createElement('div');
      const isCollapsed = collapsed[key];
      label.className = 'section-label' + (isCollapsed ? ' collapsed' : '');
      label.dataset.section = key;
      label.innerHTML = `
        <span class="section-label-left">
          <span class="chevron"></span>
          ${iconHtml ? `<span>${iconHtml}</span>` : ''}
          <span>${labelText}</span>
        </span>
        <span class="count">${count}</span>
      `;
      label.addEventListener('click', () => {
        collapsed[key] = !collapsed[key];
        render();
      });
      return label;
    }

    function render() {
      // buildItemEl repopulates this as it walks the sections in visual order
      renderedOrder = [];
      // drop ids that no longer exist — deleted, or cleared out of history
      const liveIds = new Set([...pinned, ...history].map(c => c.id));
      for (const id of [...selected]) if (!liveIds.has(id)) selected.delete(id);

      // a tag that no longer exists anywhere shouldn't keep filtering
      if (activeTag && !allTags().some(t => t.toLowerCase() === activeTag.toLowerCase())) activeTag = null;

      // a prompt that stopped being one (or was deleted) takes its sheet with it
      if (editingId) {
        const still = pinned.find(p => p.id === editingId && p.isPrompt);
        if (!still) { editingId = null; editorEl.classList.remove('show'); }
        else {
          renderEditorTags();
          // don't yank the text out from under someone mid-edit
          if (document.activeElement !== editorBodyEl) editorBodyEl.value = still.content || '';
        }
      }

      // prompts share the persistent store with pinned clips but are their own
      // section, so they never read as "just another pinned thing"
      // the tag dropdown narrows the prompts section and nothing else
      const promptsBeforeTag = pinned.filter(c => c.isPrompt && itemMatchesFilter(c, true));
      const visiblePrompts = promptsBeforeTag.filter(c =>
        !activeTag || (c.tags || []).some(t => t.toLowerCase() === activeTag.toLowerCase()));
      const visiblePinned = pinned.filter(c => !c.isPrompt && itemMatchesFilter(c, true));
      const visibleHistory = (activeFilter === 'pinned' || activeFilter === 'prompt')
        ? []
        : history.filter(c => itemMatchesFilter(c, false));

      // Auto-expand on active search if matches exist in the hidden section.
      // Without this, typing a query that only matches pinned/recent in a
      // collapsed section silently returns nothing — feels broken.
      if (searchQuery) {
        if (collapsed.prompts && visiblePrompts.length > 0) collapsed.prompts = false;
        if (collapsed.pinned && visiblePinned.length > 0) collapsed.pinned = false;
        if (collapsed.recent && visibleHistory.length > 0) collapsed.recent = false;
      }

      const promptTotal = pinned.filter(c => c.isPrompt).length;
      const pinnedTotal = pinned.length - promptTotal;
      const totalVisible = visiblePrompts.length + visiblePinned.length + visibleHistory.length;
      const totalItems = history.length + pinned.length;
      footerEl.textContent = `${totalVisible} of ${totalItems} items${pinnedTotal ? ` · ${pinnedTotal} pinned` : ''}${promptTotal ? ` · ${promptTotal} prompt${promptTotal === 1 ? '' : 's'}` : ''}`;

      // keep going when a tag filter emptied the prompts section — otherwise the
      // dropdown that set it disappears and there's no way to undo it
      if (totalVisible === 0 && promptsBeforeTag.length === 0) {
        if (totalItems === 0) {
          listEl.innerHTML = `<div class="empty">Stash quietly remembers while you work.<span class="empty-sub">copy anything to begin · <span class="hotkey">⌘</span><span class="hotkey">⇧</span><span class="hotkey">V</span> to toggle</span></div>`;
        } else {
          listEl.innerHTML = `<div class="empty">nothing matches that.<span class="empty-sub">try a different search</span></div>`;
        }
        syncSelection();
        return;
      }

      listEl.innerHTML = '';

      // Prompts section — top of the drawer, because it's a library you reach
      // for on purpose, not history you scroll past
      if (promptsBeforeTag.length > 0) {
        const section = document.createElement('div');
        section.className = 'prompts-section';
        const label = buildSectionLabel('prompts', '✦', 'prompts', visiblePrompts.length);
        // the tag dropdown belongs to this section, not the filter row above
        const tagFilter = buildTagFilter();
        if (tagFilter) label.insertBefore(tagFilter, label.querySelector('.count'));
        section.appendChild(label);

        const content = document.createElement('div');
        content.className = 'section-content' + (collapsed.prompts ? ' collapsed' : '');
        if (visiblePrompts.length === 0) {
          const none = document.createElement('div');
          none.className = 'empty';
          none.style.padding = '22px 24px';
          none.textContent = 'no prompts tagged “' + activeTag + '”';
          content.appendChild(none);
        } else {
          visiblePrompts.forEach(c => content.appendChild(buildItemEl(c, true)));
        }
        section.appendChild(content);
        listEl.appendChild(section);
      }

      // Pinned section
      if (visiblePinned.length > 0) {
        const section = document.createElement('div');
        section.className = 'pinned-section';
        section.appendChild(buildSectionLabel('pinned', '★', 'pinned', visiblePinned.length));
        const content = document.createElement('div');
        content.className = 'section-content' + (collapsed.pinned ? ' collapsed' : '');
        visiblePinned.forEach(c => content.appendChild(buildItemEl(c, true)));
        section.appendChild(content);
        listEl.appendChild(section);
      }

      // Recent section
      if (visibleHistory.length > 0) {
        // Only show the "recent" header when there's a section above it
        // (otherwise the drawer has one section and the label is visual noise)
        if (visiblePinned.length > 0 || promptsBeforeTag.length > 0) {
          listEl.appendChild(buildSectionLabel('recent', '', 'recent', visibleHistory.length));
          const content = document.createElement('div');
          content.className = 'section-content' + (collapsed.recent ? ' collapsed' : '');
          visibleHistory.forEach(c => content.appendChild(buildItemEl(c, false)));
          listEl.appendChild(content);
        } else {
          visibleHistory.forEach(c => listEl.appendChild(buildItemEl(c, false)));
        }
      }

      syncSelection();
      markEditingRow();
    }

    let toastTimer;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1500);
    }

    // filters — delegated, because tag pills are built from the library and
    // come and go as tags are added
    document.querySelector('.filters').addEventListener('click', (e) => {
      const p = e.target.closest('.pill');
      if (!p) return;
      document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      activeFilter = p.dataset.type;
      render();
    });

    // search
    searchEl.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase();
      render();
    });

    // clear
    document.getElementById('clearBtn').addEventListener('click', async () => {
      if (history.length === 0) return;
      await window.api.clear();
      history = [];
      render();
    });

    // close/hide
    document.getElementById('closeBtn').addEventListener('click', () => window.api.hide());

    document.getElementById('selClearBtn').addEventListener('click', clearSelection);

    // the deck itself is a drag source — gather, then throw, one gesture
    stackDeckEl.addEventListener('dragstart', (e) => {
      e.preventDefault();
      if (selected.size === 0) return;
      window.api.drawerDragStart();
      window.api.startDragMulti(selectedClips(), stackIconUrl);
    });
    stackDeckEl.addEventListener('dragend', () => {
      window.api.drawerDragEnd();
      // the deck settles back after the throw. The selection is deliberately
      // kept: the OS never tells us whether the drop landed, and silently
      // losing a hand-picked stack on a mis-drop is worse than one extra Esc.
      if (!reduceMotion) {
        stackDeckEl.classList.remove('delivered');
        void stackDeckEl.offsetWidth;
        stackDeckEl.classList.add('delivered');
      }
    });

    // escape to hide — but a live selection swallows the first Esc, so the
    // gesture that backs out of selecting isn't also the one that hides everything
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        // back out one layer at a time: menus, editor, selection, then the drawer
        const openMenu = document.querySelector('.tag-menu.show');
        if (openMenu) openMenu.classList.remove('show');
        else if (tagPickerEl.classList.contains('show')) closeTagPicker();
        else if (inspectorEl.classList.contains('show')) closeInspector();
        else if (ocrSheetEl.classList.contains('show')) closeOcr();
        else if (editingId) closeEditor();
        else if (selected.size > 0) clearSelection();
        else window.api.hide();
      }
      // cmd/ctrl+a selects everything currently visible
      const typing = document.activeElement === searchEl || document.activeElement === editorBodyEl
        || document.activeElement?.classList.contains('tag-input');
      if ((e.metaKey || e.ctrlKey) && e.key === 'a' && !typing) {
        e.preventDefault();
        renderedOrder.forEach(id => selected.add(id));
        anchorId = renderedOrder[0] || null;
        syncSelection();
      }
      // cmd/ctrl+f focuses search
      if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
        e.preventDefault();
        searchEl.focus();
      }
    });

    // listen for new clips from main
    window.api.onNewClip((entry) => {
      entry._new = true;
      history = history.filter(h => h.id !== entry.id);
      history.unshift(entry);
      render();
    });

    // listen for promoted (re-copied) clips — bump to top with flash animation
    window.api.onPromoted((entry) => {
      // check if it's in pinned or history
      const pinnedIdx = pinned.findIndex(p => p.id === entry.id);
      if (pinnedIdx > -1) {
        pinned.splice(pinnedIdx, 1);
        entry._promoted = true;
        pinned.unshift(entry);
      } else {
        history = history.filter(h => h.id !== entry.id);
        entry._promoted = true;
        history.unshift(entry);
      }
      render();
    });

    // listen for skipped (secret-looking) clips — pulse the footer dot briefly
    const skipPulse = document.getElementById('skipPulse');
    let skipTimer;
    window.api.onSkipped(() => {
      skipPulse.classList.add('on');
      clearTimeout(skipTimer);
      skipTimer = setTimeout(() => skipPulse.classList.remove('on'), 2500);
    });

    // pause state
    const pauseBtn = document.getElementById('pauseBtn');
    const pauseLabel = document.getElementById('pauseLabel');
    function applyPausedState(paused) {
      document.body.classList.toggle('paused', paused);
      pauseBtn.classList.toggle('paused', paused);
      pauseLabel.textContent = paused ? 'paused' : 'live';
      pauseBtn.title = paused ? 'resume clipboard capture' : 'pause clipboard capture';
    }
    pauseBtn.addEventListener('click', async () => {
      const current = await window.api.getPaused();
      await window.api.setPaused(!current);
      // applyPausedState will be called via onPauseChanged
    });
    window.api.onPauseChanged((v) => applyPausedState(v));

    // listen for history cleared from tray menu
    window.api.onHistoryCleared(() => {
      history = [];
      render();
    });

    window.api.onOcrProgress(onOcrProgress);

    // listen for state updates (pin/unpin actions from main)
    window.api.onStateUpdated((state) => {
      history = state.history || [];
      pinned = state.pinned || [];
      render();
    });

    // listen for update-available notification from main process
    // (fired once at startup if a newer release exists on github, and again
    // every 6 hours while the app is running)
    const updateBadge = document.getElementById('updateBadge');
    const updateLabel = document.getElementById('updateLabel');
    let updateUrl = null;
    window.api.onUpdateAvailable(({ version, url }) => {
      updateUrl = url;
      updateLabel.textContent = version;
      updateBadge.title = `new version ${version} available — click to download`;
      updateBadge.style.display = 'flex';
    });
    updateBadge.addEventListener('click', () => {
      if (updateUrl) window.api.openExternal(updateUrl);
    });

    // initial load
    (async () => {
      const state = await window.api.getHistory();
      history = state.history || [];
      pinned = state.pinned || [];
      const paused = await window.api.getPaused();
      applyPausedState(paused);
      render();
      setInterval(render, 30000);
    })();
  </script>
</body>
</html>
