<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Stash</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Dark is the default and the design the app was built around; light is a
       full second palette rather than an inversion, because the accents that
       read well on near-black are washed out on white. Which one applies is
       decided by the OS, or by the appearance setting, which drives Electron's
       themeSource and therefore prefers-color-scheme. */
    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --surface2: #1a1a1a;
      --surface3: #2a2a2a;
      --border: #222;
      --border2: #2f2f2f;
      --text: #e8e8e8;
      --text-2: #b8b8b8;
      --muted: #666;
      --muted2: #444;
      --on-accent: #0b0b0b;
      --sheet-bg: #131017;
      --menu-bg: #141018;
      --flash: #1e2a1e;
      --hairline: rgba(255, 255, 255, 0.16);

      --prompt: #c9a4ff;
      --prompt-dim: #b9a2e8;
      --prompt-line: #33234d;
      --prompt-line-2: #4d3a75;
      --prompt-tint: #1a1226;
      --prompt-tint-2: #1e1728;
      --prompt-strong: #7c5cbf;
      --prompt-wash: rgba(186, 148, 255, 0.1);

      --session: #79c48f;
      --session-line: #1f3d29;
      --session-line-2: #3f7d5c;
      --session-tint: #0f1f14;
      --session-tint-2: #16201a;
      --session-wash: rgba(121, 196, 143, 0.06);

      --ocr: #8fd0a8;
      --ocr-line: #2a4a3a;
      --ocr-strong: #4e9e73;
      --ocr-wash: rgba(143, 208, 168, 0.1);
      --ocr-wash-2: rgba(143, 208, 168, 0.22);

      --pinned: #d4a06a;
      --pinned-dim: #ecb57d;
      --pinned-2: #c49a3a;
      --pinned-line: #3a2510;
      --pinned-line-2: #2a1f08;
      --pinned-tint: #1f160a;
      --pinned-tint-2: #1a1508;

      --select: #6d8cff;
      --select-dim: #8aa4ff;
      --select-wash: rgba(109, 140, 255, 0.08);
      --select-wash-2: rgba(109, 140, 255, 0.13);
      --select-wash-3: rgba(109, 140, 255, 0.28);

      --danger: #c46a6a;
      --danger-dim: #d98a8a;
      --danger-line: #4a2a2a;

      --styled: #8fb4d8;
      --styled-line: #24384a;
      --styled-tint: #101a22;

      --code: #a0a0ff;
      --code-tint: #161625;
      --code-line: #2a2a44;
      --url: #6dbf8c;
      --url-line: #1a3322;

      --live: #8fbf8f;
      --live-bright: #b8d9b8;
      --live-dim: #5a8a5a;

      --shadow: rgba(0, 0, 0, 0.55);
      /* the light shell floats cards over a shader; dark keeps one flat
         surface, so these only ever get read under prefers-color-scheme: light */
      /* Paper puts the dark ground at #202022, lighter than the near-black the
         drawer is built on, so the cards read as dark wells in a lit fog
         rather than as lit cards on a dark one. Lifting the card above the
         ground to mirror light costs too much: every muted tone here is tuned
         against this value, and --muted falls to 2.49 against the WCAG floor
         of 3 for secondary text. The hairline does the separating instead. */
      --card: #141519;
      --card-shadow: rgba(0, 0, 0, 0.55);
      --card-shadow-near: rgba(0, 0, 0, 0.4);
      /* the smoke passes lighter than the card in places, so the edge has to
         carry the separation where the fill cannot */
      --card-line: rgba(255, 255, 255, 0.10);
      --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fcfcfd;
        --surface: #f4f6f8;
        --surface2: #eef0f4;
        --surface3: #e3e7ec;
        --border: #e2e6ea;
        --border2: #cbd2da;
        --text: #191c21;
        --text-2: #454b54;
        --muted: #6f767f;
        --muted2: #a4aab3;
        --on-accent: #ffffff;
        --sheet-bg: #ffffff;
        --menu-bg: #ffffff;
        --flash: #e8f4e8;
        --hairline: rgba(0, 0, 0, 0.12);

        /* accents move darker and more saturated: what carries on near-black
           disappears on white */
        --prompt: #6a3fc0;
        --prompt-dim: #7d55cd;
        --prompt-line: #ddcef7;
        --prompt-line-2: #b295e6;
        --prompt-tint: #f5f0ff;
        --prompt-tint-2: #ece2fc;
        --prompt-strong: #7c5cbf;
        --prompt-wash: rgba(106, 63, 192, 0.09);

        --session: #157a4a;
        --session-line: #bfe0cd;
        --session-line-2: #45996e;
        --session-tint: #edf7f1;
        --session-tint-2: #e1f0e8;
        --session-wash: rgba(21, 122, 74, 0.07);

        --ocr: #14764c;
        --ocr-line: #bfe0d0;
        --ocr-strong: #2c8c61;
        --ocr-wash: rgba(20, 118, 76, 0.1);
        --ocr-wash-2: rgba(20, 118, 76, 0.22);

        --pinned: #8f6210;
        --pinned-dim: #a97719;
        --pinned-2: #86610f;
        --pinned-line: #ecdcb6;
        --pinned-line-2: #dbc697;
        --pinned-tint: #fdf6e6;
        --pinned-tint-2: #f7edd6;

        --select: #2c4ed4;
        --select-dim: #5a78e6;
        --select-wash: rgba(44, 78, 212, 0.09);
        --select-wash-2: rgba(44, 78, 212, 0.14);
        --select-wash-3: rgba(44, 78, 212, 0.24);

        --danger: #b03636;
        --danger-dim: #8d2c2c;
        --danger-line: #f0cfcf;

        --styled: #2a6791;
        --styled-line: #cadcea;
        --styled-tint: #eef5fa;

        --code: #3f3fc0;
        --code-tint: #eeeefc;
        --code-line: #d2d2f0;
        --url: #12784a;
        --url-line: #c5e3d2;

        --live: #157a4a;
        --live-bright: #0f6b3f;
        --live-dim: #62a184;

        --shadow: rgba(20, 24, 32, 0.14);
        --card: #ffffff;
        --card-shadow: rgba(18, 34, 62, 0.07);
        --card-shadow-near: rgba(18, 34, 62, 0.05);
        --card-line: rgba(18, 34, 62, 0.05);
      }
    }

    html, body {
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    /* The window is a fixed-width drawer that widens to the left when an image
       is being inspected. The shell holds both columns. */
    .shell { display: flex; height: 100vh; }
    /* The drawer is the panel plus the rail. The rail is navigation — every
       top-level place lives there, which is why the list has no section
       headers and the filters below only deal in types. */
    .app {
      display: flex;
      flex-direction: row;
      height: 100vh;
      width: 466px;
      flex-shrink: 0;
      order: 2;
    }
    .panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
      height: 100vh;
      /* the prompt editor and the OCR sheet dock against this */
      position: relative;
    }

    .rail {
      width: 78px;
      flex: none;
      border-left: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      padding: 10px 0 12px;
      gap: 2px;
      overflow-y: auto;
    }
    .rail::-webkit-scrollbar { width: 0; }
    .rail-item {
      background: none;
      border: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 9px 4px;
      margin: 0 7px;
      border-radius: 8px;
      position: relative;
      color: var(--muted2);
      transition: background 0.16s, color 0.16s;
    }
    .rail-item:hover { color: var(--text-2, var(--text-2)); background: var(--surface2); }
    .rail-item.on { color: var(--text); background: var(--bg); box-shadow: 0 0 0 1px var(--border); }
    .rail-item svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .rail-item .lbl {
      font-family: var(--font-mono);
      font-size: 8.5px;
      max-width: 62px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rail-item.prompts.on { color: var(--prompt); }
    .rail-item.pinned.on { color: var(--pinned); }
    .rail-item.session.on { color: var(--session); }
    /* the collection being collected into stays marked wherever you are */
    .rail-item .rec {
      position: absolute;
      top: 7px;
      right: 12px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--session);
      animation: recPulse 2.6s ease-in-out infinite;
    }
    @keyframes recPulse { 50% { opacity: 0.3; } }
    .rail-sep { height: 1px; background: var(--border); margin: 7px 16px; flex: none; }
    .rail-sep:last-child { display: none; }
    .rail-name {
      width: 60px;
      margin: 4px 9px;
      padding: 4px 5px;
      border-radius: 4px;
      background: var(--bg);
      border: 1px solid var(--session-line-2);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 9px;
      outline: none;
    }

    /* the scope header replaces every section label */
    .scopehead {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 18px 10px;
      flex-shrink: 0;
    }
    .scope-name {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .scope-count {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--muted2);
      flex: 1;
    }
    .scope-actions { display: flex; align-items: center; gap: 5px; }
    .scope-btn {
      font-family: var(--font-mono);
      font-size: 9px;
      padding: 3px 7px;
      border-radius: 3px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--muted);
      cursor: pointer;
    }
    .scope-btn:hover { color: var(--text); }
    .scope-btn.on { color: var(--on-accent); background: var(--session); border-color: var(--session); }
    .scope-btn.danger:hover { color: var(--danger); border-color: var(--danger-line); }

    /* ---------- image inspector ---------- */
    .inspector {
      display: none;
      order: 1;
      flex: 1;
      min-width: 0;
      flex-direction: column;
      height: 100vh;
    }
    .inspector.show { display: flex; }

    .insp-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px 10px;
      flex-shrink: 0;
    }
    .insp-title {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ocr);
    }
    .insp-hint { font-size: 10px; color: var(--muted); }

    /* the picture, with a clickable box over every block of text found */
    /* The regions are positioned as percentages, so their containing block has
       to be exactly the rendered image and nothing more. The stage is therefore
       a plain block the full width of the panel, with the image filling it —
       height follows the image, so the stage box and the picture coincide.
       (As a flex item the stage refused to shrink below the image's natural
       width, so the box was far wider than the picture and every region landed
       off to the side.) */
    .insp-canvas {
      flex: 1;
      min-height: 0;
      margin: 0 14px;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .insp-stage { position: relative; width: 100%; line-height: 0; }
    .insp-stage img { display: block; width: 100%; height: auto; border-radius: 4px; }

    .region {
      position: absolute;
      border: 1px solid var(--ocr);
      background: var(--ocr-wash);
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
    }
    .region:hover { background: var(--ocr-wash-2); border-color: var(--ocr); }
    .region.picked {
      background: var(--select-wash-3);
      border-color: var(--select-dim);
      box-shadow: 0 0 0 1px var(--select-wash-3);
    }

    /* ---------- extracted colours ----------
       The chrome here is deliberately neutral. An accent hue beside the
       swatches would shift how every one of them reads, and the whole point
       is showing the colours truthfully. */
    .insp-swatches {
      display: none;
      flex-shrink: 0;
      margin: 10px 14px 0;
      gap: 6px;
      grid-template-columns: repeat(2, 1fr);
      max-height: 232px;
      overflow-y: auto;
    }
    .inspector[data-mode="color"] .insp-swatches {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0;
      max-height: none;
      margin: 0;
    }
    /* the grid is the content in colour mode -- nothing to prompt for */
    .inspector[data-mode="color"] .out-slot { display: none; }
    .inspector[data-mode="color"] .insp-canvas { flex: 0 1 auto; max-height: 34vh; }
    .insp-swatches::-webkit-scrollbar { width: 3px; }
    .insp-swatches::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }



    /* ---------- preview & naming ----------
       Naming used to happen inside the row, underneath the hover actions that
       float over exactly that spot — you clicked name and the input appeared
       behind the buttons. It belongs here instead, beside a view of the thing
       being named, which is what you need in order to name it at all. */
    .detail-name {
      display: none;
      flex-shrink: 0;
      margin: 0 14px 10px;
      padding: 8px 10px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 5px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      outline: none;
    }
    .detail-name::placeholder { color: var(--muted); font-weight: 400; }
    .detail-name:focus { border-color: var(--session-line-2); }
    .inspector[data-mode="detail"] .detail-name { display: block; }

    /* the full text of a clip, rather than the two clamped lines a row shows */
    .detail-text {
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--text-2);
      padding: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
    }
    .inspector[data-mode="detail"] .detail-text.show { display: block; }

    /* text / colour — a switch, not an action. It sits under the name and stays
       there while you move between them, so the footer is free to belong to
       whichever one you are in. */
    .insp-modes {
      display: none;
      flex-shrink: 0;
      gap: 4px;
      margin: 0 14px 10px;
      padding: 3px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .insp-modes.show { display: flex; }
    .mode-btn {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: none;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.12s, background 0.12s, border-color 0.12s;
    }
    .mode-btn:hover { color: var(--text-2); }
    .mode-btn.is-on {
      background: var(--surface3);
      border-color: var(--border2);
      color: var(--text);
    }

    /* the facts only belong on the panel you opened to look at the clip */
    .detail-meta { display: none; }
    .inspector.show .detail-meta { display: block; }
    .meta-row { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
    .meta-key {
      width: 108px;
      flex: none;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }
    .meta-val {
      min-width: 0;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .out-empty { text-align: center; padding: 18px 10px; }
    .out-empty-mark {
      width: 74px;
      height: 74px;
      margin: 0 auto 16px;
      border-radius: 6px;
      background: var(--surface3);
    }
    .out-empty-title {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .out-empty-hint {
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted);
    }

    .mode-key { font-weight: 600; color: var(--text-2); display: flex; align-items: center; }
    .mode-key svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }

    /* nothing to act on until something has been picked out */
    .inspector[data-mode="detail"] .insp-out { display: none; }

    /* the name belongs to the clip, not to one view of it */
    .inspector[data-mode="text"] .detail-name,
    .inspector[data-mode="color"] .detail-name { display: block; }

    .insp-out {
      flex-shrink: 0;
      margin: 12px 14px 0;
      padding: 10px;
      min-height: 62px;
      max-height: 150px;
      overflow-y: auto;
      background: var(--surface2, var(--surface2));
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .insp-out.empty { color: var(--muted); font-family: var(--font-mono); font-size: 10px; }
    .insp-out::-webkit-scrollbar { width: 3px; }
    .insp-out::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }


    /* drag region lets the user move the window by the title bar */
    .titlebar {
      -webkit-app-region: drag;
      height: 38px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .title {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .close-btn {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
      transition: color 0.15s, background 0.15s;
    }
    .close-btn:hover { color: var(--text); background: var(--surface2); }

    /* The appearance switch belongs where people look for it. The tray menu
       still has the three-way choice; this cycles the same setting. */
    .theme-btn {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 3px;
      transition: color 0.15s, background 0.15s;
    }
    .theme-btn:hover { color: var(--text); background: var(--surface2); }

    .controls {
      padding: 14px 18px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .search-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input::placeholder { color: var(--muted2); }
    .search-input:focus { border-color: var(--border2); }

    .filters {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .pill {
      font-size: 10px;
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .pill:hover { color: var(--text); }
    .pill.active { background: var(--surface2); border-color: var(--border2); color: var(--text); }

    .list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    .list::-webkit-scrollbar { width: 3px; }
    .list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
    .list::-webkit-scrollbar-track { background: transparent; }

    .empty {
      padding: 80px 24px;
      text-align: center;
      color: var(--text-2, var(--text-2));
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.6;
      font-weight: 300;
    }
    /* why a picture is in the results for a word that is nowhere on its row */
    .in-image { color: var(--session); }
    /* where a clip came from, quiet enough not to compete with the clip */
    .from-app { color: var(--muted2); }
    .from-icon {
      width: 13px;
      height: 13px;
      display: inline-block;
      vertical-align: -2px;
      border-radius: 2px;
      /* an app's own colours are louder than anything else on the row, so they
         sit back until the row is under the cursor */
      opacity: 0.75;
      transition: opacity 0.12s;
    }
    .item:hover .from-icon { opacity: 1; }
    .ocr-hit {
      margin-top: 6px;
      padding: 5px 8px;
      border-left: 2px solid var(--session-line-2);
      background: var(--session-tint);
      border-radius: 0 4px 4px 0;
      color: var(--text-2);
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1.5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .list-more {
      display: block;
      width: calc(100% - 28px);
      margin: 6px 14px 14px;
      padding: 10px;
      background: transparent;
      border: 1px dashed var(--border2);
      border-radius: 8px;
      color: var(--muted2);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }
    .list-more:hover { color: var(--text-2); border-color: var(--border); }
    .empty .empty-sub {
      display: block;
      margin-top: 14px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted2);
      letter-spacing: 0.06em;
      line-height: 2;
    }
    .empty .hotkey {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 3px;
      padding: 1px 6px;
      font-size: 10px;
      margin: 0 2px;
      color: var(--text-2, var(--text-2));
    }

    .item {
      padding: 12px 18px 12px 14px;
      border-bottom: 1px solid var(--border);
      cursor: grab;
      transition: background 0.14s, transform 0.14s, border-color 0.14s;
      position: relative;
      display: flex;
      gap: 11px;
      align-items: stretch;
    }
    .item:hover {
      background: var(--surface2);
      transform: translateX(-1px);
    }
    .item.dragging { opacity: 0.4; cursor: grabbing; }
    .item.new { animation: pop 0.4s ease; }

    /* multi-select — accent rail on the left edge so a selected row reads as
       picked up without competing with the pinned section's warm tint */
    .item.selected { background: var(--select-wash); box-shadow: inset 2px 0 0 var(--select); }
    .item.selected:hover { background: var(--select-wash-2); }
    /* shift-clicking a range otherwise smears a text selection across rows */
    .item { user-select: none; }

    @keyframes pop {
      0% { background: var(--flash); }
      100% { background: transparent; }
    }

    /* drag handle — 6 dots, only visible on hover */
    .item .drag-handle {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      opacity: 0;
      transition: opacity 0.14s;
      flex-shrink: 0;
      align-self: center;
      width: 4px;
      margin-left: -8px;
    }
    .item:hover .drag-handle { opacity: 0.32; }
    .item .drag-handle .dot-row {
      display: flex;
      gap: 2px;
    }
    .item .drag-handle .dot-row span {
      width: 2px;
      height: 2px;
      background: currentColor;
      border-radius: 50%;
    }

    /* Where an order can be kept, the whole row is the handle: press and hold
       anywhere on it. The grip stays as the shortcut that lifts immediately,
       for anyone who goes looking for one. */
    /* The dots are 4px wide — fine to look at, hopeless to hit. The target is a
       full-height strip down the row's left edge, laid over the row rather than
       sitting in the layout, because widening the handle itself would push
       every row's content sideways. */
    .item.orderable .drag-handle { cursor: grab; opacity: 0.2; }
    .item.orderable .drag-handle::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 26px;
      border-radius: 6px 0 0 6px;
      transition: background 0.12s;
    }
    .item.orderable:hover .drag-handle { opacity: 0.45; }
    /* and it shows when the pointer is on it, so the moment it arms stops being
       a guess — the strip tints and the dots come up to full strength */
    .item.orderable .drag-handle:hover { opacity: 1; }
    .item.orderable .drag-handle:hover::before { background: var(--select-wash-2); }
    .item.orderable .drag-handle:active::before { background: var(--select-wash-3); }
    /* history rows sit in the same list but keep no order, so their grip stays
       the faint decoration it was rather than inviting a drag that won't hold */
    .item:not(.orderable) .drag-handle { cursor: default; }

    /* the press settles the row down a touch, so the hold is felt before the
       lift happens rather than looking like nothing responded */
    .item.arming {
      transform: scale(0.988);
      transition: transform 0.16s ease-out;
    }

    /* the row travelling with the pointer */
    .item.lifting {
      position: fixed;
      pointer-events: none;
      z-index: 30;
      cursor: grabbing;
      background: var(--surface);
      box-shadow: 0 14px 34px var(--shadow);
      border-radius: 8px;
      transform: scale(1.02);
      transition: transform 0.16s cubic-bezier(0.2, 0.9, 0.3, 1.2),
                  box-shadow 0.16s ease-out;
    }
    .item.lifting.landing {
      transform: scale(1);
      box-shadow: 0 2px 8px var(--shadow);
      transition: all 0.19s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* The row keeps its place in the list while it is being carried, emptied
       out and outlined. That hole IS the answer to "where will this land" — it
       travels with the drag and the other rows slide around it. */
    .item.slot > * { visibility: hidden; }
    .item.slot {
      background: var(--select-wash);
      /* outline rather than border: it must not change the row's height, or
         every other row would jump by two pixels the moment you picked it up */
      outline: 1px dashed var(--select-dim);
      outline-offset: -2px;
      border-radius: 6px;
    }
    /* rows sliding out of the way to open the gap */
    .item.shifting { transition: transform 0.19s cubic-bezier(0.2, 0.8, 0.2, 1); }

    .item-icon-col {
      flex-shrink: 0;
      align-self: flex-start;
      padding-top: 2px;
    }
    .type-badge {
      font-size: 9px;
      font-family: var(--font-mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 3px;
      display: inline-block;
      line-height: 1;
    }
    .type-badge.text { color: var(--muted); background: var(--surface2); border: 1px solid var(--surface3); }
    .type-badge.code { color: var(--code); background: var(--code-tint); border: 1px solid var(--code-line); }
    .type-badge.url  { color: var(--url); background: var(--session-tint); border: 1px solid var(--url-line); }
    .type-badge.img  { color: var(--pinned); background: var(--pinned-tint); border: 1px solid var(--pinned-line); }
    .type-badge.color { color: var(--pinned); background: var(--pinned-tint); border: 1px solid var(--pinned-line); }
    /* design assets read as their own thing rather than as the text they are
       made of, so they borrow the colour the drawer already uses for a clip
       that belongs somewhere */
    .type-badge.svg { color: var(--session); background: var(--session-tint); border: 1px solid var(--session-line); }
    .type-badge.figma { color: var(--session); background: var(--session-tint); border: 1px solid var(--session-line); }

    /* every picked block is a row of its own, with its own two actions */
    .out-blocks { display: none; flex-direction: column; gap: 10px; }
    .inspector[data-mode="text"] .out-blocks:not(:empty) { display: flex; }
    .out-block { display: flex; align-items: flex-start; gap: 12px; }
    .out-block-text {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 8px;
      background: var(--surface2);
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .out-block-acts { display: flex; gap: 4px; flex: none; padding-top: 8px; }
    .out-act {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 7px;
      background: none;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.12s, background 0.12s;
    }
    .out-act:hover { color: var(--text); background: var(--surface3); }
    .out-act svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* the prompt for what to do only stands while nothing is picked */
    .inspector[data-mode="text"] .out-blocks:not(:empty) ~ .out-slot { display: none; }

    /* the palette reads as a strip: the colour, its name, its value */
    .swatch {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding: 0 0 10px;
      border: 0;
      background: none;
      cursor: pointer;
      text-align: left;
      min-width: 0;
    }
    .swatch-chip {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 46px;
      border-radius: 0;
    }
    .swatch-cue {
      opacity: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 5px;
      background: var(--sheet-bg);
      color: var(--text);
      transition: opacity 0.12s;
    }
    .swatch-cue svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .swatch:hover .swatch-cue, .swatch:focus-visible .swatch-cue { opacity: 1; }
    .swatch-name {
      margin-top: 7px;
      padding: 0 4px;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      color: var(--text-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .swatch-hex {
      padding: 2px 4px 0;
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* a colour clip leads with the colour itself, then its value */
    .colour-line { display: flex; align-items: center; gap: 10px; }
    .colour-chip {
      width: 26px;
      height: 26px;
      flex: none;
      border-radius: 6px;
      border: 1px solid var(--hairline);
    }
    .colour-value {
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* main content column */
    .item-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* primary headline — first line of the clip, strongly weighted */
    .item-headline {
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--text);
      letter-spacing: -0.005em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* a name the user gave it — sits where the derived headline was */
    .item-headline.named { color: var(--text); }

    /* and what it displaced, kept underneath rather than thrown away */
    .item-derived {
      margin-top: 3px;
      opacity: 0.62;
      font-size: 12px;
    }
    .item-derived .item-headline { font-size: 12px; font-weight: 400; color: var(--text-2); }

    .item-headline.clamp-2 {
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      /* fade overflow at the bottom */
      mask-image: linear-gradient(to bottom, black 70%, var(--shadow) 100%);
    }

    /* code preview — monospace, tinted background, compact */
    .item-headline.code-preview {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 400;
      color: var(--text-2);
      background: var(--code-tint);
      padding: 6px 9px;
      border-radius: 4px;
      border: 1px solid var(--code-tint);
      white-space: pre;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 56px;
      mask-image: linear-gradient(to bottom, black 70%, var(--shadow) 100%);
    }

    /* meta row — type, time, source, etc. small monospace */
    .item-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .item-meta .domain {
      color: var(--url);
      letter-spacing: 0;
    }
    .item-meta .lang-tag {
      background: var(--surface2);
      color: var(--muted);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .item-meta .dot { color: var(--muted2); }
    /* a clip carrying formatting, so pasting it will not be plain */
    .styled-mark {
      color: var(--styled);
      border: 1px solid var(--styled-line);
      background: var(--styled-tint);
      border-radius: 2px;
      padding: 1px 4px;
      font-size: 8.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .item-meta .time { color: var(--muted2); }

    /* image preview — bigger, more prominent */
    .item-image {
      margin-top: 6px;
      /* .item-content is a column flex container, so the default stretch would
         force width to 100% while max-height clamps height independently —
         that distorts the image. flex-start keeps width intrinsic so the
         max-* pair scales it proportionally. */
      align-self: flex-start;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 140px;
      object-fit: contain;
      border-radius: 5px;
      display: block;
      border: 1px solid var(--border);
      transition: max-height 0.2s;
    }
    .item:hover .item-image { max-height: 180px; }

    /* The toolbar used to float over the row's top-right, which is where the
       headline and the name field live — it covered the very thing you were
       acting on. It sits under the content now.

       Its space is reserved whether or not it is showing. Revealing it by
       adding height would grow the row on hover and shove every row below it
       down, moving the list out from under the cursor that opened it. */
    .actions {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-top: 8px;
      padding: 3px;
      height: 30px;
      border-radius: 7px;
      background: var(--surface2);
      border: 1px solid var(--border);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s;
    }
    .item:hover .actions,
    .actions:focus-within { opacity: 1; pointer-events: auto; }

    .act-btn {
      flex: 1;
      height: 22px;
      display: grid;
      place-items: center;
      background: none;
      border: 0;
      border-radius: 5px;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      transition: color 0.12s, background 0.12s;
    }
    .act-btn svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .act-btn svg.filled { fill: currentColor; }
    .act-btn:hover { color: var(--text); background: var(--surface3); }
    .act-btn.on { color: var(--prompt); }
    .act-btn.pinned { color: var(--pinned); }
    .act-btn.danger:hover { color: var(--danger); background: var(--danger-line); }
    .act-btn:focus-visible { outline: 1px solid var(--select); outline-offset: -1px; }
    .act-btn {
      background: transparent;
      border: none;
      border-radius: 3px;
      color: var(--muted);
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 4px 8px;
      cursor: pointer;
      transition: color 0.12s, background 0.12s;
      letter-spacing: 0.04em;
    }
    .act-btn:hover { color: var(--text); background: var(--surface3, var(--surface3)); }
    .act-btn.danger:hover { color: var(--danger); }

    /* ---------- selection stack ----------
       Selecting clips gathers them into a physical little deck above the
       footer. The deck is the drag target, so "collect, then throw" is one
       continuous gesture rather than an abstract selection state. */
    .stack-tray {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 11px 14px 12px;
      border-top: 1px solid var(--border);
      background: linear-gradient(to top, var(--select-wash-2), var(--select-wash));
      flex-shrink: 0;
    }
    .stack-tray.show { display: flex; animation: trayIn 0.34s cubic-bezier(0.22, 1.2, 0.36, 1); }
    @keyframes trayIn {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .stack-deck {
      position: relative;
      /* wide enough that a 5-card deck stays inside its own footprint when
         the hover fan spreads it, instead of sliding under the label */
      width: 88px;
      height: 46px;
      flex-shrink: 0;
      cursor: grab;
    }
    .stack-deck:active { cursor: grabbing; }
    .stack-deck.delivered { animation: settle 0.5s cubic-bezier(0.22, 1.4, 0.36, 1); }
    @keyframes settle {
      0%   { transform: scale(0.86) rotate(-3deg); }
      55%  { transform: scale(1.06) rotate(1.5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .stack-card {
      position: absolute;
      top: 50%;
      left: 4px;
      width: 38px;
      height: 38px;
      margin-top: -19px;
      border-radius: 6px;
      border: 1px solid var(--hairline);
      background: var(--surface2, var(--surface2));
      box-shadow: 0 3px 8px var(--shadow);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      transform: translateX(var(--x, 0px)) rotate(var(--r, 0deg));
      transition: transform 0.28s cubic-bezier(0.22, 1.2, 0.36, 1), opacity 0.18s;
      cursor: pointer;
    }
    .stack-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* hover fans the deck out so you can see what you've gathered */
    .stack-deck:hover .stack-card {
      transform: translateX(calc(var(--x, 0px) * 1.4)) rotate(calc(var(--r, 0deg) * 1.5));
    }
    .stack-card.leaving { opacity: 0; transform: translateX(var(--x, 0px)) scale(0.5) rotate(12deg); }

    .stack-count {
      position: absolute;
      right: -5px;
      top: -7px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 9px;
      background: var(--select);
      color: var(--on-accent);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px var(--shadow);
      z-index: 5;
    }
    .stack-count.bump { animation: bump 0.34s cubic-bezier(0.22, 1.4, 0.36, 1); }
    @keyframes bump {
      0% { transform: scale(1); } 45% { transform: scale(1.38); } 100% { transform: scale(1); }
    }

    .stack-info { flex: 1; min-width: 0; line-height: 1.35; }
    .stack-title {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-2);
      display: block;
    }
    .stack-hint {
      font-size: 10px;
      color: var(--muted);
      display: block;
    }

    @media (prefers-reduced-motion: reduce) {
      .stack-tray.show, .stack-deck.delivered, .stack-count.bump { animation: none; }
      .stack-card { transition: none; }
    }

    .footer {
      padding: 10px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .footer-info {
      font-size: 10px;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .clear-btn {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: color 0.12s;
    }
    .clear-btn:hover { color: var(--danger); }

    .toast {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text-2);
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 6px 14px;
      border-radius: 3px;
      letter-spacing: 0.06em;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    .skip-pulse {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--live-dim);
      margin-right: 6px;
      vertical-align: middle;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .skip-pulse.on { opacity: 1; }

    /* pause toggle in titlebar */
    .pause-btn {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      cursor: pointer;
      padding: 3px 8px;
      border-radius: 3px;
      margin-right: 4px;
      transition: color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pause-btn:hover { color: var(--text); background: var(--surface2); }
    .pause-btn .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--live-dim);
      transition: background 0.2s;
    }
    .pause-btn.paused .dot { background: var(--pinned-2); }

    /* update badge — sits left of pause btn. While the new version downloads
       in the background it shows progress and does nothing when clicked;
       once it's ready it becomes the restart. */
    .update-badge {
      -webkit-app-region: no-drag;
      background: none;
      border: 1px solid var(--live-dim);
      color: var(--live);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      cursor: pointer;
      padding: 3px 7px;
      border-radius: 3px;
      margin-right: 6px;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .update-badge:hover {
      color: var(--live-bright);
      background: var(--session-wash);
      border-color: var(--live-dim);
    }
    /* still downloading: visible, but not something to click at */
    .update-badge:not(.ready) { cursor: default; opacity: 0.75; }
    .update-badge:not(.ready):hover { background: none; color: var(--live); }
    .update-badge .update-arrow {
      font-size: 11px;
      line-height: 1;
    }

    .titlebar-right {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
    }

    /* dim the list when paused */
    body.paused .list { opacity: 0.4; pointer-events: none; }
    body.paused .controls { opacity: 0.5; }
    .collection-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 10px 14px 0;
      padding: 10px 10px 10px 12px;
      background: var(--session-tint);
      border: 1px solid var(--session-line);
      border-radius: 8px;
      color: var(--text-2);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.04em;
    }
    .collection-banner.show { display: flex; }
    .collection-main {
      min-width: 0;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      column-gap: 10px;
    }
    .collection-capture-icon {
      width: 22px;
      height: 22px;
      display: inline-grid;
      place-items: center;
      color: var(--session);
    }
    .collection-capture-icon svg {
      width: 22px;
      height: 22px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      overflow: visible;
    }
    .collection-pot-body {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: collectionPotBody 4.8s ease-in-out infinite;
    }
    .collection-pot-lid {
      transform-box: fill-box;
      transform-origin: 80% 36%;
      animation: collectionPotLid 4.8s ease-in-out infinite;
    }
    @keyframes collectionPotBody {
      0%, 62%, 100% { transform: scale(1); }
      68% { transform: scale(1.035); }
      76% { transform: scale(1); }
    }
    @keyframes collectionPotLid {
      0%, 58%, 100% { transform: rotate(0deg); }
      64% { transform: rotate(-8deg); }
      70% { transform: rotate(7deg); }
      76% { transform: rotate(-4deg); }
      82% { transform: rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .collection-pot-body,
      .collection-pot-lid { animation: none; }
    }
    .collection-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .collection-line {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }
    .collection-label {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 9px;
      line-height: 1;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .collection-line b {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--session);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .collection-count {
      flex-shrink: 0;
      min-width: 18px;
      height: 18px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid var(--session-line-2);
      background: var(--bg);
      color: var(--session);
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0;
    }
    .collection-stop {
      -webkit-app-region: no-drag;
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 0;
      color: var(--session);
      padding: 0;
      border-radius: 3px;
      cursor: pointer;
      transition: color 0.12s, background 0.12s;
    }
    .collection-stop svg {
      width: 16px;
      height: 16px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .collection-stop:hover {
      color: var(--text);
      background: var(--session-line);
    }
    .paused-banner {
      display: none;
      padding: 8px 18px;
      background: var(--pinned-tint-2);
      border-bottom: 1px solid var(--pinned-line-2);
      color: var(--pinned-2);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-align: center;
    }
    body.paused .paused-banner { display: block; }

    /* promote-on-recopy: flash the item when bumped to top */
    .item.promoted { animation: promote 0.7s ease; }
    @keyframes promote {
      0%   { background: var(--pinned-line-2); }
      50%  { background: var(--pinned-tint); }
      100% { background: transparent; }
    }

    /* the row being edited stays visibly tied to the sheet below it */
    .item.editing {
      background: var(--prompt-wash);
      box-shadow: inset 0 0 0 1px var(--prompt-strong);
    }

    /* tag chips shown inline on a prompt row, so the library is scannable */
    .item-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
    .tag-chip {
      font-family: var(--font-mono);
      font-size: 9px;
      line-height: 1;
      padding: 3px 6px;
      border-radius: 3px;
      color: var(--prompt-dim);
      background: var(--prompt-tint);
      border: 1px solid var(--prompt-line);
      white-space: nowrap;
    }

    /* ---------- prompt editor sheet ---------- */
    .editor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      max-height: 62%;
      display: flex;
      flex-direction: column;
      background: var(--sheet-bg);
      border-top: 1px solid var(--prompt-line);
      box-shadow: 0 -12px 32px var(--shadow);
      transform: translateY(100%);
      transition: transform 0.26s cubic-bezier(0.22, 1.1, 0.36, 1);
    }
    .editor.show { transform: translateY(0); }

    .editor-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px 8px;
      flex-shrink: 0;
    }
    .editor-title {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--prompt-dim);
    }
    .editor-saved {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--muted2);
      opacity: 0;
      transition: opacity 0.18s;
    }
    .editor-saved.show { opacity: 1; }

    .editor-body {
      margin: 0 14px;
      padding: 10px;
      min-height: 78px;
      max-height: 190px;
      resize: none;
      overflow-y: auto;
      background: var(--surface2, var(--surface2));
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11.5px;
      line-height: 1.5;
      outline: none;
    }
    .editor-body:focus { border-color: var(--prompt-line-2); }

    .editor-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      padding: 10px 14px 12px;
      flex-shrink: 0;
    }
    .editor-tags .tag-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; padding: 4px 7px; }
    .editor-tags .tag-x { cursor: pointer; color: var(--muted); }
    .editor-tags .tag-x:hover { color: var(--danger-dim); }

    .tag-add {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 3px;
      background: var(--surface2, var(--surface2));
      border: 1px dashed var(--border2);
      color: var(--muted);
      cursor: pointer;
    }
    .tag-add:hover { color: var(--prompt-dim); border-color: var(--prompt-line-2); }
    .tag-input {
      width: 104px;
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 4px 7px;
      border-radius: 3px;
      background: var(--surface2, var(--surface2));
      border: 1px solid var(--prompt-line-2);
      color: var(--text);
      outline: none;
    }
    .type-badge.session { color: var(--session); background: var(--session-tint); border: 1px solid var(--session-line); }
    .session-btn-row.on { color: var(--session); }
    .session-actions {
      display: flex;
      gap: 6px;
      margin-left: auto;
      margin-right: 10px;
    }
    .session-actions button {
      background: none; border: 0; padding: 0 2px;
      font-family: var(--font-mono); font-size: 9px;
      color: var(--muted2); cursor: pointer; text-transform: none; letter-spacing: 0;
    }
    .session-actions button:hover { color: var(--session); }
    .session-actions button.danger:hover { color: var(--danger); }

    /* Tag filtering lives inside the prompts section — tags belong to prompts,
       so they must not sit at the same level as the type filters above. */
    .tag-filter { position: relative; margin-left: auto; margin-right: 10px; }
    .tag-filter-btn {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: none;
      padding: 3px 7px;
      border-radius: 3px;
      background: var(--surface2, var(--surface2));
      border: 1px solid var(--border2);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tag-filter-btn:hover { color: var(--prompt-dim); border-color: var(--prompt-line-2); }
    .tag-filter-btn.on { color: var(--on-accent); background: var(--prompt-dim); border-color: var(--prompt-dim); }
    .tag-filter-btn .caret { font-size: 7px; opacity: 0.7; }

    .tag-menu {
      position: absolute;
      right: 0;
      top: 130%;
      z-index: 30;
      min-width: 128px;
      max-height: 190px;
      overflow-y: auto;
      padding: 4px;
      background: var(--menu-bg);
      border: 1px solid var(--prompt-line);
      border-radius: 5px;
      box-shadow: 0 8px 22px var(--shadow);
      display: none;
    }
    .tag-menu.show { display: block; }
    .tag-menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-radius: 3px;
      padding: 5px 7px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-2, var(--text-2));
      cursor: pointer;
      text-transform: none;
      letter-spacing: 0;
    }
    .tag-menu button:hover { background: var(--prompt-tint-2); color: var(--prompt); }
    .tag-menu button.on { color: var(--prompt); }
    .tag-menu .menu-sep { height: 1px; background: var(--border); margin: 4px 2px; }

    /* ---------- extracted text sheet ---------- */
    .ocr-sheet { border-top-color: var(--ocr-line); }
    .ocr-sheet .editor-title { color: var(--ocr); }
    .ocr-list {
      margin: 0 14px 12px;
      overflow-y: auto;
      max-height: 260px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ocr-list::-webkit-scrollbar { width: 3px; }
    .ocr-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
    .ocr-list::-webkit-scrollbar-track { background: transparent; }
    .ocr-empty { padding: 18px 4px; font-size: 11px; color: var(--muted); text-align: center; }
    .ocr-status {
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
    }
    .ocr-bar {
      height: 2px;
      margin-top: 8px;
      background: var(--border);
      border-radius: 1px;
      overflow: hidden;
    }
    .ocr-bar span { display: block; height: 100%; width: 0; background: var(--ocr-strong); transition: width 0.2s; }

    /* picker that opens from "+ tag" — existing tags to choose, or type a new one */
    .tag-picker {
      position: absolute;
      left: 14px;
      bottom: 44px;
      z-index: 30;
      width: 176px;
      padding: 6px;
      background: var(--menu-bg);
      border: 1px solid var(--prompt-line);
      border-radius: 5px;
      box-shadow: 0 8px 22px var(--shadow);
      display: none;
    }
    .tag-picker.show { display: block; }
    .tag-picker .tag-input { width: 100%; box-sizing: border-box; margin-bottom: 5px; }
    .tag-suggestions { max-height: 132px; overflow-y: auto; }
    .tag-suggestions button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-radius: 3px;
      padding: 5px 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-2, var(--text-2));
      cursor: pointer;
    }
    .tag-suggestions button:hover, .tag-suggestions button.active { background: var(--prompt-tint-2); color: var(--prompt); }
    .tag-suggestions .none { padding: 5px 6px; font-family: var(--font-mono); font-size: 9px; color: var(--muted2); }
    .ses-menu {
      display: none;
      position: fixed;
      z-index: 60;
      min-width: 168px;
      max-width: 240px;
      padding: 5px;
      background: var(--menu-bg);
      border: 1px solid var(--border2);
      border-radius: 7px;
      box-shadow: 0 10px 26px var(--shadow);
    }
    .ses-menu.show { display: block; }
    .ses-menu-head {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 4px 7px 6px;
    }
    .ses-menu-list { max-height: 220px; overflow-y: auto; }
    .ses-menu-list button {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-radius: 4px;
      padding: 6px 7px;
      font-size: 11.5px;
      color: var(--text-2);
      cursor: pointer;
    }
    .ses-menu-list button:hover { background: var(--session-tint-2); color: var(--text); }
    .ses-menu-list button .tick {
      width: 12px;
      flex-shrink: 0;
      color: var(--session);
      font-size: 11px;
      line-height: 1;
    }
    .ses-menu-list button.on { color: var(--session); }
    .ses-menu-list .none {
      padding: 6px 7px;
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--muted2);
    }
    .act-btn.in-session { color: var(--session); }

    .type-badge.prompt {
      color: var(--prompt);
      background: var(--prompt-tint);
      border: 1px solid var(--prompt-line);
    }

    /* ---------------------------------------------------------------------
       The card shell.

       One structure for both themes: a shader background container with the
       panel broken into cards floating on it. Only the palette differs, and
       it differs through tokens, so nothing here is written twice.

       This used to live inside a light-only media query, with .card set to
       display:contents everywhere else so dark kept a single flat surface.
       --------------------------------------------------------------------- */
    .shader-bg {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 0;
      /* the flat fill shows through if WebGL is unavailable */
      background: var(--bg);
    }
    .shader-bg canvas { display: block; width: 100%; height: 100%; }

    body { background: transparent; }
    .shell { position: relative; z-index: 1; background: transparent; }
    .app { background: transparent; }

    .panel {
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px 0 16px 16px;
      height: 100vh;
      box-sizing: border-box;
    }

    .card {
      display: block;
      background: var(--card);
      border: 1px solid var(--card-line);
      border-radius: 12px;
      box-shadow: 0 1px 2px var(--card-shadow-near), 0 10px 28px var(--card-shadow);
      flex: none;
      overflow: hidden;
      box-sizing: border-box;
    }
    /* only the list may grow, and it must be allowed to shrink or the
       cards below it get pushed off the bottom of the drawer */
    .card-list {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .card-list .list { flex: 1 1 auto; min-height: 0; overflow-x: hidden; }

    /* the cards do the separating now, so the internal rules come off */
    .titlebar,
    .controls { border-bottom: 0; }
    /* the card edge already gives the search field room to breathe */
    .controls { padding-top: 8px; }
    .footer { border-top: 0; }

    .card-filters .filters { margin-top: 0; padding: 12px 14px; }
    /* Six pills across 340 leaves no slack: the hairline on the card took two
       pixels and "color" fell to a second row. A pixel off each pill buys
       twelve back and keeps the row aligned with the other cards. */
    .card-filters .pill { padding: 4px 9px; }
    .search-input { border-radius: 9px; padding: 9px 12px; }
    .pill { background: var(--card); }
    .pill.active {
      background: var(--text);
      border-color: var(--text);
      color: var(--on-accent);
    }

    .railwrap {
      /* The column has to be declared here. It used to come from a dark-only
         rule that the shell replaced, and without it the two cards stacked as
         blocks with the gap silently ignored -- they sat flush against each
         other and read as one card with a line through it. */
      display: flex;
      flex-direction: column;
      flex: none;
      border-left: 0;
      background: transparent;
      width: auto;
      /* the places card and the collections card are two separate things, and
         read as such at 16 where 12 had them looking like one split in half */
      gap: 16px;
      padding: 16px;
      box-sizing: border-box;
    }
    /* .card sets display:block, which would kill the rail's flex column and
       leave the buttons at their intrinsic widths -- form controls do not
       stretch to fill the way a div does, so each item would size to its own
       label. Restate the column here so every item is the same width. */
    .railwrap .rail {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      /* .card cannot reach these: the base .railwrap .rail rule that strips
         the dark-mode background outranks it, so the fill is restated here
         or the rail cards read as translucent against the shader */
      background: var(--card);
      width: 78px;
      padding: 8px 0;
      gap: 6px;
      overflow: visible;
    }
    .railwrap #rail { flex: none; }
    .railwrap #railSessions { flex: 0 1 auto; min-height: 0; overflow-y: auto; padding-top: 8px; }

    .railwrap .rail-item {
      margin: 0 8px;
      padding: 11px 4px;
      gap: 7px;
      border-radius: 10px;
    }
    .railwrap .rail-item svg { width: 16px; height: 16px; }
    .railwrap .rail-item .lbl { font-size: 10px; }

    /* the accent belongs to the place, not to whether it is selected */
    .railwrap .rail-item.prompts svg { stroke: var(--prompt); fill: var(--prompt); }
    .railwrap .rail-item.pinned svg { stroke: var(--pinned); fill: var(--pinned); }

    /* the multi-select tray was a tinted bar wedged above the footer; it is
       a card like everything else now */
    .stack-tray {
      border-top: 0;
      background: var(--card);
      border: 1px solid var(--card-line);
      border-radius: 12px;
      box-sizing: border-box;
      box-shadow: 0 1px 2px var(--card-shadow-near), 0 10px 28px var(--card-shadow);
      padding: 14px 16px;
      gap: 14px;
    }
    .stack-title { font-size: 13px; color: var(--text); }
    .stack-hint { font-size: 11px; }
    .stack-count {
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      font-size: 11px;
      right: -7px;
      top: -8px;
    }
    .stack-close {
      font-size: 17px;
      line-height: 1;
      padding: 2px 4px;
    }

    /* the inspector is two cards on the shader: the clip, then what can be
       pulled out of it. The design leads with the name, so the title bar
       that used to sit above it comes off -- Esc still closes the panel. */
    .inspector {
      background: transparent;
      border-right: 0;
      padding: 16px 0 16px 16px;
      gap: 8px;
      box-sizing: border-box;
    }
    /* The design leads with the name and carries no header, so this was
       hidden -- which left Esc as the only way out of a panel you opened by
       clicking. The header comes back as a bare close, without the status
       line it used to hold. */
    .insp-head {
      display: flex;
      justify-content: flex-end;
      padding: 10px 10px 0;
    }
    .insp-title,
    .insp-hint { display: none; }
    .insp-head .close-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 8px;
      font-size: 16px;
    }
    /* the name no longer needs to clear the top of the card on its own */
    .insp-head + .detail-name { margin-top: 6px; }
    .insp-card {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      background: var(--card);
      border: 1px solid var(--card-line);
      box-sizing: border-box;
      border-radius: 12px;
      box-shadow: 0 1px 2px var(--card-shadow-near), 0 10px 28px var(--card-shadow);
      overflow: hidden;
      padding-bottom: 14px;
    }
    .detail-name {
      margin: 14px 14px 12px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
    }
    .detail-meta { margin: 14px 14px 0; }
    .meta-row { padding: 8px 0; }
    .meta-key { width: 116px; font-size: 12px; }
    .meta-val { font-size: 12px; }

    /* Looking at a clip, the card ends where the facts end. Only the
       extraction views need the picture to stretch and scroll. */
    .inspector[data-mode="detail"] .insp-card { flex: 0 1 auto; }
    .inspector[data-mode="detail"] .insp-canvas { flex: 0 1 auto; }

    .insp-modes {
      margin: 0;
      flex: none;
      padding: 10px;
      gap: 10px;
      border: 1px solid var(--card-line);
      box-sizing: border-box;
      border-radius: 12px;
      background: var(--card);
      box-shadow: 0 1px 2px var(--card-shadow-near), 0 10px 28px var(--card-shadow);
    }
    .mode-btn {
      padding: 16px 10px;
      border-radius: 10px;
      font-size: 13px;
      text-transform: none;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }
    /* the chosen side reads like a chosen place on the rail */
    .mode-btn.is-on {
      background: var(--select-wash-2);
      border-color: transparent;
      color: var(--select);
    }
    .mode-btn.is-on .mode-key { color: var(--select); }

    .insp-out {
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      margin: 0;
      padding: 16px;
      border: 1px solid var(--card-line);
      box-sizing: border-box;
      border-radius: 12px;
      background: var(--card);
      box-shadow: 0 1px 2px var(--card-shadow-near), 0 10px 28px var(--card-shadow);
      font-size: 13px;
    }
    .insp-out.empty { display: flex; align-items: center; justify-content: center; }
    .insp-out { overflow-y: auto; }

    /* icons alone -- the tooltip carries the word */

    /* selected place: a blue tint, not the tan that means "pinned" */
    .rail-item.on {
      background: var(--select-wash-2);
      box-shadow: none;
      color: var(--select);
    }
    
  </style>
</head>
<body>
  <!-- background container: the Paper shader. Everything else stacks above. -->
  <div class="shader-bg" id="shaderBg"></div>
  <div class="shell">
  <div class="inspector" id="inspector" data-mode="text">
    <div class="insp-card">
    <div class="insp-head">
      <span class="insp-title" id="inspTitle">select text from image</span>
      <span class="insp-hint" id="inspHint">tap the highlighted areas</span>
      <button class="close-btn" id="inspClose" title="close (Esc)">×</button>
    </div>
    <input class="detail-name" id="inspName" type="text" spellcheck="false"
           placeholder="name this clip" maxlength="120" />
    <div class="insp-canvas">
      <div class="insp-stage" id="inspStage"></div>
      <div class="detail-text" id="inspDetailText"></div>
    </div>
    <!-- what the clip is, set out beneath the picture of it -->
    <div class="detail-meta" id="inspMeta"></div>
    </div><!-- /insp-card -->

    <!-- What you can pull out of this picture. A switch rather than an action,
         so it stays put when you move between the two. -->
    <div class="insp-modes" id="inspModes">
      <button class="mode-btn" id="detailText"><span class="mode-key" id="modeKeyText"></span>Text</button>
      <button class="mode-btn" id="detailColor"><span class="mode-key" id="modeKeyColor"></span>Color</button>
    </div>

    <!-- what you have picked out so far, and the two things worth doing with it -->
    <div class="insp-out empty" id="inspOut">
      <div class="insp-swatches" id="inspSwatches"></div>
      <div class="out-blocks" id="inspBlocks"></div>
      <div class="out-slot" id="inspEmpty"></div>
    </div>

  </div>

  <div class="app">
  <div class="panel">
    <div class="card card-head">
    <div class="titlebar">
      <span class="title">stash</span>
      <div class="titlebar-right">
        <button class="update-badge" id="updateBadge" title="" style="display:none">
          <span class="update-arrow">↑</span>
          <span id="updateLabel"></span>
        </button>
        <button class="pause-btn" id="pauseBtn" title="pause clipboard capture">
          <span class="dot"></span>
          <span id="pauseLabel">live</span>
        </button>
        <button class="theme-btn" id="themeBtn" title="appearance"></button>
        <button class="close-btn" id="closeBtn" title="hide (⌘⇧V)">×</button>
      </div>
    </div>

    <div class="paused-banner">clipboard capture paused</div>
    <div class="collection-banner" id="collectionBanner">
      <span class="collection-main">
        <span class="collection-capture-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <g class="collection-pot-body">
              <path d="M2 12h20"></path>
              <path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"></path>
            </g>
            <g class="collection-pot-lid">
              <path d="m4 8 16-4"></path>
              <path d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8"></path>
            </g>
          </svg>
        </span>
        <span class="collection-copy">
          <span class="collection-label">Collecting into</span>
          <span class="collection-line"><b id="collectionBannerName"></b><span class="collection-count" id="collectionBannerCount">0</span></span>
        </span>
      </span>
      <button class="collection-stop" id="collectionStopBtn" type="button" aria-label="Stop collecting" title="stop collecting">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6.5" y="6.5" width="11" height="11" rx="2"></rect>
          <rect x="10" y="10" width="4" height="4" rx="0.8" fill="currentColor" stroke="none"></rect>
        </svg>
      </button>
    </div>

    <div class="controls">
      <input class="search-input" id="search" placeholder="search clipboard..." />
    </div>

    <div class="scopehead">
      <span class="scope-name" id="scopeName">everything</span>
      <span class="scope-count" id="scopeCount"></span>
      <span class="scope-actions" id="scopeActions"></span>
    </div>
    </div><!-- /card-head -->

    <!-- only types live here now; prompts and pinned are places on the rail -->
    <div class="card card-filters">
      <div class="filters">
        <button class="pill active" data-type="all">all</button>
        <button class="pill" data-type="text">text</button>
        <button class="pill" data-type="code">code</button>
        <button class="pill" data-type="url">url</button>
        <button class="pill" data-type="img">image</button>
        <button class="pill" data-type="color">color</button>
      </div>
    </div>

    <div class="card card-list">
    <div class="list" id="list">
      <div class="empty">
        Stash quietly remembers while you work.
        <span class="empty-sub">copy anything to begin · <span class="hotkey">⌘</span><span class="hotkey">⇧</span><span class="hotkey">V</span> to toggle</span>
      </div>
    </div>
    </div><!-- /card-list -->

    <div class="editor" id="editor">
      <div class="editor-head">
        <span class="editor-title">edit prompt</span>
        <span class="editor-saved" id="editorSaved">saved</span>
        <button class="close-btn" id="editorClose" title="close (Esc)">×</button>
      </div>
      <textarea class="editor-body" id="editorBody" spellcheck="false"></textarea>
      <div class="editor-tags" id="editorTags"></div>
      <div class="tag-picker" id="tagPicker">
        <input class="tag-input" id="tagPickerInput" placeholder="type a new tag" maxlength="24" />
        <div class="tag-suggestions" id="tagSuggestions"></div>
      </div>
    </div>

    <!-- Which collections hold this clip. Anchored to the button that opened it but
       kept outside the row list, which is rebuilt from scratch on a timer. -->
  <div class="ses-menu" id="sesMenu">
    <div class="ses-menu-head" id="sesMenuHead">add to a collection</div>
    <div class="ses-menu-list" id="sesMenuList"></div>
  </div>

  <div class="editor ocr-sheet" id="ocrSheet">
      <div class="editor-head">
        <span class="editor-title">extracted text</span>
        <span class="editor-saved" id="ocrCount"></span>
        <button class="close-btn" id="ocrClose" title="close (Esc)">×</button>
      </div>
      <div class="ocr-list" id="ocrList"></div>
    </div>

    <div class="stack-tray" id="stackTray">
      <div class="stack-deck" id="stackDeck" draggable="true" title="drag the stack anywhere">
        <span class="stack-count" id="stackCount">0</span>
      </div>
      <span class="stack-info">
        <span class="stack-title" id="stackTitle">0 stacked</span>
        <span class="stack-hint">drag it anywhere</span>
      </span>
      <button class="clear-btn stack-close" id="selClearBtn" title="deselect">×</button>
    </div>

    <div class="card card-foot">
    <div class="footer">
      <span class="footer-info"><span class="skip-pulse" id="skipPulse" title="a secret-looking item was skipped"></span><span id="footerInfo">0 items</span></span>
      <button class="clear-btn" id="clearBtn">clear all</button>
    </div>
    </div><!-- /card-foot -->
  </div>

  <!-- every top-level place: everything, prompts, pinned, each collection, and new -->
  <div class="railwrap">
    <nav class="rail card card-rail" id="rail" aria-label="places"></nav>
    <nav class="rail card card-sessions" id="railSessions" aria-label="collections"></nav>
  </div>
  </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="vendor/paper-shaders.js"></script>
  <script src="shader-bg.js"></script>
  <script>
    // The shader is the shell's background container in both themes. Only
    // its two colours change between them, so a theme switch costs a uniform
    // upload rather than a fresh WebGL context.
    (function () {
      const host = document.getElementById('shaderBg');
      const light = window.matchMedia('(prefers-color-scheme: light)');
      function sync() {
        if (!window.StashShader) return;
        window.StashShader.setTheme(light.matches);
        // mounting waits on the shader's noise texture, so this is async
        Promise.resolve(window.StashShader.init(host)).then(() => {
          window.StashShader.setTheme(light.matches);
          window.StashShader.resume();
        });
      }
      light.addEventListener('change', sync);
      sync();
    })();
  </script>

  <script>
    let history = [];
    let pinned = [];
    let activeFilter = 'all';
    // which place the rail has selected: all | prompts | pinned | a collection id
    let activeScope = 'all';
    let searchQuery = '';
    // History is thousands of clips deep now, and a row is not cheap: building
    // every one of them turns opening the drawer into a freeze. So the list
    // renders a screenful at a time and grows as you reach the bottom. Search
    // is the way to the old stuff; scrolling is only the way to the near past.
    const RENDER_PAGE = 150;
    let renderLimit = RENDER_PAGE;
    // What the last render was showing. Changing place, search, filter or tag
    // is a new list, and a new list starts at the top again.
    let renderKey = '';
    // Section collapse state — in-memory only, resets on app restart

    // Multi-select state. `selected` holds clip ids; `renderedOrder` is the
    // flat top-to-bottom order of what's currently on screen, which is what
    // shift-click ranges are measured against (pinned rows come first, and a
    // filter or search can hide anything in between).
    const selected = new Set();
    let renderedOrder = [];
    let anchorId = null;

    const listEl = document.getElementById('list');
    // Reaching the bottom is the same request as pressing "show more", so it
    // does not need pressing. Guarded on there being more to show, or every
    // scroll to the end of a short list would re-render for nothing.
    listEl.addEventListener('scroll', () => {
      // A list with no height cannot be near its own bottom, but the arithmetic
      // below says it is -- and growing a hidden list would just keep growing.
      if (!listEl.clientHeight) return;
      if (listEl.scrollTop + listEl.clientHeight < listEl.scrollHeight - 400) return;
      if (!listEl.querySelector('.list-more')) return;
      renderLimit += RENDER_PAGE;
      render();
    });
    const footerEl = document.getElementById('footerInfo');
    const searchEl = document.getElementById('search');
    const toastEl = document.getElementById('toast');
    // collections — named folders that fill themselves while active
    let sessions = [];
    let sessionClips = [];
    // app icons, keyed by the name shown on a row, sent whole from main
    let sourceIcons = {};
    let activeSessionId = null;
    const collectionBannerEl = document.getElementById('collectionBanner');
    const collectionBannerNameEl = document.getElementById('collectionBannerName');
    const collectionBannerCountEl = document.getElementById('collectionBannerCount');
    const collectionStopBtn = document.getElementById('collectionStopBtn');

    // tag chosen in the prompts-section dropdown; narrows prompts only
    let activeTag = null;
    // prompt editor state — the id of the prompt whose sheet is open
    let editingId = null;
    // Which clip the preview panel is showing. Naming happens there, beside a
    // view of the thing, rather than in the row underneath the hover actions.
    let detailId = null;
    let editorSaveTimer = null;
    const editorEl = document.getElementById('editor');
    const editorBodyEl = document.getElementById('editorBody');
    const editorTagsEl = document.getElementById('editorTags');
    const editorSavedEl = document.getElementById('editorSaved');
    const tagPickerEl = document.getElementById('tagPicker');
    const tagPickerInputEl = document.getElementById('tagPickerInput');
    const tagSuggestionsEl = document.getElementById('tagSuggestions');

    const stackTrayEl = document.getElementById('stackTray');
    const stackDeckEl = document.getElementById('stackDeck');
