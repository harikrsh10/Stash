<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Stash</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Dark is the default and the design the app was built around; light is a
       full second palette rather than an inversion, because the accents that
       read well on near-black are washed out on white. Which one applies is
       decided by the OS, or by the appearance setting, which drives Electron's
       themeSource and therefore prefers-color-scheme. */
    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --surface2: #1a1a1a;
      --surface3: #2a2a2a;
      --border: #222;
      --border2: #2f2f2f;
      --text: #e8e8e8;
      --text-2: #b8b8b8;
      --muted: #666;
      --muted2: #444;
      --on-accent: #0b0b0b;
      --sheet-bg: #131017;
      --menu-bg: #141018;
      --flash: #1e2a1e;
      --hairline: rgba(255, 255, 255, 0.16);

      --prompt: #c9a4ff;
      --prompt-dim: #b9a2e8;
      --prompt-line: #33234d;
      --prompt-line-2: #4d3a75;
      --prompt-tint: #1a1226;
      --prompt-tint-2: #1e1728;
      --prompt-strong: #7c5cbf;
      --prompt-wash: rgba(186, 148, 255, 0.1);

      --session: #79c48f;
      --session-line: #1f3d29;
      --session-line-2: #3f7d5c;
      --session-tint: #0f1f14;
      --session-tint-2: #16201a;
      --session-wash: rgba(121, 196, 143, 0.06);

      --ocr: #8fd0a8;
      --ocr-line: #2a4a3a;
      --ocr-strong: #4e9e73;
      --ocr-wash: rgba(143, 208, 168, 0.1);
      --ocr-wash-2: rgba(143, 208, 168, 0.22);

      --pinned: #d4a06a;
      --pinned-dim: #ecb57d;
      --pinned-2: #c49a3a;
      --pinned-line: #3a2510;
      --pinned-line-2: #2a1f08;
      --pinned-tint: #1f160a;
      --pinned-tint-2: #1a1508;

      --select: #6d8cff;
      --select-dim: #8aa4ff;
      --select-wash: rgba(109, 140, 255, 0.08);
      --select-wash-2: rgba(109, 140, 255, 0.13);
      --select-wash-3: rgba(109, 140, 255, 0.28);

      --danger: #c46a6a;
      --danger-dim: #d98a8a;
      --danger-line: #4a2a2a;

      --styled: #8fb4d8;
      --styled-line: #24384a;
      --styled-tint: #101a22;

      --code: #a0a0ff;
      --code-tint: #161625;
      --code-line: #2a2a44;
      --url: #6dbf8c;
      --url-line: #1a3322;

      --live: #8fbf8f;
      --live-bright: #b8d9b8;
      --live-dim: #5a8a5a;

      --shadow: rgba(0, 0, 0, 0.55);
      --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fcfcfd;
        --surface: #f4f6f8;
        --surface2: #eef0f4;
        --surface3: #e3e7ec;
        --border: #e2e6ea;
        --border2: #cbd2da;
        --text: #191c21;
        --text-2: #454b54;
        --muted: #6f767f;
        --muted2: #a4aab3;
        --on-accent: #ffffff;
        --sheet-bg: #ffffff;
        --menu-bg: #ffffff;
        --flash: #e8f4e8;
        --hairline: rgba(0, 0, 0, 0.12);

        /* accents move darker and more saturated: what carries on near-black
           disappears on white */
        --prompt: #6a3fc0;
        --prompt-dim: #7d55cd;
        --prompt-line: #ddcef7;
        --prompt-line-2: #b295e6;
        --prompt-tint: #f5f0ff;
        --prompt-tint-2: #ece2fc;
        --prompt-strong: #7c5cbf;
        --prompt-wash: rgba(106, 63, 192, 0.09);

        --session: #157a4a;
        --session-line: #bfe0cd;
        --session-line-2: #45996e;
        --session-tint: #edf7f1;
        --session-tint-2: #e1f0e8;
        --session-wash: rgba(21, 122, 74, 0.07);

        --ocr: #14764c;
        --ocr-line: #bfe0d0;
        --ocr-strong: #2c8c61;
        --ocr-wash: rgba(20, 118, 76, 0.1);
        --ocr-wash-2: rgba(20, 118, 76, 0.22);

        --pinned: #8f6210;
        --pinned-dim: #a97719;
        --pinned-2: #86610f;
        --pinned-line: #ecdcb6;
        --pinned-line-2: #dbc697;
        --pinned-tint: #fdf6e6;
        --pinned-tint-2: #f7edd6;

        --select: #2c4ed4;
        --select-dim: #5a78e6;
        --select-wash: rgba(44, 78, 212, 0.09);
        --select-wash-2: rgba(44, 78, 212, 0.14);
        --select-wash-3: rgba(44, 78, 212, 0.24);

        --danger: #b03636;
        --danger-dim: #8d2c2c;
        --danger-line: #f0cfcf;

        --styled: #2a6791;
        --styled-line: #cadcea;
        --styled-tint: #eef5fa;

        --code: #3f3fc0;
        --code-tint: #eeeefc;
        --code-line: #d2d2f0;
        --url: #12784a;
        --url-line: #c5e3d2;

        --live: #157a4a;
        --live-bright: #0f6b3f;
        --live-dim: #62a184;

        --shadow: rgba(20, 24, 32, 0.14);
      }
    }

    html, body {
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    /* The window is a fixed-width drawer that widens to the left when an image
       is being inspected. The shell holds both columns. */
    .shell { display: flex; height: 100vh; }
    /* The drawer is the panel plus the rail. The rail is navigation — every
       top-level place lives there, which is why the list has no section
       headers and the filters below only deal in types. */
    .app {
      display: flex;
      flex-direction: row;
      height: 100vh;
      width: 418px;
      flex-shrink: 0;
      order: 2;
    }
    .panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
      height: 100vh;
      /* the prompt editor and the OCR sheet dock against this */
      position: relative;
    }

    .rail {
      width: 78px;
      flex: none;
      border-left: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      padding: 10px 0 12px;
      gap: 2px;
      overflow-y: auto;
    }
    .rail::-webkit-scrollbar { width: 0; }
    .rail-item {
      background: none;
      border: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 9px 4px;
      margin: 0 7px;
      border-radius: 8px;
      position: relative;
      color: var(--muted2);
      transition: background 0.16s, color 0.16s;
    }
    .rail-item:hover { color: var(--text-2, var(--text-2)); background: var(--surface2); }
    .rail-item.on { color: var(--text); background: var(--bg); box-shadow: 0 0 0 1px var(--border); }
    .rail-item svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .rail-item .lbl {
      font-family: var(--font-mono);
      font-size: 8.5px;
      max-width: 62px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rail-item.prompts.on { color: var(--prompt); }
    .rail-item.pinned.on { color: var(--pinned); }
    .rail-item.session.on { color: var(--session); }
    /* the session being collected into stays marked wherever you are */
    .rail-item .rec {
      position: absolute;
      top: 7px;
      right: 12px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--session);
      animation: recPulse 2.6s ease-in-out infinite;
    }
    @keyframes recPulse { 50% { opacity: 0.3; } }
    .rail-sep { height: 1px; background: var(--border); margin: 7px 16px; flex: none; }
    .rail-name {
      width: 60px;
      margin: 4px 9px;
      padding: 4px 5px;
      border-radius: 4px;
      background: var(--bg);
      border: 1px solid var(--session-line-2);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 9px;
      outline: none;
    }

    /* the scope header replaces every section label */
    .scopehead {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 18px 10px;
      flex-shrink: 0;
    }
    .scope-name {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .scope-count {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--muted2);
      flex: 1;
    }
    .scope-actions { display: flex; align-items: center; gap: 5px; }
    .scope-btn {
      font-family: var(--font-mono);
      font-size: 9px;
      padding: 3px 7px;
      border-radius: 3px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--muted);
      cursor: pointer;
    }
    .scope-btn:hover { color: var(--text); }
    .scope-btn.on { color: var(--on-accent); background: var(--session); border-color: var(--session); }
    .scope-btn.danger:hover { color: var(--danger); border-color: var(--danger-line); }

    /* ---------- image inspector ---------- */
    .inspector {
      display: none;
      order: 1;
      flex: 1;
      min-width: 0;
      flex-direction: column;
      height: 100vh;
      background: var(--sheet-bg);
      border-right: 1px solid var(--border);
    }
    .inspector.show { display: flex; }

    .insp-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px 10px;
      flex-shrink: 0;
    }
    .insp-title {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ocr);
    }
    .insp-hint { font-size: 10px; color: var(--muted); }

    /* the picture, with a clickable box over every block of text found */
    /* The regions are positioned as percentages, so their containing block has
       to be exactly the rendered image and nothing more. The stage is therefore
       a plain block the full width of the panel, with the image filling it —
       height follows the image, so the stage box and the picture coincide.
       (As a flex item the stage refused to shrink below the image's natural
       width, so the box was far wider than the picture and every region landed
       off to the side.) */
    .insp-canvas {
      flex: 1;
      min-height: 0;
      margin: 0 14px;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .insp-stage { position: relative; width: 100%; line-height: 0; }
    .insp-stage img { display: block; width: 100%; height: auto; border-radius: 4px; }

    .region {
      position: absolute;
      border: 1px solid var(--ocr);
      background: var(--ocr-wash);
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
    }
    .region:hover { background: var(--ocr-wash-2); border-color: var(--ocr); }
    .region.picked {
      background: var(--select-wash-3);
      border-color: var(--select-dim);
      box-shadow: 0 0 0 1px var(--select-wash-3);
    }

    .insp-out {
      flex-shrink: 0;
      margin: 12px 14px 0;
      padding: 10px;
      min-height: 62px;
      max-height: 150px;
      overflow-y: auto;
      background: var(--surface2, var(--surface2));
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .insp-out.empty { color: var(--muted); font-family: var(--font-mono); font-size: 10px; }
    .insp-out::-webkit-scrollbar { width: 3px; }
    .insp-out::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .insp-actions {
      display: flex;
      gap: 8px;
      padding: 10px 14px 14px;
      flex-shrink: 0;
    }
    .insp-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 4px;
      background: var(--surface2, var(--surface2));
      border: 1px solid var(--border2);
      color: var(--text-2, var(--text-2));
      font-family: var(--font-mono);
      font-size: 10.5px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }
    .insp-btn:hover:not(:disabled) { color: var(--ocr); border-color: var(--session-line-2); background: var(--session-tint-2); }
    .insp-btn.prompt:hover:not(:disabled) { color: var(--prompt); border-color: var(--prompt-line-2); background: var(--prompt-tint-2); }
    .insp-btn:disabled { opacity: 0.4; cursor: default; }

    /* drag region lets the user move the window by the title bar */
    .titlebar {
      -webkit-app-region: drag;
      height: 38px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .title {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .close-btn {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
      transition: color 0.15s, background 0.15s;
    }
    .close-btn:hover { color: var(--text); background: var(--surface2); }

    /* The appearance switch belongs where people look for it. The tray menu
       still has the three-way choice; this cycles the same setting. */
    .theme-btn {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 3px;
      transition: color 0.15s, background 0.15s;
    }
    .theme-btn:hover { color: var(--text); background: var(--surface2); }

    .controls {
      padding: 14px 18px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .search-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input::placeholder { color: var(--muted2); }
    .search-input:focus { border-color: var(--border2); }

    .filters {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .pill {
      font-size: 10px;
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .pill:hover { color: var(--text); }
    .pill.active { background: var(--surface2); border-color: var(--border2); color: var(--text); }

    .list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    .list::-webkit-scrollbar { width: 3px; }
    .list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
    .list::-webkit-scrollbar-track { background: transparent; }

    .empty {
      padding: 80px 24px;
      text-align: center;
      color: var(--text-2, var(--text-2));
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.6;
      font-weight: 300;
    }
    .empty .empty-sub {
      display: block;
      margin-top: 14px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted2);
      letter-spacing: 0.06em;
      line-height: 2;
    }
    .empty .hotkey {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 3px;
      padding: 1px 6px;
      font-size: 10px;
      margin: 0 2px;
      color: var(--text-2, var(--text-2));
    }

    .item {
      padding: 12px 18px 12px 14px;
      border-bottom: 1px solid var(--border);
      cursor: grab;
      transition: background 0.14s, transform 0.14s, border-color 0.14s;
      position: relative;
      display: flex;
      gap: 11px;
      align-items: stretch;
    }
    .item:hover {
      background: var(--surface2);
      transform: translateX(-1px);
    }
    .item.dragging { opacity: 0.4; cursor: grabbing; }
    .item.new { animation: pop 0.4s ease; }

    /* multi-select — accent rail on the left edge so a selected row reads as
       picked up without competing with the pinned section's warm tint */
    .item.selected { background: var(--select-wash); box-shadow: inset 2px 0 0 var(--select); }
    .item.selected:hover { background: var(--select-wash-2); }
    /* shift-clicking a range otherwise smears a text selection across rows */
    .item { user-select: none; }

    @keyframes pop {
      0% { background: var(--flash); }
      100% { background: transparent; }
    }

    /* drag handle — 6 dots, only visible on hover */
    .item .drag-handle {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      opacity: 0;
      transition: opacity 0.14s;
      flex-shrink: 0;
      align-self: center;
      width: 4px;
      margin-left: -8px;
    }
    .item:hover .drag-handle { opacity: 0.32; }
    .item .drag-handle .dot-row {
      display: flex;
      gap: 2px;
    }
    .item .drag-handle .dot-row span {
      width: 2px;
      height: 2px;
      background: currentColor;
      border-radius: 50%;
    }

    /* Where an order can be kept, the whole row is the handle: press and hold
       anywhere on it. The grip stays as the shortcut that lifts immediately,
       for anyone who goes looking for one. */
    /* The dots are 4px wide — fine to look at, hopeless to hit. The target is a
       full-height strip down the row's left edge, laid over the row rather than
       sitting in the layout, because widening the handle itself would push
       every row's content sideways. */
    .item.orderable .drag-handle { cursor: grab; opacity: 0.2; }
    .item.orderable .drag-handle::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 26px;
      border-radius: 6px 0 0 6px;
      transition: background 0.12s;
    }
    .item.orderable:hover .drag-handle { opacity: 0.45; }
    /* and it shows when the pointer is on it, so the moment it arms stops being
       a guess — the strip tints and the dots come up to full strength */
    .item.orderable .drag-handle:hover { opacity: 1; }
    .item.orderable .drag-handle:hover::before { background: var(--select-wash-2); }
    .item.orderable .drag-handle:active::before { background: var(--select-wash-3); }
    /* history rows sit in the same list but keep no order, so their grip stays
       the faint decoration it was rather than inviting a drag that won't hold */
    .item:not(.orderable) .drag-handle { cursor: default; }

    /* the press settles the row down a touch, so the hold is felt before the
       lift happens rather than looking like nothing responded */
    .item.arming {
      transform: scale(0.988);
      transition: transform 0.16s ease-out;
    }

    /* the row travelling with the pointer */
    .item.lifting {
      position: fixed;
      pointer-events: none;
      z-index: 30;
      cursor: grabbing;
      background: var(--surface);
      box-shadow: 0 14px 34px var(--shadow);
      border-radius: 8px;
      transform: scale(1.02);
      transition: transform 0.16s cubic-bezier(0.2, 0.9, 0.3, 1.2),
                  box-shadow 0.16s ease-out;
    }
    .item.lifting.landing {
      transform: scale(1);
      box-shadow: 0 2px 8px var(--shadow);
      transition: all 0.19s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* The row keeps its place in the list while it is being carried, emptied
       out and outlined. That hole IS the answer to "where will this land" — it
       travels with the drag and the other rows slide around it. */
    .item.slot > * { visibility: hidden; }
    .item.slot {
      background: var(--select-wash);
      /* outline rather than border: it must not change the row's height, or
         every other row would jump by two pixels the moment you picked it up */
      outline: 1px dashed var(--select-dim);
      outline-offset: -2px;
      border-radius: 6px;
    }
    /* rows sliding out of the way to open the gap */
    .item.shifting { transition: transform 0.19s cubic-bezier(0.2, 0.8, 0.2, 1); }

    .item-icon-col {
      flex-shrink: 0;
      align-self: flex-start;
      padding-top: 2px;
    }
    .type-badge {
      font-size: 9px;
      font-family: var(--font-mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 3px;
      display: inline-block;
      line-height: 1;
    }
    .type-badge.text { color: var(--muted); background: var(--surface2); border: 1px solid var(--surface3); }
    .type-badge.code { color: var(--code); background: var(--code-tint); border: 1px solid var(--code-line); }
    .type-badge.url  { color: var(--url); background: var(--session-tint); border: 1px solid var(--url-line); }
    .type-badge.img  { color: var(--pinned); background: var(--pinned-tint); border: 1px solid var(--pinned-line); }

    /* main content column */
    .item-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* primary headline — first line of the clip, strongly weighted */
    .item-headline {
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--text);
      letter-spacing: -0.005em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-headline.clamp-2 {
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      /* fade overflow at the bottom */
      mask-image: linear-gradient(to bottom, black 70%, var(--shadow) 100%);
    }

    /* code preview — monospace, tinted background, compact */
    .item-headline.code-preview {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 400;
      color: var(--text-2);
      background: var(--code-tint);
      padding: 6px 9px;
      border-radius: 4px;
      border: 1px solid var(--code-tint);
      white-space: pre;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 56px;
      mask-image: linear-gradient(to bottom, black 70%, var(--shadow) 100%);
    }

    /* meta row — type, time, source, etc. small monospace */
    .item-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .item-meta .domain {
      color: var(--url);
      letter-spacing: 0;
    }
    .item-meta .lang-tag {
      background: var(--surface2);
      color: var(--muted);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .item-meta .dot { color: var(--muted2); }
    /* a clip carrying formatting, so pasting it will not be plain */
    .styled-mark {
      color: var(--styled);
      border: 1px solid var(--styled-line);
      background: var(--styled-tint);
      border-radius: 2px;
      padding: 1px 4px;
      font-size: 8.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .item-meta .time { color: var(--muted2); }

    /* image preview — bigger, more prominent */
    .item-image {
      margin-top: 6px;
      /* .item-content is a column flex container, so the default stretch would
         force width to 100% while max-height clamps height independently —
         that distorts the image. flex-start keeps width intrinsic so the
         max-* pair scales it proportionally. */
      align-self: flex-start;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 140px;
      object-fit: contain;
      border-radius: 5px;
      display: block;
      border: 1px solid var(--border);
      transition: max-height 0.2s;
    }
    .item:hover .item-image { max-height: 180px; }

    .actions {
      position: absolute;
      right: 12px;
      top: 12px;
      display: none;
      gap: 4px;
      align-items: center;
      background: var(--surface2);
      padding: 3px;
      border-radius: 5px;
      border: 1px solid var(--border2);
      box-shadow: 0 4px 10px var(--shadow);
    }
    .item:hover .actions { display: flex; }
    .act-btn {
      background: transparent;
      border: none;
      border-radius: 3px;
      color: var(--muted);
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 4px 8px;
      cursor: pointer;
      transition: color 0.12s, background 0.12s;
      letter-spacing: 0.04em;
    }
    .act-btn:hover { color: var(--text); background: var(--surface3, var(--surface3)); }
    .act-btn.danger:hover { color: var(--danger); }

    /* ---------- selection stack ----------
       Selecting clips gathers them into a physical little deck above the
       footer. The deck is the drag target, so "collect, then throw" is one
       continuous gesture rather than an abstract selection state. */
    .stack-tray {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 11px 14px 12px;
      border-top: 1px solid var(--border);
      background: linear-gradient(to top, var(--select-wash-2), var(--select-wash));
      flex-shrink: 0;
    }
    .stack-tray.show { display: flex; animation: trayIn 0.34s cubic-bezier(0.22, 1.2, 0.36, 1); }
    @keyframes trayIn {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .stack-deck {
      position: relative;
      /* wide enough that a 5-card deck stays inside its own footprint when
         the hover fan spreads it, instead of sliding under the label */
      width: 88px;
      height: 46px;
      flex-shrink: 0;
      cursor: grab;
    }
    .stack-deck:active { cursor: grabbing; }
    .stack-deck.delivered { animation: settle 0.5s cubic-bezier(0.22, 1.4, 0.36, 1); }
    @keyframes settle {
      0%   { transform: scale(0.86) rotate(-3deg); }
      55%  { transform: scale(1.06) rotate(1.5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .stack-card {
      position: absolute;
      top: 50%;
      left: 4px;
      width: 38px;
      height: 38px;
      margin-top: -19px;
      border-radius: 6px;
      border: 1px solid var(--hairline);
      background: var(--surface2, var(--surface2));
      box-shadow: 0 3px 8px var(--shadow);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      transform: translateX(var(--x, 0px)) rotate(var(--r, 0deg));
      transition: transform 0.28s cubic-bezier(0.22, 1.2, 0.36, 1), opacity 0.18s;
      cursor: pointer;
    }
    .stack-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* hover fans the deck out so you can see what you've gathered */
    .stack-deck:hover .stack-card {
      transform: translateX(calc(var(--x, 0px) * 1.4)) rotate(calc(var(--r, 0deg) * 1.5));
    }
    .stack-card.leaving { opacity: 0; transform: translateX(var(--x, 0px)) scale(0.5) rotate(12deg); }

    .stack-count {
      position: absolute;
      right: -5px;
      top: -7px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 9px;
      background: var(--select);
      color: var(--on-accent);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px var(--shadow);
      z-index: 5;
    }
    .stack-count.bump { animation: bump 0.34s cubic-bezier(0.22, 1.4, 0.36, 1); }
    @keyframes bump {
      0% { transform: scale(1); } 45% { transform: scale(1.38); } 100% { transform: scale(1); }
    }

    .stack-info { flex: 1; min-width: 0; line-height: 1.35; }
    .stack-title {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-2);
      display: block;
    }
    .stack-hint {
      font-size: 10px;
      color: var(--muted);
      display: block;
    }

    @media (prefers-reduced-motion: reduce) {
      .stack-tray.show, .stack-deck.delivered, .stack-count.bump { animation: none; }
      .stack-card { transition: none; }
    }

    .footer {
      padding: 10px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .footer-info {
      font-size: 10px;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .clear-btn {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: color 0.12s;
    }
    .clear-btn:hover { color: var(--danger); }

    .toast {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text-2);
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 6px 14px;
      border-radius: 3px;
      letter-spacing: 0.06em;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    .skip-pulse {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--live-dim);
      margin-right: 6px;
      vertical-align: middle;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .skip-pulse.on { opacity: 1; }

    /* pause toggle in titlebar */
    .pause-btn {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      cursor: pointer;
      padding: 3px 8px;
      border-radius: 3px;
      margin-right: 4px;
      transition: color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pause-btn:hover { color: var(--text); background: var(--surface2); }
    .pause-btn .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--live-dim);
      transition: background 0.2s;
    }
    .pause-btn.paused .dot { background: var(--pinned-2); }

    /* update-available badge — sits left of pause btn, only shown when a
       newer release exists on github. clicking opens the release page. */
    .update-badge {
      -webkit-app-region: no-drag;
      background: none;
      border: 1px solid var(--live-dim);
      color: var(--live);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      cursor: pointer;
      padding: 3px 7px;
      border-radius: 3px;
      margin-right: 6px;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .update-badge:hover {
      color: var(--live-bright);
      background: var(--session-wash);
      border-color: var(--live-dim);
    }
    .update-badge .update-arrow {
      font-size: 11px;
      line-height: 1;
    }

    .titlebar-right {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
    }

    /* dim the list when paused */
    body.paused .list { opacity: 0.4; pointer-events: none; }
    body.paused .controls { opacity: 0.5; }
    .paused-banner {
      display: none;
      padding: 8px 18px;
      background: var(--pinned-tint-2);
      border-bottom: 1px solid var(--pinned-line-2);
      color: var(--pinned-2);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-align: center;
    }
    body.paused .paused-banner { display: block; }

    /* promote-on-recopy: flash the item when bumped to top */
    .item.promoted { animation: promote 0.7s ease; }
    @keyframes promote {
      0%   { background: var(--pinned-line-2); }
      50%  { background: var(--pinned-tint); }
      100% { background: transparent; }
    }

    /* the row being edited stays visibly tied to the sheet below it */
    .item.editing {
      background: var(--prompt-wash);
      box-shadow: inset 0 0 0 1px var(--prompt-strong);
    }

    /* tag chips shown inline on a prompt row, so the library is scannable */
    .item-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
    .tag-chip {
      font-family: var(--font-mono);
      font-size: 9px;
      line-height: 1;
      padding: 3px 6px;
      border-radius: 3px;
      color: var(--prompt-dim);
      background: var(--prompt-tint);
      border: 1px solid var(--prompt-line);
      white-space: nowrap;
    }

    /* ---------- prompt editor sheet ---------- */
    .editor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      max-height: 62%;
      display: flex;
      flex-direction: column;
      background: var(--sheet-bg);
      border-top: 1px solid var(--prompt-line);
      box-shadow: 0 -12px 32px var(--shadow);
      transform: translateY(100%);
      transition: transform 0.26s cubic-bezier(0.22, 1.1, 0.36, 1);
    }
    .editor.show { transform: translateY(0); }

    .editor-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px 8px;
      flex-shrink: 0;
    }
    .editor-title {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--prompt-dim);
    }
    .editor-saved {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--muted2);
      opacity: 0;
      transition: opacity 0.18s;
    }
    .editor-saved.show { opacity: 1; }

    .editor-body {
      margin: 0 14px;
      padding: 10px;
      min-height: 78px;
      max-height: 190px;
      resize: none;
      overflow-y: auto;
      background: var(--surface2, var(--surface2));
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11.5px;
      line-height: 1.5;
      outline: none;
    }
    .editor-body:focus { border-color: var(--prompt-line-2); }

    .editor-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      padding: 10px 14px 12px;
      flex-shrink: 0;
    }
    .editor-tags .tag-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; padding: 4px 7px; }
    .editor-tags .tag-x { cursor: pointer; color: var(--muted); }
    .editor-tags .tag-x:hover { color: var(--danger-dim); }

    .tag-add {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 3px;
      background: var(--surface2, var(--surface2));
      border: 1px dashed var(--border2);
      color: var(--muted);
      cursor: pointer;
    }
    .tag-add:hover { color: var(--prompt-dim); border-color: var(--prompt-line-2); }
    .tag-input {
      width: 104px;
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 4px 7px;
      border-radius: 3px;
      background: var(--surface2, var(--surface2));
      border: 1px solid var(--prompt-line-2);
      color: var(--text);
      outline: none;
    }
    .type-badge.session { color: var(--session); background: var(--session-tint); border: 1px solid var(--session-line); }
    .session-btn-row.on { color: var(--session); }
    .session-actions {
      display: flex;
      gap: 6px;
      margin-left: auto;
      margin-right: 10px;
    }
    .session-actions button {
      background: none; border: 0; padding: 0 2px;
      font-family: var(--font-mono); font-size: 9px;
      color: var(--muted2); cursor: pointer; text-transform: none; letter-spacing: 0;
    }
    .session-actions button:hover { color: var(--session); }
    .session-actions button.danger:hover { color: var(--danger); }

    /* Tag filtering lives inside the prompts section — tags belong to prompts,
       so they must not sit at the same level as the type filters above. */
    .tag-filter { position: relative; margin-left: auto; margin-right: 10px; }
    .tag-filter-btn {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: none;
      padding: 3px 7px;
      border-radius: 3px;
      background: var(--surface2, var(--surface2));
      border: 1px solid var(--border2);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tag-filter-btn:hover { color: var(--prompt-dim); border-color: var(--prompt-line-2); }
    .tag-filter-btn.on { color: var(--on-accent); background: var(--prompt-dim); border-color: var(--prompt-dim); }
    .tag-filter-btn .caret { font-size: 7px; opacity: 0.7; }

    .tag-menu {
      position: absolute;
      right: 0;
      top: 130%;
      z-index: 30;
      min-width: 128px;
      max-height: 190px;
      overflow-y: auto;
      padding: 4px;
      background: var(--menu-bg);
      border: 1px solid var(--prompt-line);
      border-radius: 5px;
      box-shadow: 0 8px 22px var(--shadow);
      display: none;
    }
    .tag-menu.show { display: block; }
    .tag-menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-radius: 3px;
      padding: 5px 7px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-2, var(--text-2));
      cursor: pointer;
      text-transform: none;
      letter-spacing: 0;
    }
    .tag-menu button:hover { background: var(--prompt-tint-2); color: var(--prompt); }
    .tag-menu button.on { color: var(--prompt); }
    .tag-menu .menu-sep { height: 1px; background: var(--border); margin: 4px 2px; }

    /* ---------- extracted text sheet ---------- */
    .ocr-sheet { border-top-color: var(--ocr-line); }
    .ocr-sheet .editor-title { color: var(--ocr); }
    .ocr-list {
      margin: 0 14px 12px;
      overflow-y: auto;
      max-height: 260px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ocr-list::-webkit-scrollbar { width: 3px; }
    .ocr-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
    .ocr-list::-webkit-scrollbar-track { background: transparent; }
    .ocr-empty { padding: 18px 4px; font-size: 11px; color: var(--muted); text-align: center; }
    .ocr-status {
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
    }
    .ocr-bar {
      height: 2px;
      margin-top: 8px;
      background: var(--border);
      border-radius: 1px;
      overflow: hidden;
    }
    .ocr-bar span { display: block; height: 100%; width: 0; background: var(--ocr-strong); transition: width 0.2s; }

    /* picker that opens from "+ tag" — existing tags to choose, or type a new one */
    .tag-picker {
      position: absolute;
      left: 14px;
      bottom: 44px;
      z-index: 30;
      width: 176px;
      padding: 6px;
      background: var(--menu-bg);
      border: 1px solid var(--prompt-line);
      border-radius: 5px;
      box-shadow: 0 8px 22px var(--shadow);
      display: none;
    }
    .tag-picker.show { display: block; }
    .tag-picker .tag-input { width: 100%; box-sizing: border-box; margin-bottom: 5px; }
    .tag-suggestions { max-height: 132px; overflow-y: auto; }
    .tag-suggestions button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-radius: 3px;
      padding: 5px 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-2, var(--text-2));
      cursor: pointer;
    }
    .tag-suggestions button:hover, .tag-suggestions button.active { background: var(--prompt-tint-2); color: var(--prompt); }
    .tag-suggestions .none { padding: 5px 6px; font-family: var(--font-mono); font-size: 9px; color: var(--muted2); }
    .type-badge.prompt {
      color: var(--prompt);
      background: var(--prompt-tint);
      border: 1px solid var(--prompt-line);
    }
    .prompt-btn.on { color: var(--prompt); }
    .prompt-btn:hover { color: var(--prompt); }
    /* pin button — little star/dot on each item */
    .pin-btn {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 3px;
      color: var(--muted);
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 3px 7px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
      line-height: 1;
    }
    .pin-btn:hover { color: var(--pinned); border-color: var(--pinned-line); }
    .pin-btn.pinned {
      color: var(--pinned);
      border-color: var(--pinned-line);
      background: var(--pinned-tint);
    }
    .pin-btn.pinned:hover { color: var(--pinned-dim); }
  </style>
</head>
<body>
  <div class="shell">
  <div class="inspector" id="inspector">
    <div class="insp-head">
      <span class="insp-title">select text from image</span>
      <span class="insp-hint" id="inspHint">tap the highlighted areas</span>
      <button class="close-btn" id="inspClose" title="close (Esc)">×</button>
    </div>
    <div class="insp-canvas">
      <div class="insp-stage" id="inspStage"></div>
    </div>
    <div class="insp-out empty" id="inspOut">selected text appears here</div>
    <div class="insp-actions">
      <button class="insp-btn" id="inspCopy" disabled>copy text</button>
      <button class="insp-btn prompt" id="inspPrompt" disabled>add to prompts</button>
    </div>
  </div>

  <div class="app">
  <div class="panel">
    <div class="titlebar">
      <span class="title">stash</span>
      <div class="titlebar-right">
        <button class="update-badge" id="updateBadge" title="" style="display:none">
          <span class="update-arrow">↑</span>
          <span id="updateLabel"></span>
        </button>
        <button class="pause-btn" id="pauseBtn" title="pause clipboard capture">
          <span class="dot"></span>
          <span id="pauseLabel">live</span>
        </button>
        <button class="theme-btn" id="themeBtn" title="appearance"></button>
        <button class="close-btn" id="closeBtn" title="hide (⌘⇧V)">×</button>
      </div>
    </div>

    <div class="paused-banner">clipboard capture paused</div>

    <div class="controls">
      <input class="search-input" id="search" placeholder="search clipboard..." />
      <!-- only types live here now; prompts and pinned are places on the rail -->
      <div class="filters">
        <button class="pill active" data-type="all">all</button>
        <button class="pill" data-type="text">text</button>
        <button class="pill" data-type="code">code</button>
        <button class="pill" data-type="url">url</button>
        <button class="pill" data-type="img">image</button>
      </div>
    </div>

    <div class="scopehead">
      <span class="scope-name" id="scopeName">everything</span>
      <span class="scope-count" id="scopeCount"></span>
      <span class="scope-actions" id="scopeActions"></span>
    </div>

    <div class="list" id="list">
      <div class="empty">
        Stash quietly remembers while you work.
        <span class="empty-sub">copy anything to begin · <span class="hotkey">⌘</span><span class="hotkey">⇧</span><span class="hotkey">V</span> to toggle</span>
      </div>
    </div>

    <div class="editor" id="editor">
      <div class="editor-head">
        <span class="editor-title">edit prompt</span>
        <span class="editor-saved" id="editorSaved">saved</span>
        <button class="close-btn" id="editorClose" title="close (Esc)">×</button>
      </div>
      <textarea class="editor-body" id="editorBody" spellcheck="false"></textarea>
      <div class="editor-tags" id="editorTags"></div>
      <div class="tag-picker" id="tagPicker">
        <input class="tag-input" id="tagPickerInput" placeholder="type a new tag" maxlength="24" />
        <div class="tag-suggestions" id="tagSuggestions"></div>
      </div>
    </div>

    <div class="editor ocr-sheet" id="ocrSheet">
      <div class="editor-head">
        <span class="editor-title">extracted text</span>
        <span class="editor-saved" id="ocrCount"></span>
        <button class="close-btn" id="ocrClose" title="close (Esc)">×</button>
      </div>
      <div class="ocr-list" id="ocrList"></div>
    </div>

    <div class="stack-tray" id="stackTray">
      <div class="stack-deck" id="stackDeck" draggable="true" title="drag the stack anywhere">
        <span class="stack-count" id="stackCount">0</span>
      </div>
      <span class="stack-info">
        <span class="stack-title" id="stackTitle">0 stacked</span>
        <span class="stack-hint">drag it anywhere</span>
      </span>
      <button class="clear-btn" id="selClearBtn">deselect</button>
    </div>

    <div class="footer">
      <span class="footer-info"><span class="skip-pulse" id="skipPulse" title="a secret-looking item was skipped"></span><span id="footerInfo">0 items</span></span>
      <button class="clear-btn" id="clearBtn">clear all</button>
    </div>
  </div>

  <!-- every top-level place: everything, prompts, pinned, each session, and new -->
  <nav class="rail" id="rail" aria-label="places"></nav>
  </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let history = [];
    let pinned = [];
    let activeFilter = 'all';
    // which place the rail has selected: all | prompts | pinned | a session id
    let activeScope = 'all';
    let searchQuery = '';
    // Section collapse state — in-memory only, resets on app restart

    // Multi-select state. `selected` holds clip ids; `renderedOrder` is the
    // flat top-to-bottom order of what's currently on screen, which is what
    // shift-click ranges are measured against (pinned rows come first, and a
    // filter or search can hide anything in between).
    const selected = new Set();
    let renderedOrder = [];
    let anchorId = null;

    const listEl = document.getElementById('list');
    const footerEl = document.getElementById('footerInfo');
    const searchEl = document.getElementById('search');
    const toastEl = document.getElementById('toast');
    // sessions — named folders that fill themselves while active
    let sessions = [];
    let sessionClips = [];
    let activeSessionId = null;

    // tag chosen in the prompts-section dropdown; narrows prompts only
    let activeTag = null;
    // prompt editor state — the id of the prompt whose sheet is open
    let editingId = null;
    let editorSaveTimer = null;
    const editorEl = document.getElementById('editor');
    const editorBodyEl = document.getElementById('editorBody');
    const editorTagsEl = document.getElementById('editorTags');
    const editorSavedEl = document.getElementById('editorSaved');
    const tagPickerEl = document.getElementById('tagPicker');
    const tagPickerInputEl = document.getElementById('tagPickerInput');
    const tagSuggestionsEl = document.getElementById('tagSuggestions');

    const stackTrayEl = document.getElementById('stackTray');
    const stackDeckEl = document.getElementById('stackDeck');
    const stackCountEl = document.getElementById('stackCount');
    const stackTitleEl = document.getElementById('stackTitle');
    // ids currently drawn in the deck, so we only animate what actually changed
    let stackDrawn = [];
    // rasterized stack, handed to the OS as the drag cursor; rebuilt off the
    // critical path because dragstart can't wait on image decoding
    let stackIconUrl = null;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function timeAgo(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 10) return 'just now';
      if (s < 60) return s + 's ago';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm ago';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.floor(h / 24) + 'd ago';
    }

    function itemMatchesFilter(c, isPinned) {
      // The rail decides which place you're in; these only narrow by type.
      // prompt and pinned used to live here as pseudo-types, which is why the
      // row wrapped onto two lines.
      if (searchQuery && !c.content.toLowerCase().includes(searchQuery)) return false;
      if (activeFilter !== 'all' && c.type !== activeFilter) return false;
      return true;
    }

    // URL helpers
    function domainOf(url) {
      try {
        const u = new URL(url);
        return u.hostname.replace(/^www\./, '');
      } catch { return null; }
    }
    function urlHeadline(url) {
      try {
        const u = new URL(url);
        const path = (u.pathname + u.search).replace(/^\//, '');
        if (path.length > 0) return path.slice(0, 80);
        return u.hostname.replace(/^www\./, '');
      } catch { return url.slice(0, 80); }
    }

    // crude language detection — used for the small lang-tag on code clips
    function detectLang(text) {
      const t = text.trim();
      if (/^\s*<[a-z]/i.test(t)) return 'html';
      if (/^\s*(import|from|def |class )/.test(t)) return 'py';
      if (/(^|\s)(function|const|let|var|=>|import .* from)/.test(t)) return 'js';
      if (/^\s*SELECT |^\s*INSERT |^\s*UPDATE |^\s*WHERE /i.test(t)) return 'sql';
      if (/(^|\s)#include|::\s*\w+/.test(t)) return 'c';
      if (/^\s*\{[\s\S]*\}\s*$/.test(t) && t.includes('"')) return 'json';
      return null;
    }

    // ---------- multi-select ----------
    // Resolve selected ids back to clips, in the order they appear on screen,
    // so a batch drop lands in the same order the user sees.
    function selectedClips() {
      // Session clips live in their own store, so leaving them out of this
      // lookup made selection inside a session resolve to nothing: the ids were
      // held, the tray saw an empty list and hid itself, and a drag carried
      // nothing. Sessions come last so their copy wins for a clip held in both —
      // it's the one with the permanent image file.
      const byId = new Map([...pinned, ...history, ...sessionClips].map(c => [c.id, c]));
      return renderedOrder.filter(id => selected.has(id)).map(id => byId.get(id)).filter(Boolean);
    }

    function selectRange(fromId, toId) {
      const a = renderedOrder.indexOf(fromId);
      const b = renderedOrder.indexOf(toId);
      if (a === -1 || b === -1) { selected.add(toId); return; }
      const [lo, hi] = a < b ? [a, b] : [b, a];
      for (let i = lo; i <= hi; i++) selected.add(renderedOrder[i]);
    }

    function clearSelection() {
      selected.clear();
      anchorId = null;
      syncSelection();
    }

    // Paint selection state without a full re-render — re-rendering on every
    // click would rebuild every row and kill the drag the user is about to
    // start. `originRect` is the row a clip was just taken from, so its card
    // can fly out of that row instead of blinking into existence.
    function syncSelection(originRect) {
      document.querySelectorAll('.item').forEach(n => {
        n.classList.toggle('selected', selected.has(n.dataset.id));
      });
      updateStack(originRect);
    }

    // ---------- the rail ----------
    // Every top-level place is a rail item: everything, prompts, pinned, one
    // per session, and new. Choosing one swaps what the list shows, which is
    // why there are no section headers any more.
    const railEl = document.getElementById('rail');
    const scopeNameEl = document.getElementById('scopeName');
    const scopeCountEl = document.getElementById('scopeCount');
    const scopeActionsEl = document.getElementById('scopeActions');

    const RAIL_ICONS = {
      all: '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
      // a four-point sparkle, so prompts never reads as a second star
      prompts: '<svg viewBox="0 0 24 24"><path d="M12 3.5c.6 4.2 1.8 5.4 6 6-4.2.6-5.4 1.8-6 6-.6-4.2-1.8-5.4-6-6 4.2-.6 5.4-1.8 6-6z"/><path d="M18.5 15.5c.25 1.6.75 2.1 2.3 2.3-1.55.25-2.05.75-2.3 2.3-.25-1.55-.75-2.05-2.3-2.3 1.55-.2 2.05-.7 2.3-2.3z"/></svg>',
      pinned: '<svg viewBox="0 0 24 24"><path d="M12 4l2.3 5.1 5.7.6-4.2 3.8 1.2 5.5L12 16.3 7 19l1.2-5.5L4 9.7l5.7-.6z"/></svg>',
      folder: '<svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 012-2h3.2l1.6 2H18a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2z"/></svg>',
      add: '<svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>',
    };

    function activeSession() {
      return sessions.find(s => s.id === activeSessionId) || null;
    }

    function scopeIsSession(id) {
      return sessions.some(s => s.id === id);
    }

    function scopeLabel(id) {
      if (id === 'prompts') return 'prompts';
      if (id === 'pinned') return 'pinned';
      const s = sessions.find(x => x.id === id);
      return s ? s.name : 'everything';
    }

    // What belongs in each place. Prompts and pinned share one store, told
    // apart by the flag; sessions keep their own copies.
    function clipsForScope(id) {
      if (id === 'prompts') return pinned.filter(c => c.isPrompt);
      if (id === 'pinned') return pinned.filter(c => !c.isPrompt);
      if (scopeIsSession(id)) return clipsInSession(id);
      // everything: kept things first, then the running history
      return [...pinned.filter(c => c.isPrompt), ...pinned.filter(c => !c.isPrompt), ...history];
    }

    // Which run of rows a clip belongs to. Everything shows three lists stacked
    // — prompts, then pinned, then the running history — and each is its own
    // array, so a row can only be reordered among its own kind.
    function blockOf(clip, isPinned, sessionId) {
      if (sessionId) return 'session';
      if (clip.isPrompt) return 'prompt';
      // which array it actually lives in decides this, not the pinnedAt stamp
      // the row was drawn from — the two must not be able to disagree
      if (isPinned || pinned.some(p => p.id === clip.id)) return 'pinned';
      return 'history';
    }

    // Everything else keeps an order; history cannot. It is memory-only and
    // capped, every new copy lands at the top, and it is gone at the next
    // restart — an order arranged there would quietly undo itself.
    const canOrderBlock = (block) => block !== 'history';

    function railItem(id, label, icon, cls) {
      const b = document.createElement('button');
      b.className = 'rail-item ' + (cls || '') + (activeScope === id ? ' on' : '');
      b.dataset.scope = id;
      b.title = label;
      b.innerHTML = icon + '<span class="lbl"></span>';
      b.querySelector('.lbl').textContent = label;
      b.addEventListener('click', () => {
        activeScope = id;
        // a tag filter belongs to prompts; leaving prompts clears it
        if (id !== 'prompts') activeTag = null;
        render();
      });
      return b;
    }

    function buildRail() {
      railEl.innerHTML = '';
      railEl.appendChild(railItem('all', 'all', RAIL_ICONS.all, ''));
      railEl.appendChild(railItem('prompts', 'prompts', RAIL_ICONS.prompts, 'prompts'));
      railEl.appendChild(railItem('pinned', 'pinned', RAIL_ICONS.pinned, 'pinned'));

      const sep = document.createElement('div');
      sep.className = 'rail-sep';
      railEl.appendChild(sep);

      sessions.forEach(s => {
        const el = railItem(s.id, s.name, RAIL_ICONS.folder, 'session');
        if (s.id === activeSessionId) {
          const dot = document.createElement('span');
          dot.className = 'rec';
          dot.title = 'collecting into this session';
          el.appendChild(dot);
        }
        railEl.appendChild(el);
      });

      const add = document.createElement('button');
      add.className = 'rail-item';
      add.id = 'railAdd';
      add.title = 'new session';
      add.innerHTML = RAIL_ICONS.add + '<span class="lbl">new</span>';
      add.addEventListener('click', (e) => {
        // this handler removes its own button, so the click must not reach any
        // dismiss-on-outside-click listener
        e.stopPropagation();
        const input = document.createElement('input');
        input.className = 'rail-name';
        input.placeholder = 'name';
        input.maxLength = 40;
        input.addEventListener('keydown', async (ev) => {
          ev.stopPropagation();
          if (ev.key === 'Enter') {
            ev.preventDefault();
            const name = input.value.trim();
            if (!name) return;
            const id = await window.api.createSession(name);
            if (id) activeScope = id;
            toast('collecting into “' + name + '”');
          }
          if (ev.key === 'Escape') { ev.preventDefault(); render(); }
        });
        input.addEventListener('blur', () => render());
        add.replaceWith(input);
        input.focus();
      });
      railEl.appendChild(add);
    }

    // The scope header carries whatever the place itself needs: collecting and
    // rename and delete for a session, the tag filter for prompts.
    function buildScopeHead(count) {
      scopeNameEl.textContent = scopeLabel(activeScope);
      scopeCountEl.textContent = count + (count === 1 ? ' clip' : ' clips');
      scopeActionsEl.innerHTML = '';

      if (activeScope === 'prompts') {
        const tagFilter = buildTagFilter();
        if (tagFilter) scopeActionsEl.appendChild(tagFilter);
        return;
      }
      if (!scopeIsSession(activeScope)) return;

      const session = sessions.find(s => s.id === activeScope);
      const collecting = session.id === activeSessionId;

      const collect = document.createElement('button');
      collect.className = 'scope-btn' + (collecting ? ' on' : '');
      collect.dataset.act = 'collect';
      collect.textContent = collecting ? 'collecting' : 'collect here';
      collect.title = collecting ? 'stop collecting into this session' : 'send new copies here';
      collect.addEventListener('click', () => {
        window.api.setActiveSession(collecting ? null : session.id);
      });

      const rename = document.createElement('button');
      rename.className = 'scope-btn';
      rename.dataset.act = 'rename';
      rename.textContent = 'rename';
      rename.addEventListener('click', (e) => {
        e.stopPropagation();
        const input = document.createElement('input');
        input.className = 'rail-name';
        input.style.width = '110px';
        input.value = session.name;
        input.maxLength = 40;
        input.addEventListener('keydown', async (ev) => {
          ev.stopPropagation();
          if (ev.key === 'Enter') {
            ev.preventDefault();
            const name = input.value.trim();
            if (name) await window.api.renameSession(session.id, name);
            else render();
          }
          if (ev.key === 'Escape') { ev.preventDefault(); render(); }
        });
        input.addEventListener('blur', () => render());
        rename.replaceWith(input);
        input.focus();
        input.select();
      });

      const del = document.createElement('button');
      del.className = 'scope-btn danger';
      del.dataset.act = 'delete';
      del.textContent = 'delete';
      del.title = 'delete this session and the clips kept in it';
      del.addEventListener('click', async () => {
        // deleting throws away clips that may exist nowhere else, so the second
        // click is the confirmation rather than a dialog
        if (del.dataset.armed !== '1') {
          del.dataset.armed = '1';
          del.textContent = 'sure?';
          setTimeout(() => { del.dataset.armed = '0'; del.textContent = 'delete'; }, 2500);
          return;
        }
        await window.api.deleteSession(session.id);
        activeScope = 'all';
        toast('session deleted');
      });

      scopeActionsEl.appendChild(collect);
      scopeActionsEl.appendChild(rename);
      scopeActionsEl.appendChild(del);
    }

    function clipsInSession(id) {
      return sessionClips.filter(c => c.sessionId === id);
    }

    function isInSession(clipId, sessionId) {
      return sessionClips.some(c => c.id === clipId && c.sessionId === sessionId);
    }

    // ---------- prompt editor ----------
    function findClip(id) {
      return pinned.find(p => p.id === id) || history.find(h => h.id === id) || null;
    }

    function openEditor(id) {
      // both sheets dock to the same edge, so only one can be up at a time
      closeOcr();
      editingId = id;
      const c = findClip(id);
      if (!c) return closeEditor();
      editorBodyEl.value = c.content || '';
      renderEditorTags();
      editorEl.classList.add('show');
      markEditingRow();
      editorBodyEl.focus();
    }

    function closeEditor() {
      flushEditorContent();
      closeTagPicker();
      editingId = null;
      editorEl.classList.remove('show');
      markEditingRow();
    }

    function markEditingRow() {
      document.querySelectorAll('.item').forEach(n => {
        n.classList.toggle('editing', !!editingId && n.dataset.id === editingId);
      });
    }

    function flashSaved() {
      editorSavedEl.classList.add('show');
      clearTimeout(flashSaved._t);
      flashSaved._t = setTimeout(() => editorSavedEl.classList.remove('show'), 900);
    }

    // content autosaves as you type; tags save the moment they change
    function flushEditorContent() {
      clearTimeout(editorSaveTimer);
      if (!editingId) return;
      const c = findClip(editingId);
      const next = editorBodyEl.value;
      if (!c || !next.trim() || next === c.content) return;
      window.api.updatePrompt(editingId, { content: next }).then(ok => { if (ok) flashSaved(); });
    }

    function renderEditorTags() {
      const c = editingId ? findClip(editingId) : null;
      const tags = (c && c.tags) || [];
      editorTagsEl.innerHTML = '';
      tags.forEach(t => {
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        chip.innerHTML = `<span></span><span class="tag-x" title="remove">×</span>`;
        chip.firstChild.textContent = t;
        chip.querySelector('.tag-x').addEventListener('click', () => setTags(tags.filter(x => x !== t)));
        editorTagsEl.appendChild(chip);
      });

      const add = document.createElement('button');
      add.className = 'tag-add';
      add.textContent = '+ tag';
      add.addEventListener('click', (e) => { e.stopPropagation(); openTagPicker(); });
      editorTagsEl.appendChild(add);
    }

    async function setTags(tags) {
      if (!editingId) return;
      const ok = await window.api.updatePrompt(editingId, { tags });
      if (ok) flashSaved();
    }

    // ---------- extracted text ----------
    // OCR runs in main; this just shows what came back. Each block is its own
    // row so a screenshot becomes a set of separate copies, not one dump.
    const ocrSheetEl = document.getElementById('ocrSheet');
    const ocrListEl = document.getElementById('ocrList');
    const ocrCountEl = document.getElementById('ocrCount');
    let ocrBusyId = null;

    // the inspector — the picture with its text regions drawn over it
    const inspectorEl = document.getElementById('inspector');
    const inspStageEl = document.getElementById('inspStage');
    const inspOutEl = document.getElementById('inspOut');
    const inspHintEl = document.getElementById('inspHint');
    const inspCopyEl = document.getElementById('inspCopy');
    const inspPromptEl = document.getElementById('inspPrompt');
    let inspBlocks = [];
    // pixel dimensions of the image OCR read — the space block boxes live in
    let inspSrcW = 0;
    let inspSrcH = 0;
    const inspPicked = new Set();

    function closeOcr() {
      ocrSheetEl.classList.remove('show');
      closeInspector();
    }

    function closeInspector() {
      if (!inspectorEl.classList.contains('show')) return;
      inspectorEl.classList.remove('show');
      inspStageEl.innerHTML = '';
      inspBlocks = [];
      inspPicked.clear();
      syncInspOut();
      window.api.expandWindow(false);
    }

    // `src` is the full-size image OCR actually read, and w/h are the pixel
    // dimensions the block coordinates belong to — never the on-screen size.
    async function openInspector(src, blocks, w, h) {
      inspBlocks = blocks;
      inspSrcW = w || 0;
      inspSrcH = h || 0;
      inspPicked.clear();
      inspStageEl.innerHTML = '';
      // widen the OS window first so the picture is measured at its real size
      await window.api.expandWindow(true);
      inspectorEl.classList.add('show');

      const img = new Image();
      img.alt = '';
      inspStageEl.appendChild(img);
      img.onload = () => drawRegions(img);
      img.src = src;

      inspHintEl.textContent = blocks.length
        ? `${blocks.length} area${blocks.length === 1 ? '' : 's'} found`
        : 'no text found';
      syncInspOut();
    }

    // Boxes come back in image pixels; the picture is displayed scaled to fit,
    // so every box is scaled by the same factor to land on top of its text.
    function drawRegions(img) {
      inspStageEl.querySelectorAll('.region').forEach(r => r.remove());
      // Position boxes as percentages of the image's natural size rather than
      // measuring the rendered element. naturalWidth is known the moment the
      // image decodes, so this needs no layout to have happened, and the boxes
      // track the picture for free when the window resizes.
      // Scale against the size OCR worked in. Falling back to the element's
      // natural size is only for safety — if the two ever disagree (a preview
      // thumbnail, say) every box would be misplaced by that ratio.
      const nw = inspSrcW || img.naturalWidth || 1;
      const nh = inspSrcH || img.naturalHeight || 1;
      const pct = (v, total) => (v / total * 100) + '%';
      inspBlocks.forEach((b, i) => {
        if (!b.bbox) return;
        const el = document.createElement('div');
        el.className = 'region' + (inspPicked.has(i) ? ' picked' : '');
        el.dataset.index = String(i);
        el.title = b.text;
        el.style.left = pct(b.bbox.x0, nw);
        el.style.top = pct(b.bbox.y0, nh);
        el.style.width = pct(b.bbox.x1 - b.bbox.x0, nw);
        el.style.height = pct(b.bbox.y1 - b.bbox.y0, nh);
        el.addEventListener('click', () => {
          if (inspPicked.has(i)) inspPicked.delete(i);
          else inspPicked.add(i);
          el.classList.toggle('picked', inspPicked.has(i));
          syncInspOut();
        });
        inspStageEl.appendChild(el);
      });
    }

    function pickedText() {
      return [...inspPicked].sort((a, b) => a - b).map(i => inspBlocks[i].text).join('\n\n');
    }

    function syncInspOut() {
      const text = pickedText();
      inspOutEl.textContent = text || 'selected text appears here';
      inspOutEl.classList.toggle('empty', !text);
      inspCopyEl.disabled = !text;
      inspPromptEl.disabled = !text;
      if (inspBlocks.length) {
        inspHintEl.textContent = inspPicked.size
          ? `${inspPicked.size} of ${inspBlocks.length} selected`
          : `${inspBlocks.length} area${inspBlocks.length === 1 ? '' : 's'} found`;
      }
    }

    inspCopyEl.addEventListener('click', async () => {
      const text = pickedText();
      if (!text) return;
      await window.api.write({ type: 'text', content: text });
      toast('copied — paste with ⌘V');
    });

    inspPromptEl.addEventListener('click', async () => {
      const text = pickedText();
      if (!text) return;
      const ok = await window.api.createPrompt(text);
      toast(ok ? 'saved as a prompt — kept forever' : 'could not save that');
    });

    document.getElementById('inspClose').addEventListener('click', closeInspector);
    // hiding the drawer must also shrink the window back, or it reopens wide
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) closeInspector();
    });

    function showOcrStatus(label, pct) {
      ocrListEl.innerHTML = `<div class="ocr-status">${esc(label)}<div class="ocr-bar"><span style="width:${Math.round(pct * 100)}%"></span></div></div>`;
    }

    async function runOcr(id) {
      if (ocrBusyId) return;
      ocrBusyId = id;
      closeEditor();
      ocrSheetEl.classList.add('show');
      ocrCountEl.classList.add('show');
      ocrCountEl.textContent = 'reading…';
      // the first run also unpacks the language data, so it's the slow one
      showOcrStatus('reading the image…', 0.05);
      try {
        const res = await window.api.ocr(id);
        if (!res || !res.ok) {
          ocrListEl.innerHTML = `<div class="ocr-empty">${esc((res && res.error) || 'could not read that image')}</div>`;
          ocrCountEl.textContent = '';
          return;
        }
        // hand off to the inspector: the picture with its regions, not a list
        ocrSheetEl.classList.remove('show');
        await openInspector(res.imageUrl || res.dataUrl, res.blocks || [], res.width, res.height);
      } catch (err) {
        // without this a fault here leaves nothing on screen at all: the
        // progress sheet has already stepped aside and the panel never opened
        console.error('inspector failed:', err);
        closeInspector();
        ocrSheetEl.classList.add('show');
        ocrListEl.innerHTML = `<div class="ocr-empty">something went wrong reading that image</div>`;
        ocrCountEl.textContent = '';
      } finally {
        ocrBusyId = null;
      }
    }

    function onOcrProgress(m) {
      if (!ocrBusyId || !m) return;
      const label = m.status === 'recognizing text' ? 'reading the image…'
        : m.status === 'loading language traineddata' || m.status === 'loading tesseract core'
          ? 'warming up the reader…'
          : (m.status || 'working…');
      showOcrStatus(label, typeof m.progress === 'number' ? Math.max(0.05, m.progress) : 0.05);
    }

    document.getElementById('ocrClose').addEventListener('click', closeOcr);

    // ---------- tag picker ----------
    // Reusing an existing tag has to be as easy as inventing one, otherwise a
    // library drifts into "img gen", "image gen", "image-gen" within a week.
    function openTagPicker() {
      tagPickerEl.classList.add('show');
      tagPickerInputEl.value = '';
      renderTagSuggestions();
      tagPickerInputEl.focus();
    }

    function closeTagPicker() {
      tagPickerEl.classList.remove('show');
    }

    function renderTagSuggestions() {
      const c = editingId ? findClip(editingId) : null;
      const mine = new Set(((c && c.tags) || []).map(t => t.toLowerCase()));
      const typed = tagPickerInputEl.value.trim().toLowerCase();
      const options = allTags()
        .filter(t => !mine.has(t.toLowerCase()))
        .filter(t => !typed || t.toLowerCase().includes(typed));

      tagSuggestionsEl.innerHTML = '';
      options.forEach(t => {
        const b = document.createElement('button');
        b.textContent = t;
        b.addEventListener('mousedown', (e) => { e.preventDefault(); addTag(t); });
        tagSuggestionsEl.appendChild(b);
      });

      if (!options.length) {
        const none = document.createElement('div');
        none.className = 'none';
        none.textContent = typed ? 'press enter to create' : 'no other tags yet';
        tagSuggestionsEl.appendChild(none);
      }
    }

    function addTag(tag) {
      const c = editingId ? findClip(editingId) : null;
      if (!c) return;
      const next = [...(c.tags || []), tag];
      tagPickerInputEl.value = '';
      setTags(next).then(() => {
        // stay open so several tags can be added in one visit
        renderTagSuggestions();
        tagPickerInputEl.focus();
      });
    }

    tagPickerInputEl.addEventListener('input', renderTagSuggestions);
    tagPickerInputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const typed = tagPickerInputEl.value.trim();
        // enter takes the sole remaining suggestion, else creates what was typed
        const only = tagSuggestionsEl.querySelectorAll('button');
        if (!typed && only.length === 1) addTag(only[0].textContent);
        else if (typed) addTag(typed);
      }
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeTagPicker(); }
    });
    tagPickerInputEl.addEventListener('blur', () => setTimeout(closeTagPicker, 120));

    editorBodyEl.addEventListener('input', () => {
      clearTimeout(editorSaveTimer);
      editorSaveTimer = setTimeout(flushEditorContent, 400);
    });
    editorBodyEl.addEventListener('blur', flushEditorContent);
    document.getElementById('editorClose').addEventListener('click', closeEditor);

    // clicking anywhere else dismisses the tag dropdown
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.tag-filter')) {
        document.querySelectorAll('.tag-menu.show').forEach(m => m.classList.remove('show'));
      }
    });

    // every distinct tag across the library, for the filter row
    function allTags() {
      const seen = new Map();
      pinned.forEach(c => (c.tags || []).forEach(t => {
        const k = t.toLowerCase();
        if (!seen.has(k)) seen.set(k, t);
      }));
      return [...seen.values()].sort((a, b) => a.localeCompare(b));
    }

    // The tag dropdown that hangs off the prompts section header. It narrows
    // the prompts section only — it is not a top-level filter, because a tag
    // is something a prompt has, not a kind of clip.
    function buildTagFilter() {
      const tags = allTags();
      if (!tags.length) return null;

      const wrap = document.createElement('div');
      wrap.className = 'tag-filter';
      wrap.addEventListener('click', (e) => e.stopPropagation()); // don't collapse the section

      const btn = document.createElement('button');
      btn.className = 'tag-filter-btn' + (activeTag ? ' on' : '');
      btn.id = 'tagFilterBtn';
      btn.innerHTML = `<span></span><span class="caret">▼</span>`;
      btn.firstChild.textContent = activeTag || 'all tags';

      const menu = document.createElement('div');
      menu.className = 'tag-menu';
      menu.id = 'tagMenu';

      const addOption = (label, value) => {
        const b = document.createElement('button');
        b.textContent = label;
        b.dataset.tag = value === null ? '' : value;
        if ((value === null && !activeTag) || (value !== null && activeTag === value)) b.classList.add('on');
        b.addEventListener('click', () => {
          activeTag = value;
          menu.classList.remove('show');
          render();
        });
        menu.appendChild(b);
      };

      addOption('all tags', null);
      const sep = document.createElement('div');
      sep.className = 'menu-sep';
      menu.appendChild(sep);
      tags.forEach(t => addOption(t, t));

      btn.addEventListener('click', () => menu.classList.toggle('show'));
      wrap.appendChild(btn);
      wrap.appendChild(menu);
      return wrap;
    }

    // ---------- the stack ----------
    const MAX_CARDS = 5;
    const GLYPH = { text: 'T', code: '{}', url: '@', img: '●¨' };

    // Deterministic tilt — a card must not re-shuffle its angle every redraw,
    // or the deck twitches every time you add one.
    function tiltFor(id) {
      let h = 0;
      for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
      return ((h % 13) - 6) * 0.9;
    }

    function updateStack(originRect) {
      const clips = selectedClips();
      const n = clips.length;
      const wasShown = stackTrayEl.classList.contains('show');
      stackTrayEl.classList.toggle('show', n > 0);

      if (n === 0) {
        stackDeckEl.querySelectorAll('.stack-card').forEach(el => el.remove());
        stackDrawn = [];
        stackIconUrl = null;
        return;
      }

      stackTitleEl.textContent = n === 1 ? '1 clip stacked' : `${n} clips stacked`;
      if (stackCountEl.textContent !== String(n)) {
        stackCountEl.textContent = String(n);
        if (!reduceMotion && wasShown) {
          stackCountEl.classList.remove('bump');
          void stackCountEl.offsetWidth; // reflow, so the animation restarts
          stackCountEl.classList.add('bump');
        }
      }

      // the deck shows the most recent few; the badge carries the real count
      const shown = clips.slice(-MAX_CARDS);
      const shownIds = shown.map(c => c.id);

      stackDeckEl.querySelectorAll('.stack-card').forEach(el => {
        if (!shownIds.includes(el.dataset.id)) {
          el.classList.add('leaving');
          el.dataset.leaveTimer = String(setTimeout(() => el.remove(), 200));
        }
      });

      shown.forEach((c, i) => {
        let card = stackDeckEl.querySelector(`.stack-card[data-id="${CSS.escape(c.id)}"]`);
        // Re-picking a clip while its card is still fading out would otherwise
        // resurrect a card mid-exit — invisible and shrunk. Catch it and cancel.
        if (card && card.classList.contains('leaving')) {
          clearTimeout(Number(card.dataset.leaveTimer));
          delete card.dataset.leaveTimer;
          card.classList.remove('leaving');
        }
        const isNew = !card;
        if (isNew) {
          card = document.createElement('div');
          card.className = 'stack-card';
          card.dataset.id = c.id;
          card.title = 'click to take this one out';
          card.innerHTML = (c.type === 'img' && c.dataUrl)
            ? `<img src="${c.dataUrl}" alt=""/>`
            : `<span>${GLYPH[c.type] || '·'}</span>`;
          card.addEventListener('click', (e) => {
            e.stopPropagation();
            selected.delete(c.id);
            syncSelection();
          });
          stackDeckEl.appendChild(card);
        }
        const x = i * 8;
        const r = tiltFor(c.id);
        card.style.setProperty('--x', x + 'px');
        card.style.setProperty('--r', r + 'deg');
        card.style.zIndex = String(i + 1);
        if (isNew && originRect && !reduceMotion) flyIn(card, originRect, x, r);
      });

      stackDrawn = shownIds;
      buildStackIcon(clips);
    }

    // card leaves the row it was picked from and lands in the deck
    function flyIn(card, originRect, x, r) {
      const to = card.getBoundingClientRect();
      const dx = originRect.left + originRect.width / 2 - (to.left + to.width / 2);
      const dy = originRect.top + originRect.height / 2 - (to.top + to.height / 2);
      card.animate([
        { transform: `translate(${x + dx}px, ${dy}px) scale(1.5) rotate(0deg)`, opacity: 0.25 },
        { transform: `translateX(${x}px) rotate(${r}deg)`, opacity: 1 },
      ], { duration: 400, easing: 'cubic-bezier(0.22, 1.2, 0.36, 1)' });
    }

    function loadImage(src) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = src;
      });
    }

    // draw an image cover-style inside a square, preserving aspect ratio
    function drawCover(ctx, img, x, y, size) {
      const scale = Math.max(size / img.width, size / img.height);
