name: Release downloads

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Each platform only builds and hands its installer to the next job. Nothing
  # is published here: when these steps uploaded to the release directly, a
  # failure on one platform still left the other's installer published, and
  # v0.1.17 went out as a release with no Mac download at all.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      # keep going so a failure on one platform still reports the other's
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            command: npm run dist:win
            files: dist/*.exe
          - platform: macos
            os: macos-latest
            command: npm run dist:mac
            files: dist/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: ${{ matrix.command }}
        # One env block feeds every leg of the matrix, so each value is guarded
        # on the platform. Handing the mac certificate to the Windows job makes
        # electron-builder try to sign an .exe with it, which fails the build —
        # and with it the whole release, since publish needs both platforms.
        env:
          # Windows is still unsigned; only the mac leg gets an identity.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'macos' }}
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          # Notarization. electron-builder only runs it when these are present,
          # so until the secrets exist the mac build simply stays ad-hoc signed.
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}

      # A green build only proves electron-builder didn't throw. These commands
      # ask macOS itself, and every one of them exits non-zero on failure — so a
      # build that is signed wrong, or notarized not at all, stops here instead
      # of reaching a release. This is also the only Mac in the loop: the app is
      # developed on Windows, so CI is where the signature gets checked at all.
      - name: Prove the signature and the notarization ticket
        if: matrix.platform == 'macos'
        run: |
          for APP in dist/mac*/Stash.app; do
            echo "::group::$APP"
            # the app bundle: expect a Developer ID authority, not adhoc,
            # plus flags=0x10000(runtime) and a Timestamp
            codesign -dv --verbose=4 "$APP"
            # the Swift OCR helper, signed separately via mac.binaries — the
            # piece most likely to be missed, and enough to fail notarization
            codesign -dv --verbose=4 "$APP/Contents/Resources/stash-ocr"
            # apple-events must appear here or auto-paste dies silently
            codesign -d --entitlements - "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            # no stapled ticket means notarization never ran
            xcrun stapler validate "$APP"
            # the verdict users get: accepted, source=Notarized Developer ID
            spctl -a -vvv -t exec "$APP"
            echo "::endgroup::"
          done

      - name: Hand the installer on
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.files }}
          # a build that quietly produces nothing should fail here, not surface
          # later as a release missing a download
          if-no-files-found: error
          retention-days: 1

  # `needs` waits for every platform in the matrix, and a failure in any of them
  # skips this job — so a release is either complete or does not appear.
  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Collect the installers
        uses: actions/download-artifact@v8
        with:
          path: dist
          # every platform's artifact lands flat in dist/, which is what the
          # publish step globs — without this each would sit in its own folder
          merge-multiple: true

      - name: Show what will be published
        run: ls -lh dist

      # The source repo is private, and release assets inherit repo visibility —
      # so publishing here would put the downloads somewhere nobody can reach.
      # Binaries go to a separate public repo that holds no source.
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          repository: harikrsh10/Stash-releases
          # GITHUB_TOKEN only reaches this repo; cross-repo needs a PAT scoped
          # to Stash-releases with Contents: write and nothing else.
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          # the tag lives in this repo, so the target repo has to be told what
          # to call the release it is creating
          tag_name: ${{ github.ref_name }}
          files: dist/*
          make_latest: true
          # not generate_release_notes: it reads the *target* repo's commits,
          # and Stash-releases has none, so the notes would come out empty
          body: |
            Download the build for your Mac or PC below.

            - macOS (Apple Silicon) — `Stash-mac-arm64.dmg`
            - macOS (Intel) — `Stash-mac-x64.dmg`
            - Windows — `Stash-win-x64.exe`

            Upgrading and using auto-paste? macOS ties Accessibility permission
            to an app's signature, so remove Stash under System Settings →
            Privacy & Security → Accessibility and add it back.
